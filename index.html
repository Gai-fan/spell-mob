        note("err", path + ".nameRegex", "正则无法编译：" + error.message + "（整条变体被丢掉）");
      }
    }
    ["sticky", "bossBar", "learner", "adaptive", "disableAttackGoals"].forEach(function (key) {
      checkBool(selector, key, path, note);
    });
  }

  function validateDropEntry(entry, path, note, ctx) {
    if (!C.isObj(entry)) {
      note("err", path, "掉落项必须是对象，否则这一项被跳过。");
      return;
    }
    unknownKeys(entry, DROP_KEYS, path, note);
    var hasItem = entry.item != null && entry.item !== "";
    var hasTable = entry.lootTable != null && entry.lootTable !== "";
    if (!hasItem && !hasTable) {
      note("err", path, "item 与 lootTable 必须有一个，否则这一项被跳过。");
    }
    if (hasItem && hasTable) {
      note("err", path, "item 与 lootTable 只能写一个——两个都写会抛错，这一项被跳过（不是只取 item）。");
    }
    if (hasItem && !C.isId(entry.item)) {
      note("err", path + ".item", "物品 id 不合法：'" + entry.item + "'，这一项被跳过。");
    }
    if (hasTable && !C.isId(entry.lootTable)) {
      note("err", path + ".lootTable", "战利品表 id 不合法：'" + entry.lootTable + "'，这一项被跳过。");
    }
    if (entry.chance !== undefined) {
      if (!C.isNum(entry.chance)) {
        note("err", path + ".chance", "必须是 0..1 的数字，否则这一项被跳过。");
      } else if (entry.chance < 0 || entry.chance > 1) {
        note("warn", path + ".chance", "会被 clamp 到 0..1。");
      }
    }
    ["looting", "requirePlayerKill"].forEach(function (key) {
      checkBool(entry, key, path, note);
    });
    if (entry.requirePlayerKill === undefined) {
      note("note", path + ".requirePlayerKill", "没写就是 true：非玩家击杀不掉落。刷怪笼农场会因此什么都不掉。");
    }
    if (entry.count !== undefined) {
      if (!C.isNum(entry.count) || Math.floor(entry.count) !== entry.count || entry.count < 1) {
        note("err", path + ".count", "必须是 >= 1 的整数，否则这一项被跳过。");
      }
      if (entry.min != null || entry.max != null) {
        note("warn", path, "写了 count 时 min / max 会被忽略。");
      }
      return;
    }
    var min = entry.min != null ? entry.min : 1;
    var max = entry.max != null ? entry.max : min;
    if (!C.isNum(min) || Math.floor(min) !== min) {
      note("err", path + ".min", "必须是整数，否则这一项被跳过。");
      return;
    }
    if (!C.isNum(max) || Math.floor(max) !== max) {
      note("err", path + ".max", "必须是整数，否则这一项被跳过。");
      return;
    }
    if (min < 1) {
      note("err", path + ".min", "必须 >= 1（0 会让这一项被跳过）。");
    } else if (max < min) {
      note("err", path + ".max", "max 不能小于 min，否则这一项被跳过（不是自动夹取）。");
    }
  }

  function validateDropRule(rule, path, note, inVariant, ctx) {
    if (!C.isObj(rule)) {
      note("err", path, "掉落规则必须是对象，否则整条规则被丢掉。");
      return;
    }
    unknownKeys(rule, DROP_RULE_KEYS, path, note);
    if (rule.select !== undefined) {
      validateSelector(rule.select, path + ".select", note, ctx);
      if (C.isObj(rule.select) && (rule.select.healthBelow != null || rule.select.healthAbove != null)) {
        note("warn", path + ".select",
          "掉落是在死亡事件里结算的，那时血量比例为 0：healthBelow 永远成立、healthAbove 永远不成立。",
          "阶段专属掉落请写进 variants[i].dropRules。");
      }
    }
    if (rule.chance !== undefined) {
      if (!C.isNum(rule.chance)) {
        note("err", path + ".chance", "必须是数字，否则整条规则被丢掉。");
      } else if (rule.chance < 0 || rule.chance > 1) {
        note("warn", path + ".chance", "会被 clamp 到 0..1。");
      }
    }
    if (!C.isArr(rule.drops)) {
      note("err", path + ".drops", "必须有 drops 数组，否则整条规则被丢掉。");
      return;
    }
    if (rule.drops.length === 0) {
      note("err", path + ".drops", "空数组：解析器会报 drops has no usable entries 并丢掉整条规则。");
      return;
    }
    rule.drops.forEach(function (entry, index) {
      validateDropEntry(entry, path + ".drops[" + index + "]", note, ctx);
    });
  }

  function validateCast(cast, path, note, ctx) {
    if (!C.isObj(cast)) {
      note("err", path, "施法条目必须是对象，否则整条被丢掉。");
      return;
    }
    unknownKeys(cast, CAST_KEYS, path, note);
    if (!cast.spell) {
      note("err", path + ".spell", "缺少 spell，这条会被丢掉。");
    } else if (!C.isId(cast.spell)) {
      note("err", path + ".spell", "法术 id 不合法：'" + cast.spell + "'。");
    } else if (!ctx.spellIndex[cast.spell]) {
      note("warn", path + ".spell",
        "不在内置的 " + ctx.spellCount + " 个法术里。拼错、或该法术在 ISS 配置里被禁用，都会让整条失效。");
    }
    checkNumbers(cast, ["level", "cooldown", "priority", "range", "castTime", "checkInterval", "chance"], path, note);
    checkBool(cast, "interruptOnDamage", path, note);
    checkBool(cast, "repeatOnCast", path, note);
    if (cast.cooldownGroup != null) {
      if (typeof cast.cooldownGroup !== "string" || !/^[a-z0-9_.-]{1,32}$/.test(cast.cooldownGroup)) {
        note("err", path + ".cooldownGroup",
          "只能是 1–32 个 a-z 0-9 _ . - 字符，否则整条被丢掉。",
          "改成小写字母与数字，例如 blaze_breath、phase_2。");
      }
    }
    if (C.isNum(cast.chance) && (cast.chance < 0 || cast.chance > 1)) {
      note("warn", path + ".chance", "会被 clamp 到 0..1。");
    }
    if (C.isNum(cast.range) && cast.range < 1) {
      note("warn", path + ".range", "下限是 1。");
    }
    if (C.isNum(cast.checkInterval) && (cast.checkInterval < 1 || cast.checkInterval > 200)) {
      note("warn", path + ".checkInterval", "会被 clamp 到 1..200。");
    }
    if (C.isNum(cast.priority) && (cast.priority < 0 || cast.priority > 9)) {
      note("warn", path + ".priority", "会被 clamp 到 0..9。");
    }
    if (C.isNum(cast.level) && (cast.level < 1 || cast.level > 10)) {
      note("warn", path + ".level", "clamp 到 1..该法术上限（最高 10）。");
    }
    if (C.isNum(cast.castTime) && cast.castTime === -1) {
      note("note", path + ".castTime", "-1 表示用 ISS 自己的吟唱时间。");
    }
    if (C.isNum(cast.cooldown) && cast.cooldown === -1) {
      note("note", path + ".cooldown", "-1 表示用 ISS 自己的冷却。");
    }
    validateTarget(cast.target, path + ".target", note, ctx);
    validateConditions(cast.conditions, path + ".conditions", note, ctx);
  }

  function isTriggerData(node) {
    return ["goals", "onHurt", "onTarget", "onDeath", "onKill", "dropRules", "disableAttackGoals"].some(function (key) {
      return node[key] !== undefined;
    });
  }

  function validateVariant(variant, path, note, ctx) {
    if (!C.isObj(variant)) {
      note("warn", path, "变体必须是对象，否则解析器会跳过它（不会让整份文件失败）。");
      return;
    }
    Object.keys(variant).forEach(function (key) {
      if (key.charAt(0) === "_") return;
      if (VARIANT_KEYS.indexOf(key) < 0) {
        note("warn", path + "." + key, "不认识的键 '" + key + "'，解析器会忽略它。");
      }
    });
    validateSelector(variant.select, path + ".select", note, ctx);
    ["override", "sticky", "learner", "adaptive", "bossBar", "disableAttackGoals"].forEach(function (key) {
      checkBool(variant, key, path, note);
    });
    validatePhase(variant.onPhase, path + ".onPhase", note, ctx);
    if (variant.goals !== undefined && !C.isArr(variant.goals)) {
      note("err", path + ".goals", "goals 必须是数组，否则整条变体被丢掉。");
    } else if (C.isArr(variant.goals)) {
      variant.goals.forEach(function (cast, index) { validateCast(cast, path + ".goals[" + index + "]", note, ctx); });
    }
    C.TRIGGERS.forEach(function (trigger) {
      if (variant[trigger.key] === undefined) return;
      if (!C.isObj(variant[trigger.key])) {
        note("err", path + "." + trigger.key, "触发器必须是对象，否则整条变体被丢掉。");
        return;
      }
      validateCast(variant[trigger.key], path + "." + trigger.key, note, ctx);
    });
    if (variant.dropRules !== undefined && !C.isArr(variant.dropRules)) {
      note("err", path + ".dropRules", "dropRules 必须是数组，否则整条变体被丢掉。");
    } else if (C.isArr(variant.dropRules)) {
      variant.dropRules.forEach(function (rule, index) {
        validateDropRule(rule, path + ".dropRules[" + index + "]", note, true, ctx);
      });
    }
    var override = variant.override !== false;
    if (override && !isTriggerData(variant)) {
      note("warn", path,
        "override 默认是 true，但这个变体一条规则都没写：一旦命中，这个生物会变成不会施法的空壳。",
        "要么补上 goals / 触发器 / dropRules，要么写 \"override\": false 让它继承物种默认规则。");
    }
    if (variant.sticky !== undefined && isTriggerData(variant) === false && !override) {
      note("note", path, "sticky + override:false：阶段会锁住，但规则还是物种默认的。");
    }
  }

  /** 变体的「个体标识」：只由 name / nameRegex / tags / tamed 决定，血量不参与。 */
  C.selectIdentityKey = function (selector) {
    var s = C.isObj(selector) ? selector : {};
    var tags = C.isArr(s.tags) ? s.tags.map(String).slice().sort() : [];
    return JSON.stringify([
      s.name == null ? null : String(s.name),
      s.nameRegex == null ? null : String(s.nameRegex),
      tags,
      s.tamed == null ? null : !!s.tamed
    ]);
  };

  /** 变体顺序检查：同一组（同样的 tags / 名字 / 驯服条件）里下标越小 = 越深，阈值必须单调不减。 */
  C.checkVariantOrder = function (variants, note) {
    if (!C.isArr(variants) || variants.length < 2) return;
    var thresholds = [];
    var lastByGroup = {};
    variants.forEach(function (variant, index) {
      if (!C.isObj(variant) || !C.isObj(variant.select)) return;
      var select = variant.select;
      var group = C.selectIdentityKey(select);
      if (C.isNum(select.healthBelow)) thresholds.push({ value: select.healthBelow, index: index, key: "healthBelow", group: group });
      else if (C.isNum(select.healthAbove)) thresholds.push({ value: select.healthAbove, index: index, key: "healthAbove", group: group });
    });
    for (var i = 0; i < thresholds.length; i++) {
      var cur = thresholds[i];
      var prev = lastByGroup[cur.group];
      lastByGroup[cur.group] = cur;
      if (!prev) continue;
      if (cur.value < prev.value) {
        note("warn", "variants[" + cur.index + "].select." + cur.key,
          "阶段顺序反了：下标越小代表越深的阶段，血量阈值必须随下标递增。"
          + "现在前一条是 " + prev.value + "、这一条是 " + cur.value
          + "，血量掉到 " + cur.value + " 以下时两条都命中，解析器只会取更小的下标，"
          + "于是永远停在前一条——更深的那条阶段再也进不去。",
          "把阈值小的写在前面（按 healthBelow 从小到大），或点「按阈值排序」自动排。",
          "sort-variants");
      }
    }
  };

  C.validateRules = function (rules, ctx) {
    var diags = [];
    var context = {
      spellIndex: {},
      spellCount: 0,
      entityId: ctx && ctx.entityId
    };
    ((ctx && ctx.spells) || data().SPELLS || []).forEach(function (entry) {
      context.spellIndex[entry.id] = entry;
    });
    context.spellCount = Object.keys(context.spellIndex).length;

    function note(sev, path, msg, hint, fix) {
      diags.push({ sev: sev, path: path || "", msg: msg, hint: hint || "", fix: fix || "" });
    }

    if (!C.isObj(rules)) {
      note("err", "", "文件内容必须是 JSON 对象。");
      return diags;
    }
    if (context.entityId && !C.splitEntityId(context.entityId)) {
      note("err", "", "实体 id 不合法，文件名没法用。");
    }
    unknownKeys(rules, ROOT_KEYS, "", note);
    if (!isTriggerData(rules) && !C.isArr(rules.variants)) {
      note("warn", "", "根对象里没有任何规则，也没有 variants，这个文件会被直接忽略（解析器返回 null）。");
      return diags;
    }
    if (rules.bossBar !== undefined && typeof rules.bossBar !== "boolean") {
      note("err", "bossBar", "根层 bossBar 必须是 true / false（或干脆不写：不写=跟随 presentation 配置）。");
    }
    if (rules.disableAttackGoals !== undefined && typeof rules.disableAttackGoals !== "boolean") {
      note("err", "disableAttackGoals", "根层 disableAttackGoals 必须是 true / false；不写就是 false（保留原版近战 / 远程攻击 goal）。");
    }
    if (rules.variants !== undefined) {
      if (!C.isArr(rules.variants)) {
        note("err", "variants", "variants 必须是数组，否则整份文件加载失败。");
      } else {
        rules.variants.forEach(function (variant, index) {
          validateVariant(variant, "variants[" + index + "]", note, context);
        });
        C.checkVariantOrder(rules.variants, note);
        if (rules.variants.length > 1) {
          var last = rules.variants[rules.variants.length - 1];
          if (C.isObj(last) && last.sticky === true) {
            note("warn", "variants", "最后一条也写了 sticky，但锁定只能朝更小的索引移动，写在这里不会生效。",
            "删掉这条 sticky（不写和写 false 一样）。", "clear-dead-sticky");
          }
        }
        var allSticky = rules.variants.every(function (variant) {
          return C.isObj(variant) && variant.sticky === true;
        });
        if (rules.variants.length > 1 && allSticky) {
          note("note", "variants", "每条都写了 sticky：阶段只会单向锁定，不会退回。");
        }
      }
    }
    if (rules.goals !== undefined && !C.isArr(rules.goals)) {
      note("err", "goals", "goals 必须是数组，否则整份文件加载失败。");
    } else if (C.isArr(rules.goals)) {
      rules.goals.forEach(function (cast, index) { validateCast(cast, "goals[" + index + "]", note, context); });
    }
    C.TRIGGERS.forEach(function (trigger) {
      if (rules[trigger.key] === undefined) return;
      if (!C.isObj(rules[trigger.key])) {
        note("err", trigger.key, "触发器必须是单个 cast 对象，数组会抛错、整份文件加载失败。");
        return;
      }
      validateCast(rules[trigger.key], trigger.key, note, context);
    });
    if (rules.dropRules !== undefined) {
      if (!C.isArr(rules.dropRules)) {
        note("err", "dropRules", "dropRules 必须是数组，否则整份文件加载失败。");
      } else {
        rules.dropRules.forEach(function (rule, index) {
          validateDropRule(rule, "dropRules[" + index + "]", note, false, context);
        });
      }
    }
    if (!C.isArr(rules.variants) && !C.isArr(rules.goals) && !isTriggerData(rules)) {
      note("note", "", "只有 variants，没有物种默认规则：变体没命中时这个生物不会施法（这是合法的写法）。");
    }
    /* 一个文件里每条掉落都刷一遍 requirePlayerKill 太吵：合成一条，还带一个一键补写的标记。 */
    var killNotes = diags.filter(function (diag) {
      return /\.requirePlayerKill$/.test(diag.path) && diag.msg.indexOf("没写就是 true") === 0;
    });
    if (killNotes.length) {
      diags = diags.filter(function (diag) { return killNotes.indexOf(diag) < 0; });
      var where = killNotes[0].path.split(".")[0];
      note("note", where,
        killNotes.length > 1
          ? "这个文件里有 " + killNotes.length + " 条掉落没写 requirePlayerKill，全部按 true 处理：非玩家击杀不掉落。"
          : "这条掉落没写 requirePlayerKill，默认 true：非玩家击杀不掉落。",
        "刷怪笼农场想掉东西就显式写 false；点一键修复只是把默认值写出来，行为不变。",
        "explicit-player-kill");
    }
    return diags;
  };

  /* ------------------------------------------------------------ 模拟器 */

  /**
   * 变体命中判断，逐条对应 VariantSelector.matches()。
   * snapshot = { healthFraction, name, tags, tamed }
   */
  C.selectorMatches = function (selector, snapshot) {
    if (selector === undefined || selector === null) return true;
    if (!C.isObj(selector)) return false;
    var snap = snapshot || {};
    if (selector.name != null) {
      if (String(snap.name || "") !== String(selector.name)) return false;
    }
    if (selector.nameRegex != null) {
      var pattern;
      try {
        pattern = new RegExp("(?:" + String(selector.nameRegex) + ")");
      } catch (error) {
        return false;
      }
      // Java 用 matcher().matches()：必须整串匹配，不是 find()
      if (!pattern.test(String(snap.name || ""))) return false;
    }
    if (C.isArr(selector.tags)) {
      var own = C.isArr(snap.tags) ? snap.tags : [];
      for (var i = 0; i < selector.tags.length; i++) {
        if (own.indexOf(selector.tags[i]) < 0) return false;
      }
    }
    if (typeof selector.tamed === "boolean") {
      if (Boolean(snap.tamed) !== selector.tamed) return false;
    }
    var fraction = C.isNum(snap.healthFraction) ? snap.healthFraction : 1;
    if (C.isNum(selector.healthBelow) && fraction >= selector.healthBelow) return false;
    if (C.isNum(selector.healthAbove) && fraction <= selector.healthAbove) return false;
    return true;
  };

  /** 变体的血量阈值：healthBelow 优先，其次 healthAbove，都没有就排到最后。 */
  C.variantThreshold = function (variant) {
    if (!C.isObj(variant) || !C.isObj(variant.select)) return Infinity;
    if (C.isNum(variant.select.healthBelow)) return variant.select.healthBelow;
    if (C.isNum(variant.select.healthAbove)) return variant.select.healthAbove;
    return Infinity;
  };

  /**
   * 按「下标越小 = 越深阶段」排好序的副本。只在同一组内部换位置：
   * 不同 tags / 名字的变体属于不同个体，互相之间没有深浅关系，不能被排序打乱。
   */
  C.sortVariants = function (variants) {
    var list = (C.isArr(variants) ? variants : []).slice();
    var groups = {};
    list.forEach(function (variant, index) {
      var key = C.selectIdentityKey(C.isObj(variant) ? variant.select : null);
      if (!groups[key]) groups[key] = [];
      groups[key].push(index);
    });
    Object.keys(groups).forEach(function (key) {
      var slots = groups[key];
      var ordered = slots.map(function (slot, position) {
        return { variant: list[slot], position: position, threshold: C.variantThreshold(list[slot]) };
      });
      ordered.sort(function (a, b) {
        if (a.threshold === b.threshold) return a.position - b.position;
        if (a.threshold === Infinity) return 1;
        if (b.threshold === Infinity) return -1;
        return a.threshold - b.threshold;
      });
      slots.forEach(function (slot, i) { list[slot] = ordered[i].variant; });
    });
    return list;
  };

  /** SpellCasterData.mergeWith：goals 拼接（变体在前），四个触发器只在变体没写时回落。 */
  C.mergeData = function (own, fallback) {
    var out = {};
    var keys = Object.keys(fallback || {});
    for (var i = 0; i < keys.length; i++) out[keys[i]] = fallback[keys[i]];
    keys = Object.keys(own || {});
    for (var j = 0; j < keys.length; j++) {
      if (keys[j] === "goals") continue;
      out[keys[j]] = own[keys[j]];
    }
    var goals = [];
    if (C.isArr(own && own.goals)) goals = goals.concat(own.goals);
    if (C.isArr(fallback && fallback.goals)) goals = goals.concat(fallback.goals);
    if (goals.length) out.goals = goals;
    else delete out.goals;
    return out;
  };

  /** 解析出的「这一阶段实际生效的规则」。index = -1 表示物种默认。 */
  C.effectiveRules = function (rules, index) {
    if (!C.isObj(rules)) return null;
    if (index == null || index < 0) return rules;
    var variant = C.isArr(rules.variants) ? rules.variants[index] : null;
    if (!C.isObj(variant)) return rules;
    if (variant.override === false) return C.mergeData(variant, rules);
    return variant;
  };

  /** 三态 bossBar：变体（含 select 里写的）→ 根层 → null（跟随 presentation 配置）。 */
  C.bossBarFor = function (rules, index) {
    if (!C.isObj(rules)) return null;
    var variant = C.isArr(rules.variants) && index >= 0 ? rules.variants[index] : null;
    if (C.isObj(variant)) {
      if (typeof variant.bossBar === "boolean") return variant.bossBar;
      if (C.isObj(variant.select) && typeof variant.select.bossBar === "boolean") return variant.select.bossBar;
    }
    if (typeof rules.bossBar === "boolean") return rules.bossBar;
    return null;
  };

  /**
   * 原版攻击 goal 的三态：变体对象 → 变体 select → 根层 → false。
   * 对应 Java SpellCasterRules.disableAttackGoals(index)；默认 false 表示不动原版 goal。
   */
  C.disableAttackGoalsFor = function (rules, index) {
    if (!C.isObj(rules)) return false;
    var variant = C.isArr(rules.variants) && index >= 0 ? rules.variants[index] : null;
    if (C.isObj(variant)) {
      if (typeof variant.disableAttackGoals === "boolean") return variant.disableAttackGoals;
      if (C.isObj(variant.select) && typeof variant.select.disableAttackGoals === "boolean") return variant.select.disableAttackGoals;
    }
    return rules.disableAttackGoals === true;
  };

  /**
   * 血量扫描：从 100% 掉到 0% 时阶段怎么走。base 是模拟器里填的名字 / 标签 / 驯服，
   * 不传就按“没有名字、没有标签、未驯服”扫。
   * 对应 SpellCasterRules.effectiveIndex：sticky 变体一旦命中就锁在最小下标。
   */
  C.phaseSweep = function (rules, steps, base) {
    var count = steps || 20;
    var variants = C.isArr(rules && rules.variants) ? rules.variants : [];
    var seed = C.isObj(base) ? base : {};
    var rows = [];
    var locked = -1;
    function sticky(index) {
      return index >= 0 && C.isObj(variants[index]) && variants[index].sticky === true;
    }
    for (var i = 0; i <= count; i++) {
      var fraction = 1 - i / count;
      var snapshot = {
        healthFraction: fraction,
        name: seed.name == null ? null : seed.name,
        tags: C.isArr(seed.tags) ? seed.tags : [],
        tamed: !!seed.tamed
      };
      var matched = -1;
      for (var v = 0; v < variants.length; v++) {
        if (C.isObj(variants[v]) && C.selectorMatches(variants[v].select, snapshot)) {
          matched = v;
          break;
        }
      }
      var effective = sticky(locked) ? (matched < 0 ? locked : Math.min(matched, locked)) : matched;
      if (sticky(effective)) locked = effective;
      rows.push({ healthFraction: fraction, matched: matched, effective: effective, locked: locked });
    }
    return rows;
  };

  /* ------------------------------------------------------------ 统计 */

  C.spellMeta = function (id, spells) {
    var list = spells || data().SPELLS || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return list[i];
    }
    return null;
  };

  function schoolColor(school) {
    var colors = data().SCHOOL_COLORS || {};

      local.u16(stamp.date);

  /* ---------------------------------------------------------------- 工具 */

  function esc(value) {

    for (var i = 0; i < parts.length; i++) {

    }

  }

  function parentOf(path) {

    var cur = state.project;
    for (var i = 0; i < parts.length - 1; i++) {

      if (problem.entity !== id) return;
      if (problem.sev === "err") errors++;
      else if (problem.sev === "warn") warns++;
      else notes++;
    });
    return { errors: errors, warns: warns, notes: notes };
  }

  function renderSidebar() {
    var allIds = Object.keys(state.project.entities);
    var query = String(state.search || "").trim().toLowerCase();
    var ids = query ? allIds.filter(function (id) {
      var info = entityInfo(id);
      return (id + " " + (info ? info.zh + " " + info.en : "")).toLowerCase().indexOf(query) >= 0;
    }) : allIds;
    $("#entity-count").textContent = query ? ids.length + " / " + allIds.length : String(allIds.length);
    if (!allIds.length) {
      $("#entity-list").innerHTML = '<li class="empty">还没有实体，点“新建”建一个，或从示范模板开始。</li>';
      return;
    }
    if (!ids.length) {
      $("#entity-list").innerHTML = '<li class="empty">没有实体匹配“' + esc(state.search) + '”。</li>';
      return;
    }
    $("#entity-list").innerHTML = ids.map(function (id) {
      var rules = state.project.entities[id] || {};
      var goals = isArr(rules.goals) ? rules.goals.length : 0;
      var variants = isArr(rules.variants) ? rules.variants.length : 0;
      var stats = problemsFor(id);
      var meta = [];
      meta.push(goals + " 主动");
      if (variants) meta.push(variants + " 变体");
      if (isArr(rules.dropRules) && rules.dropRules.length) meta.push(rules.dropRules.length + " 掉落");
      var dots = "";
      if (stats.errors) dots += '<span class="dot err" title="' + stats.errors + ' 个错误"></span>';
      if (stats.warns) dots += '<span class="dot warn" title="' + stats.warns + ' 个警告"></span>';
      if (stats.notes) dots += '<span class="dot note" title="' + stats.notes + ' 条提示"></span>';
      var info = entityInfo(id);
      return '<li class="entity' + (id === state.selected ? " on" : "") + '" data-act="select-entity" data-id="' + esc(id) + '">'
        + '<div class="eid">' + esc(id) + (info ? '' : ' <span class="tag">自定义</span>') + '</div>'
        + '<div class="meta">' + esc(meta.join(" · ")) + dots + '</div>'
        + '</li>';
    }).join("");
  }

  /* ------------------------------------------------- 渲染：右侧三个面板 */

  function renderJson() {
    var file = selectedFile();
    var out = $("#json-out");
    var head = $("#json-file");
    if (!file) {
      head.textContent = "";
      out.textContent = "// 左边选一个实体";
      return;
    }
    head.textContent = file.path;
    var text = file.text.replace(/\n$/, "");
    var ranges = state.jsonHl ? rootKeyRanges(text, state.jsonHl) : [];
    if (!ranges.length) {
      out.textContent = text;
      return;
    }
    var html = "";
    var at = 0;
    ranges.forEach(function (range) {
      if (range.start < at) return;
      html += esc(text.slice(at, range.start))
        + '<mark class="json-hl">' + esc(text.slice(range.start, range.end)) + "</mark>";
      at = range.end;
    });
    out.innerHTML = html + esc(text.slice(at));
  }

  /* ------------------------------------------- 章节导航：跳转 + JSON 高亮 */

  function skipJsonString(text, from) {
    var i = from + 1;
    while (i < text.length) {
      var ch = text.charAt(i);
      if (ch === "\\") { i += 2; continue; }
      if (ch === '"') return i + 1;
      i++;
    }
    return text.length;
  }

  /** 从 from 开始（可以带空白）跳过一个完整的 JSON 值，返回它结束后的下标。 */
  function skipJsonValue(text, from) {
    var i = from;
    while (i < text.length && /\s/.test(text.charAt(i))) i++;
    if (i >= text.length) return text.length;
    var ch = text.charAt(i);
    if (ch === '"') return skipJsonString(text, i);
    if (ch === "{" || ch === "[") {
      var depth = 0;
      while (i < text.length) {
        var c = text.charAt(i);
        if (c === '"') { i = skipJsonString(text, i); continue; }
        if (c === "{" || c === "[") depth++;
        else if (c === "}" || c === "]") {
          depth--;
          if (depth === 0) return i + 1;
        }
        i++;
      }
      return text.length;
    }
    while (i < text.length) {
      var stop = text.charAt(i);
      if (stop === "," || stop === "}" || stop === "]") break;
      i++;
    }
    while (i > from && /\s/.test(text.charAt(i - 1))) i--;
    return i;
  }

  /** 根层某几个键（连同值）在文本里的区间，用来给右侧 JSON 加亮。 */
  function rootKeyRanges(text, keys) {
    var want = {};
    (keys || []).forEach(function (key) { want[key] = true; });
    var ranges = [];
    var depth = 0;
    var i = 0;
    while (i < text.length) {
      var ch = text.charAt(i);
      if (ch === '"') {
        var end = skipJsonString(text, i);
        if (depth === 1 && want[text.slice(i + 1, end - 1)]) {
          var colon = text.indexOf(":", end);
          if (colon >= 0) {
            var valueEnd = skipJsonValue(text, colon + 1);
            if (valueEnd > end) {
              ranges.push({ start: i, end: valueEnd });
              i = valueEnd;
              continue;
            }
          }
        }
        i = end;
        continue;
      }
      if (ch === "{" || ch === "[") depth++;
      else if (ch === "}" || ch === "]") depth--;
      i++;
    }
    return ranges;
  }


  /**
   * 点章节导航条：中栏滚到那张卡（钉住的导航条高度要扣掉），
   * 右栏切到 JSON 并把对应的根级键加亮。
   */
  function jumpToSection(key) {
    var section = sectionByKey(key);
    if (!section) return;
    var host = $("#editor");
    var target = document.getElementById("sec-" + key);
    if (host && target) {
      var nav = host.querySelector(".secnav");
      var offset = nav ? nav.offsetHeight : 0;
      var delta = target.getBoundingClientRect().top - host.getBoundingClientRect().top - offset;
      host.scrollTop = Math.max(0, host.scrollTop + delta);
    }
    state.jsonHl = section.keys;
    state.tab = "json";
    renderPanes();
    renderJson();
    var pane = $("#pane-json");
    var mark = document.querySelector("#json-out .json-hl");
    if (pane && mark) {
      var top = mark.getBoundingClientRect().top - pane.getBoundingClientRect().top + pane.scrollTop;
      pane.scrollTop = Math.max(0, top - Math.round(pane.clientHeight / 3));
    }
  }

  /* 诊断里的路径是 a.b[0].c，字段的 data-path 是 a/b/0/c；只差这一层转换。 */
  function diagToPath(diagPath) {
    return String(diagPath || "")
      .replace(/\[(\d+)\]/g, "/$1")
      .replace(/\./g, "/")
      .replace(/^\/+|\/+$/g, "");
  }

  var ROOT_SECTIONS = {
    bossBar: "bossbar",
    disableAttackGoals: "behavior",
    goals: "goals",
    onHurt: "triggers", onTarget: "triggers", onDeath: "triggers", onKill: "triggers",
    dropRules: "drops",
    variants: "variants"
  };

  /**
   * 点检查面板里的一条：切到对应实体 → 把沿途的卡片 / 施法条目 / details 全部展开
   * → 中栏滚到那个字段并闪一下。字段本身没渲染出来（比如整个键没写）时，
   * 退一步找它下面的第一个字段，再退一步跳到所在章节。
   */
  function gotoProblem(index) {
    var problem = state.problems[index];
    if (!problem || !problem.entity) return;
    if (!state.project.entities[problem.entity]) {
      toast("这个实体已经从工程里删掉了。");
      return;
    }
    state.selected = problem.entity;
    var rel = diagToPath(problem.path);
    var host = $("#editor");
    if (!rel) {
      host.scrollTop = 0;
      return;
    }
    var domPath = "entities/" + problem.entity + "/" + rel;
    var parts = domPath.split("/");
    var prefix = "";
    for (var i = 0; i < parts.length; i++) {
      prefix = prefix ? prefix + "/" + parts[i] : parts[i];
      state.open[prefix] = true;              // <details> 的 open
      state.open["cast:" + prefix] = true;    // 施法条目的折叠
      state.open["variant:" + prefix] = true; // 变体条目的折叠
    }
    var section = ROOT_SECTIONS[rel.split("/")[0]];
    if (section) state.open["card:" + section] = true;
    renderAll();
    host = $("#editor");
    var target = host.querySelector('[data-path="' + domPath.replace(/"/g, '\\"') + '"]');
    if (!target) {
      var all = host.querySelectorAll("[data-path]");
      for (var a = 0; a < all.length; a++) {
        if (String(all[a].getAttribute("data-path")).indexOf(domPath + "/") === 0) { target = all[a]; break; }
      }
    }
    if (!target) {
      if (section) jumpToSection(section);
      else toast("这条诊断说的是整块配置，界面上没有单独的字段。");
      return;
    }
    var nav = host.querySelector(".secnav");
    var offset = nav ? nav.offsetHeight : 0;
    var delta = target.getBoundingClientRect().top - host.getBoundingClientRect().top - offset - 18;
    host.scrollTop = Math.max(0, host.scrollTop + delta);
    target.classList.remove("flash");
    void target.offsetWidth;                  // 让动画能重新开始
    target.classList.add("flash");
    setTimeout(function () { target.classList.remove("flash"); }, 1500);
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(target.tagName) && target.focus) {
      target.focus({ preventScroll: true });
    }
  }

  /**
   * 三级诊断：err 会让这条配置被丢掉，warn 是模组会忽略或悄悄改写，
   * note 只是提醒（比如某个键给了默认值）。每条都带修复建议。
   */
  /**
   * 检查页的过滤级别。note 大多是「没写就是默认值」这类提醒，
   * 一个文件几百条的时候全列出来会把真正的错误埋掉。
   */
  var PROBLEM_FILTERS = {
    all: function () { return true; },
    serious: function (problem) { return problem.sev !== "note"; },
    err: function (problem) { return problem.sev === "err"; }
  };

  /** 能自动修的诊断（core.js 在 note 里带了 fix 标记）。 */
  function fixableProblems() {
    return state.problems.filter(function (problem) {
      return problem.fix && problem.entity && state.project.entities[problem.entity];
    });
  }

  function renderProblems() {
    var list = $("#problem-list");
    var counts = { err: 0, warn: 0, note: 0 };
    state.problems.forEach(function (problem) {
      counts[problem.sev] = (counts[problem.sev] || 0) + 1;
    });
    $("#problem-count").textContent = String(state.problems.length);

    var filter = PROBLEM_FILTERS[state.problemFilter] || PROBLEM_FILTERS.all;
    var shown = [];
    state.problems.forEach(function (problem, index) {
      if (filter(problem)) shown.push({ problem: problem, index: index });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#pane-problems [data-act="problem-filter"]'), function (button) {
      button.classList.toggle("on", button.getAttribute("data-filter") === state.problemFilter);
    });
    var fixAllBtn = $("#fix-all");
    if (fixAllBtn) {
      var fixables = fixableProblems();
      fixAllBtn.hidden = !fixables.length;
      fixAllBtn.textContent = "一键修复（" + fixables.length + "）";
      fixAllBtn.title = fixables.length
        ? "把能自动修的 " + fixables.length + " 条一起改掉：" + fixables.map(function (p) { return fixTitle(p.fix); }).join("、")
        : "没有能自动修的问题";
    }

    var summary = $("#problem-summary");
    if (summary) {
      var hidden = state.problems.length - shown.length;
      summary.innerHTML = (state.problems.length
        ? '<span class="sev err">错误 ' + counts.err + "</span>"
          + '<span class="sev warn">警告 ' + counts.warn + "</span>"
          + '<span class="sev note">提示 ' + counts.note + "</span>"
        : '<span class="sev ok">全部通过</span>')
        + (hidden > 0 ? '<span class="hint">已按过滤隐藏 ' + hidden + " 条</span>" : "");
    }
    if (!state.problems.length) {
      list.innerHTML = '<li class="empty">没有发现问题，可以直接导出。</li>';
      return;
    }
    if (!shown.length) {
      list.innerHTML = '<li class="empty">当前过滤下没有诊断。切到「全部」看看。</li>';
      return;
    }
    list.innerHTML = shown.map(function (row) {
      var problem = row.problem;
      var index = row.index;
      /* 点一条诊断 → 中栏跳到那个字段。整条都是按钮，键盘也能按。 */
      var jumpable = problem.entity && state.project.entities[problem.entity];
      return '<li class="problem ' + problem.sev + (jumpable ? " jumpable" : "") + '"'
        + (jumpable
          ? ' data-act="goto-problem" data-i="' + index + '" tabindex="0" role="button" title="跳到中栏对应的字段"'
          : "")
        + '>'
        + '<div class="where">' + esc(problem.where) + "</div>"
        + '<div class="msg">' + esc(problem.msg) + "</div>"
        + (problem.hint ? '<div class="hint">→ ' + esc(problem.hint) + "</div>" : "")
        + (jumpable ? '<div class="jump-hint">跳到这个字段 →</div>' : "")
        + (problem.fix ? '<button class="btn mini fix" data-act="fix-problem" data-i="' + index + '">'
          + esc(fixTitle(problem.fix)) + "</button>" : "")
        + "</li>";
    }).join("");
  }

  function fixTitle(fix) {
    if (fix === "sort-variants") return "按阈值排序";
    if (fix === "clear-dead-sticky") return "删掉无效 sticky";
    if (fix === "explicit-player-kill") return "写出默认值";
    return "修复";
  }

  /** 递归找出所有掉落条目，把没写的 requirePlayerKill 补成 true（默认值，行为不变）。 */
  function writePlayerKillDefaults(node) {
    var changed = 0;
    (function walk(value) {
      if (isArr(value)) {
        value.forEach(walk);
        return;
      }
      if (!isObj(value)) return;
      Object.keys(value).forEach(function (key) {
        var child = value[key];
        if (key === "drops" && isArr(child)) {
          child.forEach(function (entry) {
            if (isObj(entry) && (entry.item !== undefined || entry.lootTable !== undefined)
              && entry.requirePlayerKill === undefined) {
              entry.requirePlayerKill = true;
              changed += 1;
            }
          });
        }
        if (isObj(child) || isArr(child)) walk(child);
      });
    })(node);
    return changed;
  }

  /** 按 fix 标记改数据；返回改了点什么，用于 toast。 */
  function applyFix(fix, entityId) {
    var rules = state.project.entities[entityId];
    if (!isObj(rules)) return 0;
    if (fix === "sort-variants") {
      if (!isArr(rules.variants) || rules.variants.length < 2) return 0;
      var sorted = CORE.sortVariants(rules.variants);
      rules.variants.length = 0;
      Array.prototype.push.apply(rules.variants, sorted);
      return 1;
    }
    if (fix === "clear-dead-sticky") {
      if (!isArr(rules.variants) || !rules.variants.length) return 0;
      var last = rules.variants[rules.variants.length - 1];
      if (!isObj(last) || last.sticky === undefined) return 0;
      delete last.sticky;
      return 1;
    }
    if (fix === "explicit-player-kill") {
      return writePlayerKillDefaults(rules);
    }
    return 0;
  }

  function runFixes(rows) {
    var touched = 0;
    var entities = {};
    rows.forEach(function (row) {
      var problem = state.problems[row];
      if (!problem || !problem.fix) return;
      var changed = applyFix(problem.fix, problem.entity);
      if (changed) {
        touched += 1;
        entities[problem.entity] = true;
      }
    });
    if (!touched) {
      toast("没有改需要改的地方。");
      return;
    }
    validate();
    renderAll();
    toast("已修复 " + touched + " 处（" + Object.keys(entities).length + " 个实体）。可以 Ctrl+Z 撤销。");
  }

  function renderFiles() {
    var files = buildFiles();
    $("#file-list").innerHTML = files.map(function (file) {
      var size = byteLen(file.text);
      var id = entityIdForPath(file.path);
      return '<li class="file' + (id && id === state.selected ? " on" : "") + '"'
        + (id ? ' data-act="select-entity" data-id="' + esc(id) + '"' : "")
        + '><span class="path">' + esc(file.path) + '</span>'
        + '<span class="size">' + size + ' B</span></li>';
    }).join("");
  }

  function entityIdForPath(path) {
    var match = /^data\/([^/]+)\/spell_casters\/(.+)\.json$/.exec(path);
    return match ? match[1] + ":" + match[2] : null;
  }

  function helpTotalCount() {
    return D.HELP.reduce(function (sum, group) { return sum + group.items.length; }, 0);
  }

  function helpItemMatches(item, groupTitle, query) {
    if (!query) return true;
    var hay = groupTitle + " " + item.k + " " + (item.def || "") + " " + (item.req || "") + " " + item.text;
    return hay.toLowerCase().indexOf(query) >= 0;
  }

  /** 「帮助」页签。带一个搜索框：按键名、默认值、说明文字过滤，组标题本身也参与匹配。 */
  function renderHelp() {
    var query = String(state.helpQ || "").trim().toLowerCase();
    var all = helpTotalCount();
    var matched = 0;
    var sections = [];
    D.HELP.forEach(function (group) {
      var items = group.items.filter(function (item) { return helpItemMatches(item, group.title, query); });
      if (!items.length) return;
      matched += items.length;
      sections.push('<section class="help-group"><h3>' + esc(group.title) + '</h3><dl>'
        + items.map(function (item) {
          var tags = "";
          if (item.req) tags += '<span class="tag req">' + esc(item.req) + '</span>';
          if (item.def) tags += '<span class="tag def">默认 ' + esc(item.def) + '</span>';
          return '<div class="help-item"><dt><code>' + esc(item.k) + '</code>' + tags + '</dt>'
            + '<dd>' + esc(item.text) + '</dd></div>';
        }).join("")
        + '</dl></section>');
    });
    var counter = $("#help-count");
    if (counter) counter.textContent = query ? matched + " / " + all + " 条" : "共 " + all + " 条";
    if (!sections.length) {
      return '<p class="empty">没有匹配「' + esc(state.helpQ) + '」的字段。试试英文键名，比如 cooldown、world、drops、variant。</p>';
    }
    return sections.join("");
  }

  function renderPanes() {
    var tabs = document.querySelectorAll("#tabs button");
    for (var i = 0; i < tabs.length; i++) {
      var tab = tabs[i].getAttribute("data-tab");
      if (tab === state.tab) tabs[i].classList.add("on");
      else tabs[i].classList.remove("on");
    }
    $("#pane-json").hidden = state.tab !== "json";
    $("#pane-problems").hidden = state.tab !== "problems";
    $("#pane-stats").hidden = state.tab !== "stats";
    $("#pane-sim").hidden = state.tab !== "sim";
    $("#pane-help").hidden = state.tab !== "help";
    $("#pane-files").hidden = state.tab !== "files";
    if (state.tab === "stats") renderStats();
    if (state.tab === "sim") renderSim();
    else simPlayStop();
  }

  /* ------------------------------------------------------------ 编辑区 */

  function csvText(value) {
    if (isArr(value)) return value.join(", ");
    if (value == null) return "";
    return String(value);
  }

  function vecText(value) {
    if (isArr(value)) return value.join(", ");
    return value == null ? "" : String(value);
  }

  /* 中栏的卡片 = 章节；顶部的导航条按这份清单生成，右栏 JSON 高亮也用同一套键 */
  var SECTIONS = [
    { key: "bossbar", label: "血条 bossBar", keys: ["bossBar"] },
    { key: "behavior", label: "行为 behavior", keys: ["disableAttackGoals"] },
    { key: "goals", label: "主动施法 goals", keys: ["goals"] },
    { key: "triggers", label: "触发器", keys: ["onHurt", "onTarget", "onDeath", "onKill"] },
    { key: "drops", label: "掉落 dropRules", keys: ["dropRules"] },
    { key: "variants", label: "变体 variants", keys: ["variants"] }
  ];

  function sectionByKey(key) {
    for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].key === key) return SECTIONS[i];
    return null;
  }

  /** 钉在中栏顶部的一条章节导航：点它滚到对应卡片，并在右侧 JSON 里加亮那段。 */
  function sectionNav(skipKey) {
    return '<nav class="secnav" aria-label="章节导航">'
      + SECTIONS.filter(function (section) { return section.key !== skipKey; }).map(function (section) {
        return '<button class="secnav-item" data-act="jump" data-sec="' + section.key + '"'
          + ' title="跳到「' + esc(section.label) + '」，并在右侧 JSON 里高亮这一段">'
          + esc(section.label) + '</button>';
      }).join("")
      + '</nav>';
  }

  function card(key, title, hint, body, head) {
    var fold = foldKey("card", key);
    return '<section class="card foldable' + (isFolded(fold) ? " folded" : "") + '" id="sec-' + esc(key) + '" data-sec="' + esc(key) + '">'
      + '<div class="card-head" role="button" tabindex="0" data-act="fold" aria-expanded="' + (isFolded(fold) ? "false" : "true") + '" data-key="' + esc(fold) + '" title="点击折叠 / 展开">'
      + '<h3><i class="chev" aria-hidden="true">▾</i>' + esc(title) + '</h3>'
      + '<div class="card-side">' + (hint ? '<span class="hint">' + esc(hint) + '</span>' : "") + (head || "") + '</div>'
      + '</div><div class="card-body">' + body + '</div></section>';
  }

  function entityHead(id, base) {
    var info = entityInfo(id);
    return '<header class="ed-head">'
      + '<div class="ed-title">'
      + '<input class="eid-input" data-role="entity-id" value="' + esc(id) + '" list="entity-id-list" spellcheck="false" autocomplete="off">'
      + (info ? '<span class="tag ok">' + esc(info.zh) + '</span>' : '<span class="tag">不在内置列表</span>')
      + '</div>'
      + '<div class="filepath">' + esc(entityFilePath(id)) + '</div>'
      + '<div class="ed-acts">'
      + '<button class="btn mini" data-act="dup-entity">复制</button>'
      + '<button class="btn mini danger" data-act="del-entity">删除</button>'
      + '</div>'
      + '</header>';
  }

  /**
   * 变体的 select 血量阈值 = 这一阶段的绝对血量区间。
   * 施法条件里不再重复提供 healthBelow / healthAbove，避免和 select 打架。
   */
  function phaseContext(select) {
    if (!isObj(select)) return null;

    if (below != null) parts.push("hp ≤ " + percentText(below));
    if (above != null) parts.push("hp > " + percentText(above));

  }

  function dropEntryHtml(entry, path) {

  function dropRuleHtml(rule, path, inVariant) {
    var r = isObj(rule) ? rule : {};

    var body = (inVariant
      ? '<p class="note">变体已经匹配过生物，这里的规则不需要 select。</p>'

  function selectorHtml(selector, path, title) {

      + numField(path + "/healthBelow", "血量 ≤ healthBelow", s.healthBelow, "", { min: 0, max: 1, step: 0.05, placeholder: "如 0.5" })
      + numField(path + "/healthAbove", "血量 ≥ healthAbove", s.healthAbove, "", { min: 0, max: 1, step: 0.05, placeholder: "如 0.1" })

  /** 0.34 → 34%，0.675 → 67.5%，只用于显示。 */
  function percentText(value) {
    if (typeof value !== "number" || !isFinite(value)) return String(value);
    var percent = Math.round(value * 1000) / 10;
    return percent + "%";
  }

  /**
   * 变体分两类：用 tags / 名字 / 驯服状态区分的是「个体」，用血量区分的是同一个体
   * 的不同「阶段」。同一组（标识条件完全相同）里越靠前越深，所以阶段号从组尾往前数。
   * 一个条件都没有的变体会被解析器整条丢掉，标成「缺条件」而不是假装它是一段。
   */
  var EMPTY_SELECT_KEY = JSON.stringify([null, null, [], null]);

  function selectIdentityKey(selector) {
    return CORE.selectIdentityKey(selector);
  }

  function hasHealthSelector(selector) {
    if (!isObj(selector)) return false;
    var below = typeof selector.healthBelow === "number" && isFinite(selector.healthBelow);
    var above = typeof selector.healthAbove === "number" && isFinite(selector.healthAbove);
    return below || above;
  }

  /**
   * 每条变体在它自己那组里的位置。total 只数「同组里带血量条件的条数」，
   * pos 是它在这几条里从深到浅的序号（0 最深）。没有血量的条目不参与编号。
   */
  function variantGroupInfo(list) {
    var keys = list.map(function (variant) {
      return selectIdentityKey(isObj(variant) ? variant.select : null);
    });
    var health = list.map(function (variant) {
      return hasHealthSelector(isObj(variant) ? variant.select : null);
    });
    var totals = {};
    keys.forEach(function (key, index) {
      if (health[index]) totals[key] = (totals[key] || 0) + 1;
    });
    var seen = {};
    return keys.map(function (key, index) {
      if (!health[index]) {
        return { key: key, total: totals[key] || 0, pos: -1, hasHealth: false };
      }
      seen[key] = (seen[key] || 0) + 1;
      return { key: key, total: totals[key], pos: seen[key] - 1, hasHealth: true };
    });
  }

  function phaseLabel(list, index) {
    var variant = list[index];
    var select = isObj(variant) && isObj(variant.select) ? variant.select : {};
    var info = variantGroupInfo(list)[index];
    if (!info.hasHealth) return info.key === EMPTY_SELECT_KEY ? "缺条件" : "个体变体";
    var phase = "第 " + (info.total - info.pos) + " 阶段";
    return info.key === EMPTY_SELECT_KEY ? phase : "个体 · " + phase;
  }

  function variantHtml(variant, path, index, list) {
    var v = isObj(variant) ? variant : {};
    var phaseInfo = phaseContext(v.select);
    var label = phaseLabel(list, index);
    var isIdentity = selectIdentityKey(v.select) !== EMPTY_SELECT_KEY;
    var fold = foldKey("variant", path);
    var folded = isFolded(fold);
    var variantDrops = isArr(v.dropRules) ? v.dropRules : [];
    // 掉落只在死亡时结算。阶段变体（按血量划分）放在这里会让人以为掉到这段血就掉东西，
    // 所以干脆不提供编辑器；旧工程里已有的数据仍然会导出，只给一条提示和删除按钮。
    var variantDropSection = "";

          + '<button class="btn ghost" data-act="drop-variant-drops" data-path="' + esc(path) + '">删掉这 ' + variantDrops.length + ' 条变体掉落</button>';

        + variantDrops.map(function (rule, i) { return dropRuleHtml(rule, path + "/dropRules/" + i, true); }).join("")
        + '<button class="btn ghost" data-act="add-drop-rule" data-path="' + esc(path + "/dropRules") + '">+ 加一条变体掉落</button>';
    }
    var body = selectorHtml(v.select, path + "/select")
      + '<div class="fields">'
      + triField(path + "/override", "覆盖根层 override", v.override, "覆盖", "合并（goals 拼接）", "默认（覆盖）")
      + triField(path + "/sticky", "锁定 sticky", v.sticky, "锁定阶段", "可回落", "默认（不锁定）")
      + triField(path + "/bossBar", "血条 bossBar", v.bossBar, "强制开", "强制关", "跟随上层")
      + triField(path + "/learner", "学卷轴法术 learner", v.learner, "允许", "不允许", "默认（不允许）")
      + triField(path + "/adaptive", "学玩家法术 adaptive", v.adaptive, "允许", "不允许", "默认（不允许）")
      + triField(path + "/disableAttackGoals", "原版攻击 disableAttackGoals", v.disableAttackGoals, "禁止", "不禁止", "跟随上层")
      + '</div>'
      + phaseHtml(v.onPhase, path + "/onPhase")
      + '<div class="group-title">变体自己的主动施法</div>'
      + (phaseInfo
        ? '<p class="hint">血量区间由 select 决定（' + esc(phaseInfo.text) + '）；下面每条施法里的条件只做距离 / 环境 / 世界等额外限制，不再重复设血量。</p>'
        : "")
      + castListHtml(v.goals, path + "/goals", undefined, phaseInfo)
      + triggersHtml(v, path, phaseInfo)
      + variantDropSection;
    return '<div class="variant foldable' + (folded ? ' folded' : '') + '" id="var-' + index + '" data-vindex="' + index + '">'
      + '<div class="variant-head">'
      + '<span class="variant-toggle" role="button" tabindex="0" aria-expanded="' + (folded ? "false" : "true") + '"'
      + ' data-act="fold" data-key="' + esc(fold) + '" title="点一下折叠 / 展开这个变体">'
      + '<i class="chev" aria-hidden="true">▾</i>'
      + '<span class="idx">#' + index + '</span>'
      + '<span class="phase-tag' + (isIdentity ? " identity" : "") + '">' + esc(label) + '</span>'
      + '<span class="vtags">' + esc(selectorSummary(v.select)) + '</span>'
      + '</span>'
      + '<span class="spacer"></span>'
      + (index > 0 ? '<button class="icon" data-act="variant-up" data-path="' + esc(path) + '" title="上移（更靠前，优先级更高）">↑</button>' : '')
      + (index < list.length - 1 ? '<button class="icon" data-act="variant-down" data-path="' + esc(path) + '" title="下移（优先级更低）">↓</button>' : '')
      + '<button class="icon" data-act="dup" data-path="' + esc(path) + '" title="复制这个变体">⧉</button>'
      + '<button class="icon" data-act="del" data-path="' + esc(path) + '" title="删除这个变体">×</button>'
      + '</div><div class="variant-body">' + body + '</div></div>';
  }

  function selectorSummary(selector) {
    if (!isObj(selector)) return "还没有选择条件";
    var parts = [];
    if (selector.name != null) parts.push("name=" + selector.name);
    if (selector.nameRegex != null) parts.push("/" + selector.nameRegex + "/");
    if (selector.healthBelow != null) parts.push("hp ≤ " + percentText(selector.healthBelow));
    if (selector.healthAbove != null) parts.push("hp > " + percentText(selector.healthAbove));
    if (isArr(selector.tags)) parts.push("tags=" + selector.tags.join("+"));
    if (selector.tamed != null) parts.push("tamed=" + selector.tamed);
    return parts.length ? parts.join(" · ") : "选择条件为空";
  }

  function triggersHtml(node, base, phase) {
    var html = TRIGGERS.map(function (trigger) {
      var path = base + "/" + trigger.key;
      var head = '<div class="trig-head"><b>' + esc(trigger.label) + '</b><span class="hint">' + esc(trigger.hint) + '</span></div>';
      if (isObj(node[trigger.key])) {
        return '<div class="trig">' + head + castHtml(node[trigger.key], path, phase) + '</div>';
      }
      return '<div class="trig empty"><div class="trig-head"><b>' + esc(trigger.label) + '</b><span class="hint">' + esc(trigger.hint) + '</span></div>'
        + '<button class="btn ghost" data-act="set-trigger" data-path="' + esc(path) + '">+ 添加</button></div>';
    }).join("");
    return '<div class="group-title">触发器（单个对象，变体没写时回落根层）</div><div class="triggers">' + html + '</div>';
  }

        + triField(base + "/bossBar", "bossBar", rules.bossBar, "强制开", "强制关", "跟随配置")
        + '</div>'))
      + card("behavior", "行为 behavior", "默认 false：保留原版近战 / 远程攻击 goal", '<div class="fields">'
        + triField(base + "/disableAttackGoals", "原版攻击 disableAttackGoals", rules.disableAttackGoals, "禁止", "保留", "默认（保留）")
        + '</div><p class="hint">true 只移除原版近战 / 远程攻击 goal（含僵尸、溺尸等子类），目标选择和本模组的施法都保留；变体里可以单独覆盖。</p>')
      + card("goals", "主动施法 goals", "按优先级和冷却，由 goal 选择器挑一条执行", castListHtml(rules.goals, base + "/goals"))
      + card("triggers", "触发器", "onHurt / onTarget / onDeath / onKill 都是单个对象", triggersHtml(rules, base))
      + card("drops", "掉落 dropRules", "死亡时结算，所有 select 匹配的规则都会投，不会互相替换", (function () {
        var path = base + "/dropRules";
        var list = isArr(rules.dropRules) ? rules.dropRules : [];
        var phaseCount = isArr(rules.variants) ? rules.variants.filter(function (variant) {
          return isObj(variant) && hasHealthSelector(variant.select);
        }).length : 0;
        return (phaseCount ? '<p class="hint">有 ' + phaseCount + ' 条按血量划分的阶段变体，不显示掉落编辑：掉落只在死亡瞬间结算，配在阶段里会让人以为掉到这段血就掉东西。确实需要某个阶段死亡时额外掉落，导出后改 JSON 的 variants[i].dropRules。</p>' : '')
          + (list.length ? list.map(function (rule, index) { return dropRuleHtml(rule, path + "/" + index, false); }).join("") : "")
          + '<button class="btn ghost" data-act="add-drop-rule" data-path="' + esc(path) + '">+ 加一条规则</button>';
      })())
      + card("variants", "变体 variants", "从上到下是匹配优先级，第一条命中即生效", (function () {
        var path = base + "/variants";
        var list = isArr(rules.variants) ? rules.variants : [];
        return (list.length
          ? '<div class="variant-tools"><span class="hint">点标题可折叠单条。同一组（同样的 tags / 名字 / 驯服条件）里越靠前越深。</span>'
            + '<button class="btn ghost mini" data-act="variants-expand" data-path="' + esc(path) + '">全部展开</button>'
            + '<button class="btn ghost mini" data-act="variants-collapse" data-path="' + esc(path) + '">全部收起</button></div>'
            + (rootBar == null ? "" : '<p class="hint">根层 bossBar 设成了「' + (rootBar ? "开" : "关") + '」；下面留「跟随上层」的变体会回落到它。</p>')
            + list.map(function (variant, index) { return variantHtml(variant, path + "/" + index, index, list); }).join("")
          : '<p class="hint">还没有变体。变体按顺序匹配，第一条命中即生效；同一个体要分阶段时，越深的阶段写越前面。</p>')
          + (list.length > 1 ? '<button class="btn ghost" data-act="sort-variants">同组按血量排序</button>' : "")
          + '<button class="btn ghost" data-act="add-variant" data-path="' + esc(path) + '">+ 添加变体</button>';
      })());
  }

/* ------------------------------------------- v2：撤销重做 / 自动保存 */

  var historyState = { stack: [], pos: -1, limit: 80, applying: false };
  var saveTimer = 0;
  // 自检页会用 window.SMGEN_STORAGE_KEY 换成另一个键，免得跑测试覆盖掉真正在用的工程
  var STORAGE_KEY = root.SMGEN_STORAGE_KEY || "spellmob-generator.v2";

  function projectSnapshot() {
    return JSON.stringify({ project: state.project, selected: state.selected });
  }

  /** 每次渲染后记一笔：快照变了才入栈，所以拖动输入框不会灌满历史。 */
  function historyRecord() {
    if (historyState.applying) return;
    var snapshot = projectSnapshot();
    if (historyState.pos >= 0 && historyState.stack[historyState.pos] === snapshot) return;
    historyState.stack = historyState.stack.slice(0, historyState.pos + 1);
    historyState.stack.push(snapshot);
    if (historyState.stack.length > historyState.limit) historyState.stack.shift();
    historyState.pos = historyState.stack.length - 1;
    renderHistoryButtons();
  }

  function historyApply(target) {
    var entry = historyState.stack[target];
    if (!entry) return;
    var data = JSON.parse(entry);
    historyState.applying = true;
    state.project = data.project;
    state.selected = data.selected;
    state.open = {};
    renderAll();
    historyState.applying = false;
    historyState.pos = target;
    renderHistoryButtons();
  }

  function undo() {
    if (historyState.pos > 0) historyApply(historyState.pos - 1);
  }

  function redo() {
    if (historyState.pos < historyState.stack.length - 1) historyApply(historyState.pos + 1);
  }

  function renderHistoryButtons() {
    var undoBtn = $("#undo-btn");
    var redoBtn = $("#redo-btn");
    if (undoBtn) undoBtn.disabled = historyState.pos <= 0;
    if (redoBtn) redoBtn.disabled = historyState.pos >= historyState.stack.length - 1;
  }

  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
          savedAt: Date.now(),
          project: state.project,
          selected: state.selected
        }));
      } catch (error) {
        // 隐私模式或配额满了：自动保存静默失效，其它功能不受影响
      }
    }, 700);
  }

  function restoreAutosave() {
    var raw = null;
    try { raw = window.localStorage.getItem(STORAGE_KEY); } catch (error) { return false; }
    if (!raw) return false;
    var data = null;
    try { data = JSON.parse(raw); } catch (error) { return false; }
    if (!data || !isObj(data.project) || !isObj(data.project.entities)) return false;
    var ids = Object.keys(data.project.entities);
    if (!ids.length) return false;
    var normalized = CORE.normalizeProject(data.project);
    state.project = normalized.project;
    var fallback = Object.keys(state.project.entities)[0] || null;
    state.selected = data.selected && state.project.entities[data.selected] ? data.selected : fallback;
    toast("已恢复上次没导出的编辑（" + new Date(data.savedAt).toLocaleString() + "）");
    return true;
  }

  /* --------------------------------------------------- v2：法术选择器 */

  var pendingSpellPath = null;

  /** 给 <input list> 用的法术 id 候选；比 115 项原生 select 好搜。 */
  function spellDatalist() {
    return '<datalist id="spell-ids">'
      + (D.SPELLS || []).map(function (entry) {
        return '<option value="' + esc(entry.id) + '">' + esc(entry.zh) + '</option>';
      }).join("")
      + '</datalist>';

  function pickerRows(query) {
    var q = String(query || "").trim().toLowerCase();
    var list = D.SPELLS || [];
    var rows = list.filter(function (entry) {
      if (!q) return true;
      return (entry.id + " " + entry.en + " " + entry.zh).toLowerCase().indexOf(q) >= 0;
    });

  function renderPicker(query) {

    if (!host) return;
    var rows = pickerRows(query);

        + '<span class="school-dot" style="background:' + esc(color) + '"></span>'

        + '<span class="pick-en">' + esc(entry.en) + '</span>'
        + '<span class="pick-id">' + esc(entry.id.replace("irons_spellbooks:", "")) + '</span>'
        + (typeLabel ? '<span class="chip">' + esc(typeLabel) + '</span>' : "")
        + '</button>';
    }).join("");

  function spellPickerDialog(path) {
    pendingSpellPath = path;
    openModal("选法术 · " + (D.SPELLS || []).length + " 条内置",
      '<div class="picker-box">'
      + '<input id="picker-q" class="picker-input" placeholder="搜中文 / 英文 / id，回车选第一条" spellcheck="false" autocomplete="off">'
      + '<div class="picker" id="picker-list"></div>'
      + '</div>'
      + '<p class="hint">列表来自 irons_spellbooks 1.20.1-3.16.3 的语言文件，只用来显示和检索，不校验注册表。别的模组的法术直接在编辑区手输 id。</p>');
    renderPicker("");
    var input = $("#picker-q");
    if (!input) return;
    input.focus();
    input.addEventListener("input", function () { renderPicker(this.value); });
    input.addEventListener("keydown", function (event) {

  function pickSpell(id) {

    renderAll();
