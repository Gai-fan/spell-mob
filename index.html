<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpellMob 数据包生成器</title>
<style>
/* SpellMob 数据包生成器 —— 全部样式，无外部依赖 */

:root {
  --bg: #12141a;
  --panel: #181b23;
  --panel-2: #1e222c;
  --panel-3: #242936;
  --line: #2c3240;
  --line-soft: #232936;
  --text: #e7eaf0;
  --muted: #98a1b2;
  --dim: #6d7686;
  --accent: #6ea8ff;
  --accent-dim: #2b4a80;
  --ok: #4ade80;
  --warn: #ffb454;
  --err: #ff6b6b;
  --radius: 8px;
  /* 中栏固定、两侧栏按需覆盖：基准列宽 + 当前实际宽度 */
  --base-left: 236px;
  --base-right: 384px;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
}

[hidden] { display: none !important; }

code {
  font-family: var(--mono);
  font-size: 12px;
  color: #c9d3e4;
  background: var(--panel-3);
  padding: 1px 5px;
  border-radius: 4px;
}

button { font: inherit; color: inherit; }

/* ---------------------------------------------------------------- 报错条 */

.fatal {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 90;
  padding: 12px 16px;
  background: #4a1418;
  border-bottom: 1px solid var(--err);
  color: #ffd7d7;
  font-family: var(--mono);
  font-size: 12px;
  white-space: pre-wrap;
}

/* ------------------------------------------------------------------ 顶栏 */

#topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 8px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  min-height: 56px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 0 0 auto;
}

.mark {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: linear-gradient(140deg, #3a6fd8, #7b3fd8);
  color: #fff;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.5px;
}

.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text b { font-size: 13px; }
.brand-text small { color: var(--dim); font-size: 11px; }

.fld {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.fld > span {
  font-size: 10px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.topacts {
  display: flex;
  gap: 6px;
  flex: 0 0 auto;
  margin-left: auto;
}

/* ------------------------------------------------------------------ 控件 */

input, select, textarea {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  padding: 5px 7px;
  font: inherit;
  min-width: 0;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(110, 168, 255, 0.16);
}

input.bad, select.bad, .bad input {
  border-color: var(--err);
  background: #2a1618;
}

input::placeholder { color: #59616f; }

select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position: calc(100% - 13px) 52%, calc(100% - 8px) 52%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 22px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 11px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  font-size: 12px;
}

.btn:hover { background: var(--panel-3); border-color: #3a4254; }
.btn:active { transform: translateY(1px); }

.btn.primary {
  background: #2f5fae;
  border-color: #3f74c8;
  color: #eef4ff;
  font-weight: 600;
}
.btn.primary:hover { background: #376cc4; }

.btn.mini { padding: 3px 8px; font-size: 11px; }
.btn.danger { color: #ffb3b3; border-color: #5a2a2e; }
.btn.danger:hover { background: #3a1b1e; border-color: #7a363b; }

.btn.ghost {
  background: transparent;
  border-style: dashed;
  color: var(--muted);
  width: 100%;
  justify-content: center;
  margin-top: 6px;
}
.btn.ghost:hover { color: var(--text); border-color: var(--accent-dim); background: rgba(110, 168, 255, 0.06); }

.icon {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 5px;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
}
.icon:hover { color: var(--text); background: var(--panel-3); border-color: var(--line); }

.pill {
  display: inline-block;
  min-width: 18px;
  padding: 0 6px;
  border-radius: 9px;
  background: var(--panel-3);
  color: var(--muted);
  font-size: 10px;
  text-align: center;
  line-height: 17px;
  font-weight: 500;
  vertical-align: middle;
}

/* --------------------------------------------------------------- 三栏布局 */

#layout {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: var(--base-left) minmax(0, 1fr) var(--base-right);
  min-height: 0;
  position: relative;
}

#sidebar, #editor, #inspect {
  min-height: 0;
  overflow: auto;
}

/* 两侧栏可以拉得比自己的列更宽，压在中栏上面；中栏列宽不变、内容不重排 */

#sidebar {
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  width: var(--w-left, var(--base-left));
  justify-self: start;
  position: relative;
  z-index: 3;
  box-shadow: 6px 0 18px rgba(0, 0, 0, 0.28);
}

/* 工程字段放在侧栏顶上：顶栏留给按钮，撤销/重做才不被挤掉 */

.side-fields {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line-soft);
}

.side-fields .fld {
  flex-direction: row;
  align-items: center;
  gap: 7px;
}

.side-fields .fld > span {
  flex: 0 0 50px;
  font-size: 10.5px;
  text-transform: none;
  letter-spacing: 0;
}

.side-fields .fld input, .side-fields .fld select {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 11.5px;
  padding: 4px 6px;
}

.side-fields .fld input { font-family: var(--mono); }

/* 中栏压在下层：两侧栏拉宽时把它盖住，中栏里的导航条也不能冒到上面去 */

#editor { padding: 12px 14px 40px; position: relative; z-index: 1; }

/* 中栏顶上的章节导航：跟着滚但钉在顶部，点一下跳到那张卡并在右侧 JSON 加亮 */

.secnav {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: -12px -14px 12px;
  padding: 10px 14px 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--line-soft);
}

.secnav-item {
  padding: 4px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel-2);
  color: var(--muted);
  font-size: 11.5px;
  cursor: pointer;
  white-space: nowrap;
}

.secnav-item:hover { color: var(--text); border-color: var(--accent-dim); background: var(--panel-3); }
.secnav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

#inspect {
  background: var(--panel);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  width: var(--w-right, var(--base-right));
  justify-self: end;
  position: relative;
  z-index: 3;
  box-shadow: -6px 0 18px rgba(0, 0, 0, 0.28);
}

/* 两条竖把手：贴着两侧栏的边，拖它改宽度，双击/回车回默认 */

.splitter {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 9px;
  z-index: 6;
  cursor: col-resize;
  background: transparent;
  touch-action: none;
}

.splitter::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 4px;
  width: 1px;
  background: transparent;
  transition: background 0.12s;
}

.splitter:hover::after, .splitter:focus-visible::after, .splitter.dragging::after {
  background: var(--accent);
}

.splitter:focus-visible { outline: none; }

#split-left { left: calc(var(--w-left, var(--base-left)) - 4px); }
#split-right { right: calc(var(--w-right, var(--base-right)) - 4px); }

body.col-resizing { cursor: col-resize; user-select: none; }
body.col-resizing * { cursor: col-resize !important; }

/* ------------------------------------------------------------- 左侧实体表 */

.side-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line-soft);
  position: sticky;
  top: 0;
  background: var(--panel);
  z-index: 2;
}

.side-head h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.3px;
}

.entity-list {
  list-style: none;
  margin: 0;
  padding: 6px;
  flex: 1 1 auto;
  overflow: auto;
  min-height: 0;
}

.entity {
  padding: 7px 9px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  margin-bottom: 3px;
}

.entity:hover { background: var(--panel-2); }
.entity.on { background: #1d2b45; border-color: var(--accent-dim); }

.eid {
  font-family: var(--mono);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.meta {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--dim);
  font-size: 11px;
  margin-top: 2px;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  flex: 0 0 auto;
}
.dot.err { background: var(--err); }
.dot.warn { background: var(--warn); }
.dot.note { background: #5d6b86; }

.tag {
  display: inline-block;
  padding: 0 5px;
  border-radius: 4px;
  background: var(--panel-3);
  border: 1px solid var(--line);
  color: var(--dim);
  font-size: 10px;
  line-height: 15px;
  vertical-align: middle;
  font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
}
.tag.ok { color: #a6e9c0; border-color: #2f5c43; background: #1a2c22; }
.tag.def { color: #b9c3d4; }
.tag.req { color: #ffd0a3; border-color: #5c4326; background: #2b2218; }

.side-hint {
  margin: 0;
  padding: 8px 12px;
  border-top: 1px solid var(--line-soft);
  color: var(--dim);
  font-size: 11px;
  line-height: 1.6;
}

.side-hint code { font-size: 10px; padding: 0 3px; }

/* --------------------------------------------------------------- 编辑区 */

.ed-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 10px;
  align-items: center;
  padding-bottom: 10px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

.ed-title { display: flex; align-items: center; gap: 8px; min-width: 0; grid-column: 1; }

.eid-input {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  background: transparent;
  border-color: transparent;
  padding: 2px 4px;
  width: 100%;
  max-width: 420px;
}
.eid-input:hover { border-color: var(--line); background: var(--panel-2); }

.filepath {
  grid-column: 1;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  padding-left: 5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ed-acts { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 5px; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 12px;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line-soft);
  background: #1b1f28;
  border-radius: var(--radius) var(--radius) 0 0;
}

.card-head h3 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.3px;
  flex: 0 0 auto;
}

.card-side {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  min-width: 0;
  justify-content: flex-end;
}

.card-side .hint { text-align: right; }
.card-body { padding: 10px 12px 12px; }

.hint {
  margin: 0;
  color: var(--dim);
  font-size: 11px;
  line-height: 1.55;
}

.note {
  margin: 6px 0;
  padding: 6px 9px;
  border-radius: 6px;
  background: #1b2230;
  border-left: 2px solid var(--accent-dim);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.55;
}
.note.warn { background: #2a2213; border-left-color: var(--warn); color: #ffd6a1; }

.group-title {
  margin: 12px 0 6px;
  font-size: 10px;
  font-weight: 700;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.7px;
  border-bottom: 1px dashed var(--line-soft);
  padding-bottom: 4px;
}

.fields {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 7px 9px;
}

.f {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.f > span {
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.f.wide { grid-column: 1 / -1; }
.f input, .f select { width: 100%; font-size: 12px; }

.f.spell-f { flex: 1 1 auto; }
.f.spell-f input { font-family: var(--mono); }

/* ------------------------------------------------------------ 施法条目 */

.cast-list { display: flex; flex-direction: column; gap: 8px; }

.cast {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel-2);
  padding: 8px 10px 10px;
}

.cast-top {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-bottom: 7px;
}

.spell-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: 0 1 auto;
  min-width: 0;
  padding-bottom: 6px;
}

.spell-zh {
  color: var(--ok);
  font-size: 11px;
  white-space: nowrap;
  max-width: 190px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.spell-zh.bad { color: var(--err); }
.spell-zh:empty { display: none; }

.triggers { display: flex; flex-direction: column; gap: 7px; }

.trig {
  border: 1px solid var(--line-soft);
  border-radius: 7px;
  padding: 8px 10px 10px;
  background: var(--panel-2);
}
.trig.empty { border-style: dashed; background: transparent; padding-bottom: 10px; }

.trig-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.trig-head b { font-size: 12px; font-weight: 600; }

/* ------------------------------------------------- 折叠卡片（整栏收起） */

.card-head[data-act="fold"] { cursor: pointer; user-select: none; }
.card-head[data-act="fold"]:hover h3 { color: var(--accent); }
.card-head:focus-visible { outline: 2px solid var(--accent-dim); outline-offset: -2px; }

.chev {
  font-style: normal;
  display: inline-block;
  margin-right: 5px;
  font-size: 10px;
  color: var(--dim);
  transition: transform 0.12s;
}

.folded > .card-head .chev,
.folded > .cast-top .chev { transform: rotate(-90deg); }

.card.folded > .card-head { border-bottom: 0; border-radius: var(--radius); }
.folded > .card-body, .folded > .cast-body { display: none; }

.cast.folded { padding-bottom: 8px; }
.cast.folded .cast-top { margin-bottom: 0; }

.f.spell-f > span[data-act="fold"] { cursor: pointer; user-select: none; }
.f.spell-f > span[data-act="fold"]:hover { color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  .chev { transition: none; }
}

/* ---------------------------------------------------------- 折叠子面板 */

.sub {
  border: 1px solid var(--line-soft);
  border-radius: 7px;
  margin: 8px 0 0;
  background: #1a1e27;
}

.sub > summary {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  cursor: pointer;
  list-style: none;
  font-size: 12px;
  color: var(--muted);
  user-select: none;
}
.sub > summary::-webkit-details-marker { display: none; }
.sub > summary::before {
  content: "▸";
  color: var(--dim);
  font-size: 10px;
  transition: transform 0.12s;
}
.sub[open] > summary::before { content: "▾"; }
.sub > summary:hover { color: var(--text); }
.sub[open] > summary { border-bottom: 1px solid var(--line-soft); }

.sub-body { padding: 8px 10px 10px; }

/* ---------------------------------------------------------------- 变体 */

.variant {
  border: 1px solid #3a3148;
  border-radius: 8px;
  background: #1c1a26;
  padding: 0 10px 10px;
  margin-bottom: 10px;
}

.variant-head {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0 -10px 8px;
  padding: 7px 10px;
  background: #23202f;
  border-bottom: 1px solid #34304a;
  border-radius: 8px 8px 0 0;
}

/* 变体标题就是折叠开关；按钮区在它外面，不会误触 */
.variant-toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  cursor: pointer;
  border-radius: 4px;
  padding: 1px 3px;
  margin: -1px -3px;
}
.variant-toggle:hover { background: #2b2739; }
.variant-toggle:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
.variant.folded { padding-bottom: 0; }
.variant.folded > .variant-head { margin-bottom: 0; border-bottom-color: transparent; border-radius: 8px; }
.variant.folded > .variant-body { display: none; }
.variant.folded > .variant-head .chev { transform: rotate(-90deg); }
.variant-tools {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 2px 0 8px;
}
.variant-tools .hint { flex: 1 1 auto; margin: 0; }
.variant-tools .btn.ghost { width: auto; margin-top: 0; flex: 0 0 auto; }
.phase-tag.identity {
  color: #cfe3ff;
  background: #1e2b3d;
  border-color: #33507a;
}

.idx {
  font-family: var(--mono);
  font-size: 11px;
  color: #c0b0e8;
  background: #2e2a42;
  border-radius: 4px;
  padding: 0 5px;
}

.vtags {
  font-family: var(--mono);
  font-size: 11px;
  color: #b9aee0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.spacer { flex: 1 1 auto; }

/* 变体的阶段名标签（第 N 阶段 / 个体变体 / 缺条件） */
.phase-tag {
  flex: 0 0 auto;
  font-size: 10.5px;
  color: #ffe0b0;
  background: #382c1e;
  border: 1px solid #5a4526;
  border-radius: 999px;
  padding: 0 7px;
  white-space: nowrap;
}

.selector { margin-top: 4px; }
.selector > .hint, .drop > .hint { margin-top: 6px; }

.rule, .drop {
  position: relative;
  border: 1px solid var(--line-soft);
  border-radius: 7px;
  padding: 8px 34px 10px 10px;
  margin-top: 8px;
  background: #1a1e27;
}

.rule-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 6px;
}

.rule > .icon, .drop > .icon {
  position: absolute;
  top: 6px;
  right: 6px;
}

.drop { background: #171b23; }

.phase-empty { margin-top: 6px; }

/* ------------------------------------------------------------ 示范/弹窗 */

.preset {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line-soft);
}
.preset:last-child { border-bottom: 0; }
.preset-text { flex: 1 1 auto; min-width: 0; }
.preset-text b { font-size: 13px; }
.preset-text code { font-size: 11px; }
.preset-text .hint { margin: 2px 0 4px; }

.modal-sep {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 16px 0 8px;
  color: var(--dim);
  font-size: 11px;
}
.modal-sep::before,
.modal-sep::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--line); }

.modal {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  background: rgba(6, 8, 12, 0.72);
  padding: 20px;
}

.modal-box {
  width: min(560px, 100%);
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
}

.modal-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line-soft);
}
.modal-head h3 { margin: 0; font-size: 13px; flex: 1 1 auto; }

.modal-body { padding: 14px; overflow: auto; }
.modal-body p { margin: 0 0 10px; }
.modal-body .f { margin-bottom: 8px; }
.modal-body input { width: 100%; font-family: var(--mono); }

.modal-acts {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 14px;
}

/* ------------------------------------------------------------ 右侧面板 */

.tabs {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  row-gap: 2px;
  padding: 6px 8px 0;
  border-bottom: 1px solid var(--line);
}

.tabs button {
  white-space: nowrap;
  padding: 6px 8px;
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.tabs button:hover { color: var(--text); background: var(--panel-2); }
.tabs button.on {
  color: var(--text);
  background: var(--panel-2);
  border-color: var(--line);
  margin-bottom: -1px;
  font-weight: 600;
}

/* 视觉上藏起来、但仍然可点：<label for> 靠它打开系统文件选择框 */
/* 章节导航点在 JSON 里高亮的那段 */

#json-out .json-hl {
  display: inline;
  border-radius: 3px;
  background: rgba(110, 168, 255, 0.18);
  color: var(--text);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}

.pane {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 10px 12px 20px;
}

.pane-head {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  word-break: break-all;
  padding: 2px 0 8px;
  border-bottom: 1px dashed var(--line-soft);
  margin-bottom: 8px;
}

#json-out {
  margin: 0;
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.55;
  color: #cfd8e6;
  white-space: pre;
  tab-size: 2;
}

.problems, .files {
  list-style: none;
  margin: 0;
  padding: 0;
}

.problem {
  padding: 7px 9px;
  border-radius: 6px;
  margin-bottom: 6px;
  border-left: 2px solid var(--line);
  background: var(--panel-2);
}
.problem.err { border-left-color: var(--err); background: #241719; }
.problem.warn { border-left-color: var(--warn); background: #241f14; }

.problem .where {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--dim);
  word-break: break-all;
}
.problem .msg { font-size: 12px; margin-top: 2px; }
.problem.err .msg { color: #ffc9c9; }
.problem.warn .msg { color: #ffdfb0; }
.problem.note { border-left-color: #44506a; }
.problem.note .msg { color: #c8d0de; }
.problem .hint {
  font-size: 11px;
  line-height: 1.55;
  margin-top: 3px;
  color: var(--muted);
}

/* 能跳到中栏的那条诊断：整行可点，悬停才显示提示 */
.problem.jumpable { cursor: pointer; }
.problem.jumpable:hover { border-left-color: var(--accent); background: #1c2333; }
.problem.jumpable:focus-visible { outline: 2px solid var(--accent-dim); outline-offset: 1px; }
.problem .jump-hint {
  margin-top: 4px;
  text-align: right;
  font-size: 10.5px;
  color: var(--accent);
  opacity: 0;
}
.problem.jumpable:hover .jump-hint,
.problem.jumpable:focus-visible .jump-hint { opacity: 1; }

/* 从诊断跳过来时闪一下那个字段 */
.flash { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.problem-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 2px 0 10px;
  font-size: 11px;
}
.problem-summary .sev {
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
}
.problem-summary .sev.err { color: #ffc9c9; border-color: #5a2a2e; background: #241719; }
.problem-summary .sev.warn { color: #ffdfb0; border-color: #5a4a24; background: #241f14; }
.problem-summary .sev.note { color: #c8d0de; border-color: #44506a; background: var(--panel-2); }
.problem-summary .sev.ok { color: #b6f3cd; border-color: #24503a; background: #16241c; }

/* 检查页的过滤条 + 一键修复 */
.problem-tools {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 0 4px;
}

.sev-filter {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel-2);
}

.sev-filter button {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  padding: 2px 9px;
  border-radius: 999px;
  cursor: pointer;
}

.sev-filter button:hover { color: var(--text); }
.sev-filter button.on { background: var(--accent-dim); color: #eaf1ff; }
.sev-filter button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.problem-tools #fix-all { margin-left: auto; }
.problem .fix { margin-top: 6px; }
.problem .fix.bad { opacity: 0.6; }

.file {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 5px 7px;
  border-radius: 5px;
  cursor: default;
  border: 1px solid transparent;
}
.file[data-act] { cursor: pointer; }
.file:hover { background: var(--panel-2); }
.file.on { background: #1d2b45; border-color: var(--accent-dim); }
.file .path {
  font-family: var(--mono);
  font-size: 11px;
  word-break: break-all;
  flex: 1 1 auto;
}
.file .size { color: var(--dim); font-size: 10px; flex: 0 0 auto; }

/* --------------------------------------------------------------- 字段帮助 */

.help-search {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -2px 0 10px;
  padding: 2px 0 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--line-soft);
}
.help-input {
  flex: 1 1 auto;
  min-width: 0;
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel-2);
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
}
.help-input:focus { outline: none; border-color: var(--accent); }
.help-search .hint { flex: 0 0 auto; font-size: 10.5px; color: var(--dim); }

.help-group { margin-bottom: 16px; }
.help-group h3 {
  margin: 0 0 6px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--accent);
}
.help-group dl { margin: 0; }

.help-item {
  padding: 6px 0;
  border-bottom: 1px solid var(--line-soft);
}
.help-item dt {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 2px;
}
.help-item dt code { color: #a8c4ff; background: transparent; padding: 0; font-size: 11.5px; }
.help-item dd {
  margin: 0;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.6;
}

/* ------------------------------------------------------------------ 空态 */

.empty {
  list-style: none;
  color: var(--dim);
  font-size: 12px;
  padding: 14px 8px;
  text-align: center;
}

.empty-editor {
  max-width: 460px;
  margin: 60px auto;
  text-align: center;
  color: var(--muted);
}
.empty-editor h2 { font-size: 16px; margin: 0 0 8px; color: var(--text); }
.empty-editor p { margin: 0; font-size: 12px; line-height: 1.7; }

/* ------------------------------------------------------------------ 提示 */

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 80;
  transform: translateX(-50%);
  max-width: min(680px, calc(100vw - 40px));
  padding: 10px 16px;
  background: var(--panel-3);
  border: 1px solid var(--accent-dim);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
  color: var(--text);
  font-size: 12.5px;
  animation: toast-in 140ms ease-out;
}

@keyframes toast-in {
  from { opacity: 0; transform: translate(-50%, 6px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

@media (prefers-reduced-motion: reduce) {
  .toast { animation: none; }
}

/* --------------------------------------------------- v2：搜索 / 法术选择 */

.side-search {
  width: calc(100% - 24px);
  margin: 8px 12px 6px;
  padding: 6px 9px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  font-size: 12px;
}

.btn:disabled { opacity: 0.35; cursor: default; transform: none; }

.school-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
}

.chip {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 10px;
  background: var(--panel-3);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 10.5px;
  line-height: 16px;
  white-space: nowrap;
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 10px; }

.picker-box { display: flex; flex-direction: column; gap: 8px; }

.picker-input {
  width: 100%;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  font-size: 13px;
}

.picker {
  max-height: 46vh;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel-2);
}

.pick {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 6px 10px;
  border: 0;
  border-bottom: 1px solid var(--line-soft);
  background: transparent;
  text-align: left;
  cursor: pointer;
  font-size: 12px;
}
.pick:last-child { border-bottom: 0; }
.pick:hover { background: var(--panel-3); }
.pick-zh { color: var(--text); }
.pick-en { color: var(--muted); font-size: 11.5px; }
.pick-id { margin-left: auto; color: var(--dim); font-family: var(--mono); font-size: 11px; }

/* ------------------------------------------------------------ v2：统计 */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
  gap: 8px;
  padding: 2px 0 10px;
}

/* 统计页签在右栏里，比弹窗窄：固定两列，别让“平均掉落件数”这种字挤成三行 */
#stats-body .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#stats-body .stat-card b { font-size: 17px; }

.stat-card {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 9px 11px;
  border-radius: var(--radius);
  background: var(--panel-2);
  border: 1px solid var(--line);
}
.stat-card b { font-size: 18px; font-weight: 600; color: var(--text); }
.stat-card span { font-size: 11.5px; color: var(--muted); }
.stat-card small { font-size: 10.5px; color: var(--dim); }

.sub-title {
  margin: 14px 0 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
}

/* 统计里能整块折叠的小节（学派分布）：标题本身就是按钮 */
.sub { margin: 0; }
.sub-fold {
  display: flex;
  align-items: baseline;
  gap: 6px;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.sub-fold:hover { color: var(--accent); }
.sub-fold .chev { align-self: center; transition: transform .15s; }
.sub-fold[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.sub-fold .hint { margin-left: auto; font-weight: 400; font-size: 10.5px; }
.sub.folded .sub-body { display: none; }
.sub-head-row { display: flex; align-items: baseline; gap: 8px; }
.sub-acts { margin-left: auto; display: flex; gap: 4px; }
.mini-btn {
  padding: 1px 7px;
  font-family: inherit;
  font-size: 10.5px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel-2);
  color: var(--dim);
  cursor: pointer;
}
.mini-btn:hover { color: var(--text); border-color: var(--accent); }
.mini-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.school-block { margin-bottom: 1px; }

/* 学派那一行本身是按钮：点一下展开 / 收起这一派的法术 */
.bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 3px 2px;
  border: 0;
  border-radius: 4px;
  background: none;
  color: inherit;
  font: inherit;
  font-size: 11.5px;
  text-align: left;
  cursor: pointer;
}
.bar-row:hover { background: var(--panel-2); }
.bar-row:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
.bar-row .chev {
  font-style: normal;
  color: var(--dim);
  font-size: 10px;
  transition: transform .12s ease;
}
.bar-row[aria-expanded="false"] .chev { transform: rotate(-90deg); }

.school-spells {
  list-style: none;
  margin: 2px 0 8px;
  padding: 0 0 0 26px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.school-spells li { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
.school-spells .spell-zh { max-width: none; }
.school-spells .chip { font-size: 10px; line-height: 15px; padding: 0 6px; }
.school-spells .spell-count { color: var(--dim); font-size: 10px; font-family: var(--mono); }
.school-spells .spell-id { margin-left: auto; color: var(--dim); font-size: 10px; }
.school-empty { margin: 2px 0 8px 26px; }

.bar-label { flex: 0 0 46px; color: var(--muted); }
.bar { flex: 1 1 auto; height: 6px; border-radius: 3px; background: var(--panel-3); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.bar-num { flex: 0 0 22px; text-align: right; color: var(--dim); font-family: var(--mono); }

/* ---------------------------------------------------- 统计：范围切换 */
.stats-scope {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 10px;
}
.stats-scope .scope-btn {
  padding: 2px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 11.5px;
  cursor: pointer;
}
.stats-scope .scope-btn:hover { border-color: var(--accent); color: var(--text); }
.stats-scope .scope-btn.on {
  border-color: var(--accent);
  background: var(--accent-soft, rgba(110, 168, 255, 0.16));
  color: var(--text);
}
.stats-scope .scope-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.stats-scope .hint { font-size: 10.5px; color: var(--dim); }

/* 当前实体视图不再单独写实体名（左边选中项已经说明了），变体清单直接贴着卡片 */
.stats-varlist { margin-top: 0; }

/* ------------------------------------------------ 统计：生物与变体明细 */
/* 搜索行吸顶：生物一多也不会把搜索框滚没 */
.stats-search {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  padding: 2px 0 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--line-soft);
}
.stats-search .help-input { flex: 1 1 auto; min-width: 0; }
.stats-search .hint { flex: 0 0 auto; font-size: 10.5px; color: var(--dim); white-space: nowrap; }

.ent-list { display: flex; flex-direction: column; gap: 6px; }
.ent-stat {
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  background: var(--panel-2);
  overflow: hidden;
}
.ent-stat[hidden] { display: none; }
.ent-head {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 100%;
  padding: 7px 9px;
}
.ent-head:hover { background: var(--panel-3); }
.ent-title {
  flex: 1 1 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 6px;
  min-width: 0;
}
/* 行首的小箭头负责展开 / 收起 */
.ent-chev {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  margin-left: -2px;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: none;
  color: var(--dim);
  font: inherit;
  line-height: 1;
  cursor: pointer;
}
.ent-chev:hover { background: var(--panel-3); color: var(--text); }
.ent-chev:focus-visible { outline: 2px solid var(--accent-dim); outline-offset: 1px; }
.ent-id {
  flex: 0 1 auto;
  min-width: 0;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--text);
  overflow-wrap: anywhere;
}
.ent-zh { flex: 0 0 auto; font-size: 11px; color: var(--dim); white-space: nowrap; }
.ent-num {
  flex: 0 0 auto;
  margin-left: auto;
  font-size: 10.5px;
  color: var(--dim);
  white-space: nowrap;
  font-family: var(--mono);
}
.ent-body { padding: 0 9px 9px; border-top: 1px solid var(--line-soft); }
.ent-facts { padding-top: 7px; font-size: 11.5px; color: var(--muted); }
.ent-body .chips { padding: 6px 0 0; }
.school-chip { display: inline-flex; align-items: center; gap: 4px; }
.school-chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.ent-stat.folded .ent-body { display: none; }
.ent-stat.folded > .ent-head .chev { transform: rotate(-90deg); }
.ent-stat.folded > .ent-head .ent-num { opacity: 0.85; }

.var-list { list-style: none; margin: 7px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.var-stat {
  padding: 0;
  border-radius: 6px;
  background: var(--panel-3);
  font-size: 11.5px;
}
.var-stat[hidden] { display: none; }
/* 变体标题行是按钮：点一下只折叠这一条变体的法术表（收起后学派小标签还在） */
.var-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  padding: 5px 7px 4px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
}
button.var-row { cursor: pointer; }
button.var-row:hover { background: var(--panel-2); }
button.var-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
.var-row-static { cursor: default; }
.var-line {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 8px;
  width: 100%;
}
.var-row .chev { align-self: center; transition: transform .15s; }
.var-stat.folded .var-row .chev { transform: rotate(-90deg); }
.var-stat.folded > .var-body { display: none; }
/* 这一阶段的学派分布：一排彩色小标签，收起时也留在标题行里 */
.var-schools { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.var-schools .chip { font-size: 10px; line-height: 15px; padding: 0 6px; }
/* 法术表按 主动 / 触发 分组的小标题 */
.var-group { margin: 3px 0 2px 21px; font-size: 10.5px; color: var(--dim); }
@media (prefers-reduced-motion: reduce) {
  .var-row .chev, .sub-fold .chev { transition: none; }
}
.var-idx { font-family: var(--mono); font-size: 11px; color: var(--accent); }
.var-sel { color: var(--text); word-break: break-word; }
.var-meta { margin-left: auto; color: var(--dim); font-size: 10.5px; }
.var-meta .chip { font-size: 10px; line-height: 15px; padding: 0 6px; }
.var-empty { margin: 0 0 6px 7px; font-size: 11px; }

/* 每条变体自己施放的法术：缩进在变体行下面，和学派展开的清单同一个外观 */
.var-spells {
  list-style: none;
  display: flex;
  flex-direction: column;
  margin: 0 0 5px;
  padding: 0 8px 3px 21px;
  gap: 2px;
}
.var-spells li { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.var-spells .spell-zh { max-width: 100%; }
.var-spells .chip { font-size: 10px; line-height: 15px; padding: 0 6px; }
.var-spells .spell-count { color: var(--dim); font-size: 10px; font-family: var(--mono); }
.var-spells .spell-id { margin-left: auto; color: var(--dim); font-size: 10px; }
/* 根层不能选、不能折叠，用一条虚线跟变体区分开 */
.var-root { border: 1px dashed var(--line); background: var(--panel-2); }
.var-root .var-idx { color: var(--muted); }
/* 「打开工程」弹窗：拖放区 + 原生文件选择 */
.pick-file {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 22px 16px;
  margin-bottom: 10px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  background: var(--panel-2);
  text-align: center;
  transition: border-color .15s, background .15s;
}
.pick-file b { font-size: 13px; color: var(--text); }
.pick-file .hint { font-size: 11.5px; color: var(--dim); }
.pick-file.over { border-color: var(--accent); background: var(--panel-3); }

.mini-list { margin: 4px 0 10px; padding-left: 18px; font-size: 12px; color: var(--muted); line-height: 1.75; }
.mini-list code { font-size: 11.5px; }

.filetable { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.filetable th, .filetable td { padding: 5px 8px; border-bottom: 1px solid var(--line-soft); text-align: left; }
.filetable th { color: var(--dim); font-weight: 500; }
.filetable td.num { text-align: right; color: var(--muted); white-space: nowrap; }
.filetable .mono { font-family: var(--mono); font-size: 11px; color: #c9d3e4; }

/* ---------------------------------------------------------- v2：模拟器 */

.sim-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.sim-hp { display: block; margin: 10px 0 12px; }
.sim-hp input[type="range"] { width: 100%; accent-color: var(--accent); }
.sim-now { padding: 10px 12px; border-radius: var(--radius); background: var(--panel-2); border: 1px solid var(--line); }
.sim-verdict { display: flex; flex-direction: column; gap: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--line-soft); }
.sim-verdict b { font-size: 14px; }
.sim-verdict span { font-size: 11.5px; color: var(--muted); }
.sim-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; padding: 8px 0; }
.sim-facts div { display: flex; flex-direction: column; }
.sim-facts span { font-size: 10.5px; color: var(--dim); }
.sim-facts b { font-size: 12px; font-weight: 500; }
.sim-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11.5px; }
.sim-table th, .sim-table td { padding: 3px 8px; border-bottom: 1px solid var(--line-soft); text-align: left; }
.sim-table th { color: var(--dim); font-weight: 500; }
.sim-table tr.on td { background: rgba(110, 168, 255, 0.12); color: var(--text); }

.sim-hp-row { display: flex; align-items: flex-end; gap: 8px; margin: 10px 0 12px; }
.sim-hp-row .sim-hp { flex: 1 1 auto; margin: 0; }
.sim-hp-row #sim-play { flex: 0 0 auto; }

.sim-verdict.flash { animation: simflash 700ms ease-out; }
@keyframes simflash {
  from { background: rgba(110, 168, 255, 0.32); }
  to { background: transparent; }
}
@media (prefers-reduced-motion: reduce) {
  .sim-verdict.flash { animation: none; }
}

/* ------------------------------------------------------- 批量更改 */

.batch-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.batch-row span { flex: 0 0 92px; font-size: 11.5px; color: var(--muted); }
.batch-row input, .batch-row select { flex: 1 1 auto; min-width: 0; }
.modal-note { margin: 0 0 6px; font-size: 11.5px; color: var(--muted); }

/* --------------------------------------------------------------- 滚动条 */

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: #333a49;
  border-radius: 5px;
  border: 2px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover { background: #414a5e; }

/* ------------------------------------------------------------ 窄屏兜底 */

@media (max-width: 1180px) {
  :root { --base-left: 220px; --base-right: 340px; }
}

@media (max-width: 900px) {
  body { overflow: auto; }
  #layout {
    grid-template-columns: minmax(0, 1fr);
    grid-auto-rows: min-content;
  }
  #sidebar { max-height: 180px; border-right: 0; border-bottom: 1px solid var(--line); width: auto; justify-self: stretch; box-shadow: none; }
  #inspect { border-left: 0; border-top: 1px solid var(--line); max-height: 60vh; width: auto; justify-self: stretch; box-shadow: none; }
  .splitter { display: none; }
  #topbar { flex-wrap: wrap; }
  .topacts { flex-wrap: wrap; margin-left: 0; }
}

</style>

<div id="fatal" class="fatal" hidden></div>
<div id="toast" class="toast" hidden></div>

<header id="topbar">

    <button class="btn" data-act="save-project" title="存成 .project.json（Ctrl+S）">保存工程</button>
    <button class="btn primary" data-act="export-zip" title="先看文件清单再下载（Ctrl+Shift+E）">导出 zip</button>

<main id="layout">

  <aside id="sidebar">

    </div>
    <div class="side-head">

      <button class="btn mini" data-act="add-entity">新建</button>

    <input id="entity-search" class="side-search" placeholder="搜实体 id 或中文名（按 / 或 Ctrl+Shift+K）" spellcheck="false" autocomplete="off">
    <ul id="entity-list" class="entity-list"></ul>
    <p class="side-hint">每个实体一个文件：<code>data/&lt;ns&gt;/spell_casters/&lt;id&gt;.json</code></p>
  </aside>

  <section id="editor" class="editor"></section>

  <aside id="inspect">
    <nav class="tabs" id="tabs">
      <button data-act="tab" data-tab="json" class="on">JSON</button>
      <button data-act="tab" data-tab="problems">检查 <span id="problem-count" class="pill">0</span></button>
      <button data-act="tab" data-tab="stats">统计</button>
      <button data-act="tab" data-tab="sim">模拟器</button>
      <button data-act="tab" data-tab="help">帮助</button>
      <button data-act="tab" data-tab="files">文件</button>
    </nav>
    <div class="pane" id="pane-json">
      <div class="pane-head" id="json-file"></div>
      <pre id="json-out"></pre>
    </div>
    <div class="pane" id="pane-problems" hidden>
      <div class="problem-tools">
        <div class="sev-filter" role="group" aria-label="诊断过滤">
          <button data-act="problem-filter" data-filter="all" class="on">全部</button>
          <button data-act="problem-filter" data-filter="serious">错误 + 警告</button>
          <button data-act="problem-filter" data-filter="err">只看错误</button>
        </div>
        <button class="btn mini" id="fix-all" data-act="fix-all" hidden>一键修复</button>
      </div>
      <div class="problem-summary" id="problem-summary"></div>
      <ul id="problem-list" class="problems"></ul>
    </div>
    <div class="pane" id="pane-stats" hidden><div id="stats-body" class="stats"></div></div>
    <div class="pane" id="pane-sim" hidden><div id="sim-body"></div></div>
    <div class="pane" id="pane-help" hidden>
      <div class="help-search">

      </div>
      <div id="help-body" class="help"></div>
    </div>
    <div class="pane" id="pane-files" hidden><ul id="file-list" class="files"></ul></div>
  </aside>

  <div class="splitter" id="split-left" role="separator" aria-orientation="vertical" aria-label="拖动调整左侧栏宽度（双击恢复默认）" tabindex="0"></div>
  <div class="splitter" id="split-right" role="separator" aria-orientation="vertical" aria-label="拖动调整右侧栏宽度（双击恢复默认）" tabindex="0"></div>

</main>

<div id="modal" class="modal" hidden>

    if (!C.isNum(value) || Math.floor(value) !== value) {
      note("err", path ? path + "." + key : key, key + " 必须是整数，否则解析器抛错、整条施法被丢掉。");
      return false;
    }
    return true;
  }

  function checkNumbers(object, keys, path, note) {
    keys.forEach(function (key) {
      var value = object[key];
      if (value === undefined) return;
      if (!C.isNum(value)) {
        note("err", path ? path + "." + key : key, key + " 必须是数字，否则解析器抛错、整条施法被丢掉。");
      }
    });
  }

  /**
   * 未知键：Java 侧 JsonHelper.warnUnknown 只 log 一条警告，且把以 _ 开头的键当注释。
   */
  function unknownKeys(object, allowed, path, note) {
    Object.keys(object || {}).forEach(function (key) {
      if (key.charAt(0) === "_") return;
      if (allowed.indexOf(key) < 0) {
        note("warn", path ? path + "." + key : key,
          "不认识的键 '" + key + "'，解析器会忽略它（只有以 _ 开头才算注释）。");
      }
    });
  }

  function validateTarget(target, path, note, ctx) {
    if (target == null) return;
    if (typeof target === "string") {
      if (!C.enumHas(data().TARGET_TYPES, target)) {
        note("err", path, "未知的目标类型 '" + target + "'，整条施法会被丢掉。");
      }
      return;
    }
    if (!C.isObj(target)) {
      note("err", path, "target 必须是字符串或对象，否则整条施法被丢掉。");
      return;
    }
    unknownKeys(target, TARGET_KEYS, path, note);
    ["entityTypes", "entityTags", "excludeTags", "excludeCasterTeam"].forEach(function (key) {
      if (target[key] === undefined) return;
      note("warn", path + "." + key,
        "写在 target 层不会生效——解析器只认 target.filters." + key + "，这一层会被解析器忽略。",
        "把这一项挪进 filters 对象里。");
    });
    if (target.type != null && !C.enumHas(data().TARGET_TYPES, target.type)) {
      note("err", path + ".type", "未知类型 '" + target.type + "'，整条施法被丢掉。");
    }
    if (target.sort != null && !C.enumHas(data().TARGET_SORTS, target.sort)) {
      note("err", path + ".sort", "未知排序 '" + target.sort + "'，整条施法被丢掉。");
    }
    if (target.positionMode != null && !C.enumHas(data().POSITION_MODES, target.positionMode)) {
      note("err", path + ".positionMode", "未知瞄准模式 '" + target.positionMode + "'，整条施法被丢掉。");
    }
    checkBool(target, "lineOfSight", path, note);
    if (target.relativeOffset !== undefined) {
      var offset = target.relativeOffset;
      if (!C.isArr(offset)) {
        note("err", path + ".relativeOffset", "必须是数组，例如 [0, 0, 2]。");
      } else if (offset.length < 3) {
        note("err", path + ".relativeOffset", "必须至少三个数字，现在只有 " + offset.length + " 个，解析器会抛错。");
      } else {
        offset.forEach(function (value, index) {
          if (index >= 3) return;
          if (!C.isNum(value)) {
            note("err", path + ".relativeOffset[" + index + "]", "补位必须是数字。");
          }
        });
      }
    }
    if (target.filters !== undefined) {
      if (!C.isObj(target.filters)) {
        note("err", path + ".filters", "filters 必须是对象，否则整条施法被丢掉。");
      } else {
        var filters = target.filters;
        unknownKeys(filters, FILTER_KEYS, path + ".filters", note);
        ["entityTypes", "entityTags"].forEach(function (key) {
          if (filters[key] === undefined) return;
          if (!C.isArr(filters[key])) {
            note("err", path + ".filters." + key, "必须是数组（写成单个字符串会抛错），整条施法被丢掉。");
            return;
          }
          filters[key].forEach(function (id, index) {
            if (!C.isId(id)) {
              note("err", path + ".filters." + key + "[" + index + "]",
                "id 不合法：'" + id + "'。解析器对 filters." + key + " 里每个 id 都做 ResourceLocation.tryParse，失败就丢掉整条施法。");
            }
          });
        });
        if (filters.excludeTags !== undefined && !C.isArr(filters.excludeTags)) {
          note("warn", path + ".filters.excludeTags",
            "写成单个字符串也能读，但数组更清楚（这里不校验 id，标签名可以带 #）。");
        }
        ["excludeCasterTeam", "ignoreCreative", "requireNoShield"].forEach(function (key) {
          checkBool(filters, key, path + ".filters", note);
        });
        ["minHealthPercent", "maxHealthPercent"].forEach(function (key) {
          if (filters[key] === undefined) return;
          if (!C.isNum(filters[key])) {
            note("err", path + ".filters." + key, "必须是 0..1 的小数，否则整条施法被丢掉。");
          } else if (filters[key] < 0 || filters[key] > 1) {
            note("warn", path + ".filters." + key, "超出 0..1，筛选条件会永远不成立。");
          }
        });
        if (C.isNum(filters.minHealthPercent) && C.isNum(filters.maxHealthPercent)
          && filters.minHealthPercent > filters.maxHealthPercent) {
          note("warn", path + ".filters", "minHealthPercent 大于 maxHealthPercent，永远选不到目标。");
        }
        if (filters.ignoreCreative === undefined) {
          note("note", path + ".filters", "没写 ignoreCreative，默认是 true（忽略创造模式玩家）。");
        }
      }
    }
    if (target.placement !== undefined) {
      if (!C.isObj(target.placement)) {
        note("err", path + ".placement", "placement 必须是对象，否则整条施法被丢掉。");
      } else {
        unknownKeys(target.placement, PLACEMENT_KEYS, path + ".placement", note);
        ["avoidFluid", "avoidLava"].forEach(function (key) {
          checkBool(target.placement, key, path + ".placement", note);
        });
      }
    }
    ["minHealthPercent", "maxHealthPercent"].forEach(function (key) {
      if (target[key] === undefined) return;
      if (!C.isNum(target[key])) note("err", path + "." + key, "必须是 0..1 的小数。");
      else note("note", path + "." + key, "target 层的 " + key + " 会覆盖 filters 里的同名键，优先于 filters。");
    });
  }

  function validateConditions(conditions, path, note, ctx) {
    if (conditions == null) return;
    if (!C.isObj(conditions)) {
      note("err", path, "conditions 必须是对象，否则整条施法被丢掉。");
      return;
    }
    unknownKeys(conditions, CONDITIONS_KEYS, path, note);
    checkNumbers(conditions, ["healthBelow", "healthAbove", "minTargetDistance", "maxTargetDistance"], path, note);
    if (C.isNum(conditions.healthBelow) && C.isNum(conditions.healthAbove)
      && conditions.healthBelow < conditions.healthAbove) {
      note("warn", path, "healthBelow 小于 healthAbove，这两个条件永远不会同时成立。");
    }
    if (C.isNum(conditions.minTargetDistance) && C.isNum(conditions.maxTargetDistance)
      && conditions.minTargetDistance > conditions.maxTargetDistance) {
      note("warn", path, "minTargetDistance 大于 maxTargetDistance，条件永远不会成立。");
    }
    if (conditions.self !== undefined) {
      if (!C.isObj(conditions.self)) {
        note("err", path + ".self", "self 必须是对象，否则整条施法被丢掉。");
      } else {
        var self = conditions.self;
        Object.keys(self).forEach(function (key) {
          if (SELF_KEYS.indexOf(key) >= 0) return;
          note("note", path + ".self." + key, "self 里的这个键解析器不读，会被静默忽略（不会报错）。");
        });
        ["onFire", "inWater", "inLava", "frozen"].forEach(function (key) {
          checkBool(self, key, path + ".self", note);
        });
        ["healthBelow", "healthAbove"].forEach(function (key) {
          if (self[key] === undefined) return;
          if (!C.isNum(self[key])) {
            note("err", path + ".self." + key, "必须是 0..1 的小数，否则整条施法被丢掉。");
          } else if (conditions[key] === undefined) {
            note("note", path + ".self." + key, "没写顶层 " + key + " 时，self 里的这个值会被当作血量条件使用。");
          }
        });
      }
    }
    if (conditions.target !== undefined) {
      if (!C.isObj(conditions.target)) {
        note("err", path + ".target", "conditions.target 必须是对象。");
      } else {
        var ctarget = conditions.target;
        Object.keys(ctarget).forEach(function (key) {
          if (CONDITIONS_TARGET_KEYS.indexOf(key) >= 0) {
            if (!C.isNum(ctarget[key])) {
              note("err", path + ".target." + key, "必须是数字，否则整条施法被丢掉。");
            }
            return;
          }
          note("note", path + ".target." + key,
            "conditions.target 里解析器只读 minTargetDistance / maxTargetDistance，这个键不会被读，也不会报错。");
        });
      }
    }
    if (conditions.world !== undefined) {
      if (!C.isObj(conditions.world)) {
        note("err", path + ".world", "world 必须是对象，否则整条施法被丢掉。");
        return;
      }
      var world = conditions.world;
      Object.keys(world).forEach(function (key) {
        if (WORLD_KEYS.indexOf(key) < 0) {
          note("err", path + ".world." + key, "world 里出现未知键会直接抛错，整条施法被丢掉。");
        }
      });
      if (world.time !== undefined && world.timeOfDay !== undefined) {
        note("note", path + ".world", "time 与 timeOfDay 都写了，解析器优先用 time。");
      }
      if (world.time !== undefined) {
        checkEnumList(world.time, ["dawn", "day", "dusk", "night"], path + ".world.time", note, "time");
      }
      if (world.timeOfDay !== undefined) {
        checkEnumList(world.timeOfDay, ["dawn", "day", "dusk", "night"], path + ".world.timeOfDay", note, "timeOfDay");
      }
      if (world.weather !== undefined) {
        checkEnumList(world.weather, ["clear", "sunny", "rain", "raining", "thunder", "thunderstorm"],
          path + ".world.weather", note, "weather");
      }
      if (world.difficulty !== undefined) {
        checkEnumList(world.difficulty, ["peaceful", "easy", "normal", "hard"], path + ".world.difficulty", note, "difficulty");
      }
      if (world.moonPhase !== undefined) {
        asList(world.moonPhase).forEach(function (phase) {
          if (!C.isNum(phase) || Math.floor(phase) !== phase || phase < 0 || phase > 7) {
            note("err", path + ".world.moonPhase", "月相必须是 0..7 的整数，现在是 " + JSON.stringify(phase) + "。");
          }
        });
      }
      if (world.dimension !== undefined) {
        asList(world.dimension).forEach(function (id, index) {
          if (!C.isId(id)) {
            note("err", path + ".world.dimension" + (C.isArr(world.dimension) ? "[" + index + "]" : ""),
              "维度 id 不合法：'" + id + "'。解析器会抛 invalid dimension id，整条施法被丢掉。");
          }
        });
      }
      if (world.minDay !== undefined) {
        if (!C.isNum(world.minDay) || Math.floor(world.minDay) !== world.minDay) {
          note("err", path + ".world.minDay", "必须是整数。");
        } else if (world.minDay < 0) {
          note("warn", path + ".world.minDay", "负数没有意义，永远成立。");
        }
      }
    }
  }

  function validatePhase(phase, path, note, ctx) {
    if (phase == null) return;
    if (!C.isObj(phase)) {
      note("err", path, "onPhase 必须是对象，否则整条变体被丢掉。");
      return;
    }
    Object.keys(phase).forEach(function (key) {
      if (key.charAt(0) === "_") return;
      if (PHASE_KEYS.indexOf(key) < 0) {
        note("err", path + "." + key,
          "onPhase 里出现未知键会直接抛错，整条变体被丢掉（PhaseEffect 的白名单比普通字段严格）。");
      }
    });
    if (phase.weather != null) {
      checkEnumList(phase.weather, ["clear", "rain", "thunder"], path + ".weather", note, "weather");
    }
    if (phase.time != null) {
      checkEnumList(phase.time, ["day", "noon", "night", "midnight"], path + ".time", note, "time");
    }
    if (phase.bossBarColor != null) {
      var allowedColours = [];
      (data().BOSSBAR_COLORS || []).forEach(function (name) {
        allowedColours.push(String(name).toLowerCase());
      });
      if (allowedColours.indexOf(String(phase.bossBarColor).toLowerCase()) < 0) {
        note("err", path + ".bossBarColor",
          "只能是 " + allowedColours.join(" / ") + "（大小写不敏感），否则整条变体被丢掉。");
      }
    }
    ["title", "subtitle", "sound", "bossBarName"].forEach(function (key) {
      if (phase[key] !== undefined && typeof phase[key] !== "string") {
        note("err", path + "." + key,
          "必须是字符串：解析器用 optString，类型不对会抛错、整条变体被丢掉。");
      }
    });
    if (typeof phase.sound === "string" && !C.isId(phase.sound)) {
      note("err", path + ".sound", "声音 id 不合法：'" + phase.sound + "'，解析器会抛 invalid sound id。");
    }
    checkInts(phase, "phaseTicks", path, note);
    checkInts(phase, "invulnerableTicks", path, note);
    checkInts(phase, "freezeTicks", path, note);
    checkNumbers(phase, ["knockback"], path, note);
    checkBool(phase, "replay", path, note);
    if (C.isNum(phase.knockback) && (phase.knockback < 0 || phase.knockback > 16)) {
      note("warn", path + ".knockback", "会被 clamp 到 0..16。");
    }
    if (C.isNum(phase.phaseTicks) && (phase.phaseTicks < 10 || phase.phaseTicks > 1200)) {
      note("warn", path + ".phaseTicks", "会被 clamp 到 10..1200。");
    }
    if (C.isNum(phase.invulnerableTicks) && (phase.invulnerableTicks < 0 || phase.invulnerableTicks > 1200)) {
      note("warn", path + ".invulnerableTicks", "会被 clamp 到 0..1200。");
    }
    if (C.isNum(phase.freezeTicks)) {
      if (phase.freezeTicks < 0) {
        note("note", path + ".freezeTicks", "负数表示跟随 invulnerableTicks（默认 -1）。");
      } else if (phase.freezeTicks > 1200) {
        note("warn", path + ".freezeTicks", "会被 clamp 到 0..1200。");
      }
    }
    if (phase.shake !== undefined) {
      if (!C.isObj(phase.shake)) {
        note("err", path + ".shake", "shake 必须是对象，否则整条变体被丢掉。");
      } else {
        unknownKeys(phase.shake, SHAKE_KEYS, path + ".shake", note);
        checkInts(phase.shake, "duration", path + ".shake", note);
        checkNumbers(phase.shake, ["radius"], path + ".shake", note);
        if (C.isNum(phase.shake.duration) && (phase.shake.duration < 1 || phase.shake.duration > 200)) {
          note("warn", path + ".shake.duration", "会被 clamp 到 1..200。");
        }
        if (C.isNum(phase.shake.radius) && (phase.shake.radius < 1 || phase.shake.radius > 64)) {
          note("warn", path + ".shake.radius", "会被 clamp 到 1..64。");
        }
      }
    }
    if (phase.burst !== undefined) {
      if (!C.isObj(phase.burst)) {
        note("err", path + ".burst", "burst 必须是对象，否则整条变体被丢掉。");
      } else {
        unknownKeys(phase.burst, BURST_KEYS, path + ".burst", note);
        checkNumbers(phase.burst, ["radius"], path + ".burst", note);
        if (C.isNum(phase.burst.radius) && (phase.burst.radius < 1 || phase.burst.radius > 16)) {
          note("warn", path + ".burst.radius", "会被 clamp 到 1..16。");
        }
        if (phase.burst.color !== undefined && phase.burst.colour !== undefined) {
          note("note", path + ".burst", "color 与 colour 都写了，读取顺序是先 color 再 colour。");
        }
        ["color", "colour"].forEach(function (key) {
          var value = phase.burst[key];
          if (value === undefined) return;
          if (typeof value !== "string") {
            note("err", path + ".burst." + key, "颜色要用字符串（\"auto\" 或 #RRGGBB），否则整条变体被丢掉。");
          } else if (value.toLowerCase() !== "auto" && !/^#[0-9a-f]{6}$/i.test(value)) {
            note("warn", path + ".burst." + key, "不是 auto 也不是 #RRGGBB，粒子颜色可能不按预期显示。");
          }
        });
      }
    }
    if (phase.summon !== undefined) {
      if (!C.isObj(phase.summon)) {
        note("err", path + ".summon", "summon 必须是对象，否则整条变体被丢掉。");
      } else {
        unknownKeys(phase.summon, SUMMON_KEYS, path + ".summon", note);
        if (!phase.summon.entity) {
          note("err", path + ".summon.entity", "缺少实体 id：解析器必填，缺了整条变体被丢掉。");
        } else if (typeof phase.summon.entity !== "string") {
          note("err", path + ".summon.entity", "实体 id 必须是字符串。");
        } else if (!C.isId(phase.summon.entity)) {
          note("err", path + ".summon.entity", "实体 id 不合法：'" + phase.summon.entity + "'。");
        }
        checkInts(phase.summon, "count", path + ".summon", note);
        checkNumbers(phase.summon, ["radius"], path + ".summon", note);
        if (C.isNum(phase.summon.count) && (phase.summon.count < 1 || phase.summon.count > 16)) {
          note("warn", path + ".summon.count", "会被 clamp 到 1..16。");
        }
        if (C.isNum(phase.summon.radius) && (phase.summon.radius < 1 || phase.summon.radius > 16)) {
          note("warn", path + ".summon.radius", "会被 clamp 到 1..16。");
        }
        if (phase.summon.tags !== undefined) {
          if (!C.isArr(phase.summon.tags)) {
            note("err", path + ".summon.tags", "必须是数组，否则整条变体被丢掉。");
          } else {
            phase.summon.tags.forEach(function (tag, index) {
              if (typeof tag !== "string") {
                note("err", path + ".summon.tags[" + index + "]", "标签必须是字符串。");
              }
            });
          }
        }
      }
    }
  }

  function validateSelector(selector, path, note, ctx) {
    if (selector === undefined || selector === null) {
      note("err", path, "缺少 select 对象，整条变体会被丢掉（变体必须能被某个条件选中）。");
      return;
    }
    if (!C.isObj(selector)) {
      note("err", path, "select 必须是对象，否则整条变体被丢掉。");
      return;
    }
    Object.keys(selector).forEach(function (key) {
      if (key.charAt(0) === "_") return;
      if (SELECT_KEYS.indexOf(key) < 0 && SELECT_EXTRA.indexOf(key) < 0) {
        note("warn", path + "." + key, "不认识的键 '" + key + "'，解析器会忽略它。");
      }
    });
    var hasOne = SELECT_KEYS.some(function (key) { return selector[key] !== undefined; });
    if (!hasOne) {
      note("err", path, "至少要填 name / nameRegex / tags / healthBelow / healthAbove / tamed 之一，否则整条变体被丢掉。");
    }
    if (selector.name !== undefined && typeof selector.name !== "string") {
      note("err", path + ".name", "必须是字符串，否则整条变体被丢掉。");
    }
    if (selector.tags !== undefined) {
      if (!C.isArr(selector.tags)) {
        note("err", path + ".tags", "必须是字符串数组（写成单个字符串会抛错），整条变体被丢掉。");
      } else {
        selector.tags.forEach(function (tag, index) {
          if (typeof tag !== "string") {
            note("err", path + ".tags[" + index + "]", "标签必须是字符串，数字/对象都会让整条变体被丢掉。");
          }
        });
      }
    }
    if (selector.tamed !== undefined && typeof selector.tamed !== "boolean") {
      note("err", path + ".tamed", "必须是布尔值，否则整条变体被丢掉。");
    }
    ["healthBelow", "healthAbove"].forEach(function (key) {
      if (selector[key] === undefined) return;
      if (!C.isNum(selector[key])) {
        note("err", path + "." + key, "必须是 0..1 的数字，否则整条变体被丢掉。");
      } else if (selector[key] < 0 || selector[key] > 1) {
        note("warn", path + "." + key, "会被悄悄夹到 0..1，写 " + selector[key] + " 等于写 " + Math.max(0, Math.min(1, selector[key])) + "。");
      }
    });
    if (C.isNum(selector.healthBelow) && C.isNum(selector.healthAbove)
      && selector.healthBelow <= selector.healthAbove) {
      note("err", path, "healthBelow 必须大于 healthAbove，否则解析器抛错、整条变体被丢掉。");
    }
    if (selector.nameRegex != null) {
      try {
        new RegExp(String(selector.nameRegex));
