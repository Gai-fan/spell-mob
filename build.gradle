plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = mod_group_id
version = mod_version

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArguments.addAll '--nogui'
        }
        data {
            data()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // The official NeoForged maven is not reachable from this machine, so the
    // BMCLAPI maven mirror is used first; it proxies the same coordinates.
    maven {
        name = "NeoForged Mirror"
        url = "https://bmclapi2.bangbang93.com/maven/"
    }
    maven {
        name = "Iron's Maven - Release"
        url = "https://code.redspace.io/releases"
    }
    maven {
        name = "Iron's Maven - Snapshots"
        url = "https://code.redspace.io/snapshots"
    }
    mavenCentral()
    maven {
        name = "Mojang Libraries"
        url = "https://libraries.minecraft.net/"
    }
}

dependencies {
    // The full jar is used instead of the ":api" classifier on purpose: MagicData cannot be used
    // without a SyncedSpellData instance (initiateCast NPEs otherwise) and that class is not part
    // of the published API surface.
    compileOnly "io.redspace.ironsspellbooks:irons_spellbooks:${irons_spells_version}"
    runtimeOnly "io.redspace.ironsspellbooks:irons_spellbooks:${irons_spells_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = mod_id
    manifest {
        attributes('Implementation-Version': project.version)
    }
}
