  var ATTR_ESC = /["&<>]/;

  function attrValue(value) {
    if (value == null) return "";
    return esc(value);
  }

  function numField(path, label, value, def, opts) {
    var o = opts || {};
    var extra = "";
    if (o.step != null) extra += ' step="' + o.step + '"';
    if (o.min != null) extra += ' min="' + o.min + '"';
    if (o.max != null) extra += ' max="' + o.max + '"';
    return '<label class="f' + (o.wide ? " wide" : "") + '">'
      + '<span>' + esc(label) + '</span>'
      + '<input type="number" spellcheck="false"'
      + ' data-path="' + esc(path) + '" data-type="num" data-def="' + esc(def) + '"'
      + extra
      + ' value="' + attrValue(value) + '" placeholder="' + esc(def) + '">'
      + '</label>';
  }

  function textField(path, label, value, placeholder, listId, opts) {
    var o = opts || {};
    return '<label class="f' + (o.wide ? " wide" : "") + '">'
      + '<span>' + esc(label) + '</span>'
      + '<input type="text" spellcheck="false" autocomplete="off"'
      + ' data-path="' + esc(path) + '" data-type="' + (o.type || "text") + '"'
      + (listId ? ' list="' + listId + '"' : "")
      + ' value="' + attrValue(value) + '" placeholder="' + esc(placeholder || "") + '">'
      + '</label>';
  }

  /**
   * 下拉：value 为 undefined 时选中第一项（值为空串）。
   * options: [{ v: "值", t: "显示文本" }]
   */
  function selectField(path, label, value, options, opts) {
    var o = opts || {};
    var html = '<label class="f' + (o.wide ? " wide" : "") + '"><span>' + esc(label) + '</span>'
      + '<select data-path="' + esc(path) + '" data-type="' + (o.type || "text") + '">';
    for (var i = 0; i < options.length; i++) {
      var option = options[i];
      var selected = String(value == null ? "" : value) === String(option.v) ? " selected" : "";
      html += '<option value="' + esc(option.v) + '"' + selected + '>' + esc(option.t) + '</option>';
    }
    html += '</select></label>';
    return html;
  }

  /** 三态布尔：空串 = 不写这个键。 */
  function triField(path, label, value, onText, offText, emptyText) {
    var current = value === true ? "true" : (value === false ? "false" : "");
    return selectField(path, label, current, [
      { v: "", t: emptyText },
      { v: "true", t: onText },
      { v: "false", t: offText }
    ], { type: "tristate" });
  }

  function enumOptions(items, emptyText) {
    var options = [{ v: "", t: emptyText }];
    for (var i = 0; i < items.length; i++) {
      options.push({ v: items[i].id, t: items[i].id + "　" + items[i].zh });
    }
    return options;
  }

  function detailsOpen(path, title, badge, fallback) {
    return '<details class="sub"' + openAttr(path, fallback) + '>'
      + '<summary><span>' + esc(title) + '</span>'
      + (badge ? '<span class="tag">' + esc(badge) + '</span>' : "")
      + '</summary><div class="sub-body">';
  }

  function defaultCast() {
    return { spell: DEFAULT_SPELL, level: 1, cooldown: 100, priority: 2, castTime: 20 };
  }

  /* ------------------------------------------------------------- 渲染：顶栏 */

  function renderTop() {
    var project = state.project;
    $("#f-name").value = project.name || "";
    var versionSelect = $("#f-version");
    versionSelect.innerHTML = D.VERSIONS.map(function (version) {
      var format = D.PACK_FORMATS[version];
      var selected = version === project.mcVersion ? " selected" : "";
      return '<option value="' + esc(version) + '"' + selected + '>' + esc(version) + " (pack_format " + format + ")</option>";
    }).join("");
    var modeSelect = $("#f-mode");
    modeSelect.value = project.outputMode || "min";
  }

  /* ------------------------------------------------------- 渲染：左侧列表 */

  function problemsFor(id) {
    var errors = 0;
    var warns = 0;
    var notes = 0;
    state.problems.forEach(function (problem) {
      if (problem.entity !== id) return;
      if (problem.sev === "err") errors++;
      else if (problem.sev === "warn") warns++;
      else notes++;
    });
    return { errors: errors, warns: warns, notes: notes };
  }

  function renderSidebar() {
    var allIds = Object.keys(state.project.entities);
    var query = String(state.search || "").trim().toLowerCase();
    var ids = query ? allIds.filter(function (id) {
      var info = entityInfo(id);
      return (id + " " + (info ? info.zh + " " + info.en : "")).toLowerCase().indexOf(query) >= 0;
    }) : allIds;
    $("#entity-count").textContent = query ? ids.length + " / " + allIds.length : String(allIds.length);
    if (!allIds.length) {
      $("#entity-list").innerHTML = "<li class=\"empty\">No entities yet. Click \"New\" to create one, or pick a template.</li>";
      return;
    }
    if (!ids.length) {
      $("#entity-list").innerHTML = "<li class=\"empty\">No entities match &quot;" + esc(state.search) + "\".</li>";
      return;
    }
    $("#entity-list").innerHTML = ids.map(function (id) {
      var rules = state.project.entities[id] || {};
      var goals = isArr(rules.goals) ? rules.goals.length : 0;
      var variants = isArr(rules.variants) ? rules.variants.length : 0;
      var stats = problemsFor(id);
      var meta = [];
      meta.push(goals + " active");
      if (variants) meta.push(variants + plural(variants, " variant", " variants"));
      if (isArr(rules.dropRules) && rules.dropRules.length) meta.push(rules.dropRules.length + plural(rules.dropRules.length, " drop", " drops"));
      var dots = "";
      if (stats.errors) dots += '<span class="dot err" title="' + stats.errors + " errors\"></span>";
      if (stats.warns) dots += '<span class="dot warn" title="' + stats.warns + " warnings\"></span>";
      if (stats.notes) dots += '<span class="dot note" title="' + stats.notes + " notes\"></span>";
      var info = entityInfo(id);
      return '<li class="entity' + (id === state.selected ? " on" : "") + '" data-act="select-entity" data-id="' + esc(id) + '">'
        + '<div class="eid">' + esc(id) + (info ? '' : " <span class=\"tag\">Custom</span>") + '</div>'
        + '<div class="meta">' + esc(meta.join(" · ")) + dots + '</div>'
        + '</li>';
    }).join("");
  }

  /* ------------------------------------------------- 渲染：右侧三个面板 */

  function renderJson() {
    var file = selectedFile();
    var out = $("#json-out");
    var head = $("#json-file");
    if (!file) {
      head.textContent = "";
      out.textContent = "// Select an entity on the left";
      return;
    }
    head.textContent = file.path;
    var text = file.text.replace(/\n$/, "");
    var ranges = state.jsonHl ? rootKeyRanges(text, state.jsonHl) : [];
    if (!ranges.length) {
      out.textContent = text;
      return;
    }
    var html = "";
    var at = 0;
    ranges.forEach(function (range) {
      if (range.start < at) return;
      html += esc(text.slice(at, range.start))
        + '<mark class="json-hl">' + esc(text.slice(range.start, range.end)) + "</mark>";
      at = range.end;
    });
    out.innerHTML = html + esc(text.slice(at));
  }

  /* ------------------------------------------- 章节导航：跳转 + JSON 高亮 */

  function skipJsonString(text, from) {
    var i = from + 1;
    while (i < text.length) {
      var ch = text.charAt(i);
      if (ch === "\\") { i += 2; continue; }
      if (ch === '"') return i + 1;
      i++;
    }
    return text.length;
  }

  /** 从 from 开始（可以带空白）跳过一个完整的 JSON 值，返回它结束后的下标。 */
  function skipJsonValue(text, from) {
    var i = from;
    while (i < text.length && /\s/.test(text.charAt(i))) i++;
    if (i >= text.length) return text.length;
    var ch = text.charAt(i);
    if (ch === '"') return skipJsonString(text, i);
    if (ch === "{" || ch === "[") {
      var depth = 0;
      while (i < text.length) {
        var c = text.charAt(i);
        if (c === '"') { i = skipJsonString(text, i); continue; }
        if (c === "{" || c === "[") depth++;
        else if (c === "}" || c === "]") {
          depth--;
          if (depth === 0) return i + 1;
        }
        i++;
      }
      return text.length;
    }
    while (i < text.length) {
      var stop = text.charAt(i);
      if (stop === "," || stop === "}" || stop === "]") break;
      i++;
    }
    while (i > from && /\s/.test(text.charAt(i - 1))) i--;
    return i;
  }

  /** 根层某几个键（连同值）在文本里的区间，用来给右侧 JSON 加亮。 */
  function rootKeyRanges(text, keys) {
    var want = {};
    (keys || []).forEach(function (key) { want[key] = true; });
    var ranges = [];
    var depth = 0;
    var i = 0;
    while (i < text.length) {
      var ch = text.charAt(i);
      if (ch === '"') {
        var end = skipJsonString(text, i);
        if (depth === 1 && want[text.slice(i + 1, end - 1)]) {
          var colon = text.indexOf(":", end);
          if (colon >= 0) {
            var valueEnd = skipJsonValue(text, colon + 1);
            if (valueEnd > end) {
              ranges.push({ start: i, end: valueEnd });
              i = valueEnd;
              continue;
            }
          }
        }
        i = end;
        continue;
      }
      if (ch === "{" || ch === "[") depth++;
      else if (ch === "}" || ch === "]") depth--;
      i++;
    }
    return ranges;
  }


  /**
   * 点章节导航条：中栏滚到那张卡（钉住的导航条高度要扣掉），
   * 右栏切到 JSON 并把对应的根级键加亮。
   */
  function jumpToSection(key) {
    var section = sectionByKey(key);
    if (!section) return;
    var host = $("#editor");
    var target = document.getElementById("sec-" + key);
    if (host && target) {
      var nav = host.querySelector(".secnav");
      var offset = nav ? nav.offsetHeight : 0;
      var delta = target.getBoundingClientRect().top - host.getBoundingClientRect().top - offset;
      host.scrollTop = Math.max(0, host.scrollTop + delta);
    }
    state.jsonHl = section.keys;
    state.tab = "json";
    renderPanes();
    renderJson();
    var pane = $("#pane-json");
    var mark = document.querySelector("#json-out .json-hl");
    if (pane && mark) {
      var top = mark.getBoundingClientRect().top - pane.getBoundingClientRect().top + pane.scrollTop;
      pane.scrollTop = Math.max(0, top - Math.round(pane.clientHeight / 3));
    }
  }

  /* 诊断里的路径是 a.b[0].c，字段的 data-path 是 a/b/0/c；只差这一层转换。 */
  function diagToPath(diagPath) {
    return String(diagPath || "")
      .replace(/\[(\d+)\]/g, "/$1")
      .replace(/\./g, "/")
      .replace(/^\/+|\/+$/g, "");
  }

  var ROOT_SECTIONS = {
    bossBar: "bossbar",
    disableAttackGoals: "behavior",
    goals: "goals",
    onHurt: "triggers", onTarget: "triggers", onDeath: "triggers", onKill: "triggers",
    dropRules: "drops",
    variants: "variants"
  };

  /**
   * 点检查面板里的一条：切到对应实体 → 把沿途的卡片 / 施法条目 / details 全部展开
   * → 中栏滚到那个字段并闪一下。字段本身没渲染出来（比如整个键没写）时，
   * 退一步找它下面的第一个字段，再退一步跳到所在章节。
   */
  function gotoProblem(index) {
    var problem = state.problems[index];
    if (!problem || !problem.entity) return;
    if (!state.project.entities[problem.entity]) {
      toast("This entity has been removed from the project.");
      return;
    }
    state.selected = problem.entity;
    var rel = diagToPath(problem.path);
    var host = $("#editor");
    if (!rel) {
      host.scrollTop = 0;
      return;
    }
    var domPath = "entities/" + problem.entity + "/" + rel;
    var parts = domPath.split("/");
    var prefix = "";
    for (var i = 0; i < parts.length; i++) {
      prefix = prefix ? prefix + "/" + parts[i] : parts[i];
      state.open[prefix] = true;              // <details> 的 open
      state.open["cast:" + prefix] = true;    // 施法条目的折叠
      state.open["variant:" + prefix] = true; // 变体条目的折叠
    }
    var section = ROOT_SECTIONS[rel.split("/")[0]];
    if (section) state.open["card:" + section] = true;
    renderAll();
    host = $("#editor");
    var target = host.querySelector('[data-path="' + domPath.replace(/"/g, '\\"') + '"]');
    if (!target) {
      var all = host.querySelectorAll("[data-path]");
      for (var a = 0; a < all.length; a++) {
        if (String(all[a].getAttribute("data-path")).indexOf(domPath + "/") === 0) { target = all[a]; break; }
      }
    }
    if (!target) {
      if (section) jumpToSection(section);
      else toast("This diagnostic refers to the whole configuration; there is no single field for it in the editor.");
      return;
    }
    var nav = host.querySelector(".secnav");
    var offset = nav ? nav.offsetHeight : 0;
    var delta = target.getBoundingClientRect().top - host.getBoundingClientRect().top - offset - 18;
    host.scrollTop = Math.max(0, host.scrollTop + delta);
    target.classList.remove("flash");
    void target.offsetWidth;                  // 让动画能重新开始
    target.classList.add("flash");
    setTimeout(function () { target.classList.remove("flash"); }, 1500);
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(target.tagName) && target.focus) {
      target.focus({ preventScroll: true });
    }
  }

  /**
   * 三级诊断：err 会让这条配置被丢掉，warn 是模组会忽略或悄悄改写，
   * note 只是提醒（比如某个键给了默认值）。每条都带修复建议。
   */
  /**
   * 检查页的过滤级别。note 大多是「没写就是默认值」这类提醒，
   * 一个文件几百条的时候全列出来会把真正的错误埋掉。
   */
  var PROBLEM_FILTERS = {
    all: function () { return true; },
    serious: function (problem) { return problem.sev !== "note"; },
    err: function (problem) { return problem.sev === "err"; }
  };

  /** 能自动修的诊断（core.js 在 note 里带了 fix 标记）。 */
  function fixableProblems() {
    return state.problems.filter(function (problem) {
      return problem.fix && problem.entity && state.project.entities[problem.entity];
    });
  }

  function renderProblems() {
    var list = $("#problem-list");
    var counts = { err: 0, warn: 0, note: 0 };
    state.problems.forEach(function (problem) {
      counts[problem.sev] = (counts[problem.sev] || 0) + 1;
    });
    $("#problem-count").textContent = String(state.problems.length);

    var filter = PROBLEM_FILTERS[state.problemFilter] || PROBLEM_FILTERS.all;
    var shown = [];
    state.problems.forEach(function (problem, index) {
      if (filter(problem)) shown.push({ problem: problem, index: index });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#pane-problems [data-act="problem-filter"]'), function (button) {
      button.classList.toggle("on", button.getAttribute("data-filter") === state.problemFilter);
    });
    var fixAllBtn = $("#fix-all");
    if (fixAllBtn) {
      var fixables = fixableProblems();
      fixAllBtn.hidden = !fixables.length;
      fixAllBtn.textContent = "Fix all (" + fixables.length + ")";
      fixAllBtn.title = fixables.length
        ? "Apply the " + fixables.length + " safe fixes:" + fixables.map(function (p) { return fixTitle(p.fix); }).join(", ")
        : "No automatically fixable problems";
    }

    var summary = $("#problem-summary");
    if (summary) {
      var hidden = state.problems.length - shown.length;
      summary.innerHTML = (state.problems.length
        ? "<span class=\"sev err\">Errors " + counts.err + "</span>"
          + "<span class=\"sev warn\">Warnings " + counts.warn + "</span>"
          + "<span class=\"sev note\">Notes " + counts.note + "</span>"
        : "<span class=\"sev ok\">All clear</span>")
        + (hidden > 0 ? "<span class=\"hint\">Hidden by filter: " + hidden + " notes</span>" : "");
    }
    if (!state.problems.length) {
      list.innerHTML = "<li class=\"empty\">No problems found. You can export.</li>";
      return;
    }
    if (!shown.length) {
      list.innerHTML = "<li class=\"empty\">No diagnostics under the current filter. Switch to \"All\" to see everything.</li>";
      return;
    }
    list.innerHTML = shown.map(function (row) {
      var problem = row.problem;
      var index = row.index;
      /* 点一条诊断 → 中栏跳到那个字段。整条都是按钮，键盘也能按。 */
      var jumpable = problem.entity && state.project.entities[problem.entity];
      return '<li class="problem ' + problem.sev + (jumpable ? " jumpable" : "") + '"'
        + (jumpable
          ? ' data-act="goto-problem" data-i="' + index + "\" tabindex=\"0\" role=\"button\" title=\"Jump to the matching field in the middle pane\""
          : "")
        + '>'
        + '<div class="where">' + esc(problem.where) + "</div>"
        + '<div class="msg">' + esc(problem.msg) + "</div>"
        + (problem.hint ? '<div class="hint">→ ' + esc(problem.hint) + "</div>" : "")
        + (jumpable ? "<div class=\"jump-hint\">Jump to this field →</div>" : "")
        + (problem.fix ? '<button class="btn mini fix" data-act="fix-problem" data-i="' + index + '">'
          + esc(fixTitle(problem.fix)) + "</button>" : "")
        + "</li>";
    }).join("");
  }

  function fixTitle(fix) {
    if (fix === "sort-variants") return "Sort by threshold";
    if (fix === "clear-dead-sticky") return "Remove invalid sticky";
    if (fix === "explicit-player-kill") return "Write out default values";
    return "Fix";
  }

  /** 递归找出所有掉落条目，把没写的 requirePlayerKill 补成 true（默认值，行为不变）。 */
  function writePlayerKillDefaults(node) {
    var changed = 0;
    (function walk(value) {
      if (isArr(value)) {
        value.forEach(walk);
        return;
      }
      if (!isObj(value)) return;
      Object.keys(value).forEach(function (key) {
        var child = value[key];
        if (key === "drops" && isArr(child)) {
          child.forEach(function (entry) {
            if (isObj(entry) && (entry.item !== undefined || entry.lootTable !== undefined)
              && entry.requirePlayerKill === undefined) {
              entry.requirePlayerKill = true;
              changed += 1;
            }
          });
        }
        if (isObj(child) || isArr(child)) walk(child);
      });
    })(node);
    return changed;
  }

  /** 按 fix 标记改数据；返回改了点什么，用于 toast。 */
  function applyFix(fix, entityId) {
    var rules = state.project.entities[entityId];
    if (!isObj(rules)) return 0;
    if (fix === "sort-variants") {
      if (!isArr(rules.variants) || rules.variants.length < 2) return 0;
      var sorted = CORE.sortVariants(rules.variants);
      rules.variants.length = 0;
      Array.prototype.push.apply(rules.variants, sorted);
      return 1;
    }
    if (fix === "clear-dead-sticky") {
      if (!isArr(rules.variants) || !rules.variants.length) return 0;
      var last = rules.variants[rules.variants.length - 1];
      if (!isObj(last) || last.sticky === undefined) return 0;
      delete last.sticky;
      return 1;
    }
    if (fix === "explicit-player-kill") {
      return writePlayerKillDefaults(rules);
    }
    return 0;
  }

  function runFixes(rows) {
    var touched = 0;
    var entities = {};
    rows.forEach(function (row) {
      var problem = state.problems[row];
      if (!problem || !problem.fix) return;
      var changed = applyFix(problem.fix, problem.entity);
      if (changed) {
        touched += 1;
        entities[problem.entity] = true;
      }
    });
    if (!touched) {
      toast("Nothing needed fixing.");
      return;
    }
    validate();
    renderAll();
    toast("Fixed " + touched + plural(touched, " issue", " issues") + " (" + Object.keys(entities).length + plural(Object.keys(entities).length, " entity", " entities") + "). You can undo with Ctrl+Z.");
  }

  function renderFiles() {
    var files = buildFiles();
    $("#file-list").innerHTML = files.map(function (file) {
      var size = byteLen(file.text);
      var id = entityIdForPath(file.path);
      return '<li class="file' + (id && id === state.selected ? " on" : "") + '"'
        + (id ? ' data-act="select-entity" data-id="' + esc(id) + '"' : "")
        + '><span class="path">' + esc(file.path) + '</span>'
        + '<span class="size">' + size + ' B</span></li>';
    }).join("");
  }

  function entityIdForPath(path) {
    var match = /^data\/([^/]+)\/spell_casters\/(.+)\.json$/.exec(path);
    return match ? match[1] + ":" + match[2] : null;
  }

  function helpTotalCount() {
    return D.HELP.reduce(function (sum, group) { return sum + group.items.length; }, 0);
  }

  function helpItemMatches(item, groupTitle, query) {
    if (!query) return true;
    var hay = groupTitle + " " + item.k + " " + (item.def || "") + " " + (item.req || "") + " " + item.text;
    return hay.toLowerCase().indexOf(query) >= 0;
  }

  /** 「帮助」页签。带一个搜索框：按键名、默认值、说明文字过滤，组标题本身也参与匹配。 */
  function renderHelp() {
    var query = String(state.helpQ || "").trim().toLowerCase();
    var all = helpTotalCount();
    var matched = 0;
    var sections = [];
    D.HELP.forEach(function (group) {
      var items = group.items.filter(function (item) { return helpItemMatches(item, group.title, query); });
      if (!items.length) return;
      matched += items.length;
      sections.push('<section class="help-group"><h3>' + esc(group.title) + '</h3><dl>'
        + items.map(function (item) {
          var tags = "";
          if (item.req) tags += '<span class="tag req">' + esc(item.req) + '</span>';
          if (item.def) tags += "<span class=\"tag def\">Default " + esc(item.def) + '</span>';
          return '<div class="help-item"><dt><code>' + esc(item.k) + '</code>' + tags + '</dt>'
            + '<dd>' + esc(item.text) + '</dd></div>';
        }).join("")
        + '</dl></section>');
    });
    var counter = $("#help-count");
    if (counter) counter.textContent = query ? matched + " / " + all + plural(all, " entry", " entries") : "Total " + all + plural(all, " entry", " entries");
    if (!sections.length) {
      return "<p class=\"empty\">No fields match &quot;" + esc(state.helpQ) + "&quot;. Try an English key name, such as cooldown, world, drops or variant.</p>";
    }
    return sections.join("");
  }

  function renderPanes() {
    var tabs = document.querySelectorAll("#tabs button");
    for (var i = 0; i < tabs.length; i++) {
      var tab = tabs[i].getAttribute("data-tab");
      if (tab === state.tab) tabs[i].classList.add("on");
      else tabs[i].classList.remove("on");
    }
    $("#pane-json").hidden = state.tab !== "json";
    $("#pane-problems").hidden = state.tab !== "problems";
    $("#pane-stats").hidden = state.tab !== "stats";
    $("#pane-sim").hidden = state.tab !== "sim";
    $("#pane-help").hidden = state.tab !== "help";
    $("#pane-files").hidden = state.tab !== "files";
    if (state.tab === "stats") renderStats();
    if (state.tab === "sim") renderSim();
    else simPlayStop();
  }

  /* ------------------------------------------------------------ 编辑区 */

  function csvText(value) {
    if (isArr(value)) return value.join(", ");
    if (value == null) return "";
    return String(value);
  }

  function vecText(value) {
    if (isArr(value)) return value.join(", ");
    return value == null ? "" : String(value);
  }

  /* 中栏的卡片 = 章节；顶部的导航条按这份清单生成，右栏 JSON 高亮也用同一套键 */
  var SECTIONS = [
    { key: "bossbar", label: "Boss bar bossBar", keys: ["bossBar"] },
    { key: "behavior", label: "Behavior", keys: ["disableAttackGoals"] },
    { key: "goals", label: "Active spells", keys: ["goals"] },
    { key: "triggers", label: "Triggers", keys: ["onHurt", "onTarget", "onDeath", "onKill"] },
    { key: "drops", label: "Drops", keys: ["dropRules"] },
    { key: "variants", label: "Variants", keys: ["variants"] }
  ];

  function sectionByKey(key) {
    for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].key === key) return SECTIONS[i];
    return null;
  }

  /** 钉在中栏顶部的一条章节导航：点它滚到对应卡片，并在右侧 JSON 里加亮那段。 */
  function sectionNav(skipKey) {
    return "<nav class=\"secnav\" aria-label=\"Section navigation\">"
      + SECTIONS.filter(function (section) { return section.key !== skipKey; }).map(function (section) {
        return '<button class="secnav-item" data-act="jump" data-sec="' + section.key + '"'
          + " title=\"Jump to &quot;" + esc(section.label) + "&quot; and highlight this section in the JSON pane\">"
          + esc(section.label) + '</button>';
      }).join("")
      + '</nav>';
  }

  function card(key, title, hint, body, head) {
    var fold = foldKey("card", key);
    return '<section class="card foldable' + (isFolded(fold) ? " folded" : "") + '" id="sec-' + esc(key) + '" data-sec="' + esc(key) + '">'
      + '<div class="card-head" role="button" tabindex="0" data-act="fold" aria-expanded="' + (isFolded(fold) ? "false" : "true") + '" data-key="' + esc(fold) + "\" title=\"Click to collapse / expand\">"
      + '<h3><i class="chev" aria-hidden="true">▾</i>' + esc(title) + '</h3>'
      + '<div class="card-side">' + (hint ? '<span class="hint">' + esc(hint) + '</span>' : "") + (head || "") + '</div>'
      + '</div><div class="card-body">' + body + '</div></section>';
  }

  function entityHead(id, base) {
    var info = entityInfo(id);
    return '<header class="ed-head">'
      + '<div class="ed-title">'
      + '<input class="eid-input" data-role="entity-id" value="' + esc(id) + '" list="entity-id-list" spellcheck="false" autocomplete="off">'
      + (info ? '<span class="tag ok">' + esc(info.zh) + '</span>' : "<span class=\"tag\">Not in the built-in list</span>")
      + '</div>'
      + '<div class="filepath">' + esc(entityFilePath(id)) + '</div>'
      + '<div class="ed-acts">'
      + "<button class=\"btn mini\" data-act=\"dup-entity\">Duplicate</button>"
      + "<button class=\"btn mini danger\" data-act=\"del-entity\">Delete</button>"
      + '</div>'
      + '</header>';
  }

  /**
   * 变体的 select 血量阈值 = 这一阶段的绝对血量区间。
   * 施法条件里不再重复提供 healthBelow / healthAbove，避免和 select 打架。
   */
  function phaseContext(select) {
    if (!isObj(select)) return null;
    var below = typeof select.healthBelow === "number" ? select.healthBelow : null;
    var above = typeof select.healthAbove === "number" ? select.healthAbove : null;
    if (below == null && above == null) return null;
    var parts = [];
    if (below != null) parts.push("hp ≤ " + percentText(below));
    if (above != null) parts.push("hp > " + percentText(above));
    return { below: below, above: above, text: "This phase: " + parts.join(" · ") };
  }

  function castListHtml(list, path, addLabel, phase) {
    var items = isArr(list) ? list : [];
    var html = items.map(function (cast, index) {
      return castHtml(cast, path + "/" + index, phase);
    }).join("");
    return '<div class="cast-list">' + html + '</div>'
      + '<button class="btn ghost" data-act="add-goal" data-path="' + esc(path) + '">+ ' + esc(addLabel || "Add a spell") + '</button>';
  }

  /** 法术名前面那个学派色点 + 名字。两者放在同一个 inline-flex 里，圆点才和文字垂直居中对齐，而不是掉在左下角。 */
  function spellTagHtml(path, spell) {
    var info = spellInfo(spell);
    var color = CORE.schoolColor(info ? info.school : "");
    return '<span class="spell-tag">'
      + '<span class="school-dot" data-dotof="' + esc(path) + '" style="background:' + esc(color) + '"></span>'
      + '<span class="spell-zh' + (info ? "" : " bad") + '" data-zhof="' + esc(path) + '"'
      + (info ? ' style="color:' + esc(color) + '"' : "") + '>'
      + esc(spellLabel(spell)) + '</span></span>';
  }

  function castHtml(cast, path, phase) {
    var c = isObj(cast) ? cast : {};
    var body = '<div class="fields">'
      + numField(path + "/level", "Level", c.level, D.CAST_DEFAULTS.level, { min: 1, max: 10 })
      + numField(path + "/cooldown", "Cooldown", c.cooldown, D.CAST_DEFAULTS.cooldown)
      + numField(path + "/priority", "Priority", c.priority, D.CAST_DEFAULTS.priority, { min: 0, max: 9 })
      + numField(path + "/range", "Range", c.range, D.CAST_DEFAULTS.range, { min: 1 })
      + numField(path + "/castTime", "Cast time castTime", c.castTime, D.CAST_DEFAULTS.castTime)
      + numField(path + "/checkInterval", "Check interval checkInterval", c.checkInterval, D.CAST_DEFAULTS.checkInterval, { min: 1, max: 200 })
      + numField(path + "/chance", "Chance", c.chance, D.CAST_DEFAULTS.chance, { min: 0, max: 1, step: 0.05 })
      + textField(path + "/cooldownGroup", "Cooldown group cooldownGroup", c.cooldownGroup, "Optional, e.g. blaze_breath")
      + triField(path + "/repeatOnCast", "Repeat while active repeatOnCast", c.repeatOnCast, "Repeat", "Cast once", "Default (repeat)")
      + triField(path + "/interruptOnDamage", "Interrupt on damage", c.interruptOnDamage, "Interrupts", "Does not interrupt", "Default (does not interrupt)")
      + '</div>';
    var fold = foldKey("cast", path);
    // 施法条目默认收起：一个 Boss 写七八条法术，全展开会把整页撑爆
    var castFolded = Object.prototype.hasOwnProperty.call(state.open, fold) ? !state.open[fold] : true;
    return '<div class="cast foldable' + (castFolded ? " folded" : "") + '">'
      + '<div class="cast-top">'
      + '<label class="f spell-f"><span role="button" tabindex="0" aria-expanded="' + (castFolded ? "false" : "true") + '" data-act="fold" data-key="' + esc(fold) + "\" title=\"Click to expand / collapse this spell\">Spell <i class=\"chev\" aria-hidden=\"true\">▾</i></span>"
      + '<input type="text" list="spell-list" spellcheck="false" autocomplete="off"'
      + ' data-path="' + esc(path + "/spell") + '" data-type="text"'
      + ' value="' + attrValue(c.spell) + '" placeholder="irons_spellbooks:fireball"></label>'
      + spellTagHtml(path, c.spell)
      + '<button class="btn mini" data-act="spell-picker" data-path="' + esc(path + "/spell") + "\" title=\"Pick a spell from the built-in list\">Choose spell</button>"
      + '<button class="icon" data-act="del" data-path="' + esc(path) + "\" title=\"Remove this spell\">×</button>"
      + '</div>'
      + '<div class="cast-body">' + body
      + targetHtml(c.target, path + "/target")
      + conditionsHtml(c.conditions, path + "/conditions", phase)
      + '</div>'
      + '</div>';
  }

  function targetHtml(target, path) {
    var t = typeof target === "string" ? { type: target } : (isObj(target) ? target : {});
    var filters = isObj(t.filters) ? t.filters : null;
    var placement = isObj(t.placement) ? t.placement : null;
    var flattened = ["entityTypes", "entityTags", "excludeTags"].filter(function (key) {
      return t[key] !== undefined;
    });
    var body = '<div class="fields">'
      + selectField(path + "/type", "Type", t.type, enumOptions(D.TARGET_TYPES, "Default ATTACK_TARGET"))
      + selectField(path + "/sort", "Sort", t.sort, enumOptions(D.TARGET_SORTS, "Default NEAREST"))
      + selectField(path + "/positionMode", "Aim positionMode", t.positionMode, enumOptions(D.POSITION_MODES, "Default RELATIVE"))
      + triField(path + "/lineOfSight", "Requires line of sight", t.lineOfSight, "Required", "Can see through walls", "Default (required)")
      + textField(path + "/relativeOffset", "Offset relativeOffset", vecText(t.relativeOffset), "0, 1, 0", null, { type: "vec3", wide: true })
      + '</div>'
      + "<p class=\"hint\">positionMode only decides where the spell looks; the cast always starts from the caster itself.</p>"
      + (flattened.length
        ? '<p class="note warn">' + esc(flattened.join(" / ")) + " on the target object is ignored; the parser only reads filters.</p>"
        : "")
      + "<div class=\"group-title\">Filters</div>"
      + '<div class="fields">'
      + textField(path + "/filters/entityTypes", "entityTypes (any match)", csvText(filters && filters.entityTypes), "minecraft:player", null, { type: "csvarr", wide: true })
      + textField(path + "/filters/entityTags", "entityTags (any match)", csvText(filters && filters.entityTags), "#minecraft:skeletons", null, { type: "csvarr", wide: true })
      + textField(path + "/filters/excludeTags", "excludeTags (match excludes)", csvText(filters && filters.excludeTags), "boss_allies", null, { type: "csv", wide: true })
      + numField(path + "/filters/minHealthPercent", "Target health ≥", filters && filters.minHealthPercent, "", { min: 0, max: 1, step: 0.05, placeholder: "Default 0" })
      + numField(path + "/filters/maxHealthPercent", "Target health ≤", filters && filters.maxHealthPercent, "", { min: 0, max: 1, step: 0.05, placeholder: "Default 1" })
      + triField(path + "/filters/excludeCasterTeam", "Exclude same team", filters && filters.excludeCasterTeam, "Exclude", "Do not exclude", "Default (do not exclude)")
      + triField(path + "/filters/ignoreCreative", "Ignore creative", filters && filters.ignoreCreative, "Ignore", "Do not ignore", "Default (ignore)")
      + triField(path + "/filters/requireNoShield", "Only targets without a shield", filters && filters.requireNoShield, "Require no shield", "Ignore shields", "Default (ignore)")
      + '</div>'
      + "<div class=\"group-title\">Placement</div>"
      + '<div class="fields">'
      + triField(path + "/placement/avoidFluid", "Avoid fluid avoidFluid", placement && placement.avoidFluid, "Avoid", "Do not care", "Default (ignore)")
      + triField(path + "/placement/avoidLava", "Avoid lava avoidLava", placement && placement.avoidLava, "Avoid", "Do not care", "Default (ignore)")
      + '</div>';
    return detailsOpen(path, "Target", t.type || "", false) + body + '</div></details>';
  }

  function conditionsHtml(conditions, path, phase) {
    var c = isObj(conditions) ? conditions : {};
    var self = isObj(c.self) ? c.self : {};
    var world = isObj(c.world) ? c.world : {};
    var fallbackMax = c.target && isObj(c.target) ? c.target.maxTargetDistance : undefined;
    var fallbackMin = c.target && isObj(c.target) ? c.target.minTargetDistance : undefined;
    var hasWorld = Object.keys(world).length > 0;
    var condBelow = c.healthBelow !== undefined ? c.healthBelow : self.healthBelow;
    var condAbove = c.healthAbove !== undefined ? c.healthAbove : self.healthAbove;
    // 变体的血量区间已经由 select 决定，施法条件里不再重复设置；
    // 旧版写过的话保留原值，只提示可以删掉。
    var hiddenHealth = !!phase && (
      c.healthBelow !== undefined || c.healthAbove !== undefined ||
      self.healthBelow !== undefined || self.healthAbove !== undefined
    );
    var body = (phase
      ? '<p class="hint">' + esc(phase.text) + ". The health range comes from the variant's select; healthBelow / healthAbove are no longer offered here. The fields below only add distance, environment and world restrictions.</p>"
      : "") + '<div class="fields">'
      + (phase ? "" : numField(path + "/healthBelow", "Own health ≤ healthBelow (absolute)", condBelow, "", { min: 0, max: 1, step: 0.05, placeholder: "Default 1 (always true)" })
        + numField(path + "/healthAbove", "Own health ≥ healthAbove (absolute)", condAbove, "", { min: 0, max: 1, step: 0.05, placeholder: "Default 0 (always true)" }))
      + numField(path + "/minTargetDistance", "Minimum distance", c.minTargetDistance !== undefined ? c.minTargetDistance : fallbackMin, "", { min: 0, step: 0.5, placeholder: "Default 0" })
      + numField(path + "/maxTargetDistance", "Maximum distance", c.maxTargetDistance !== undefined ? c.maxTargetDistance : fallbackMax, "", { min: 0, step: 1, placeholder: "Default: no limit" })
      + '</div>'
      + (hiddenHealth
        ? "<p class=\"note warn\">This variant's spells still contain legacy health conditions (healthBelow / healthAbove). The controls are hidden, but the values are kept in the export. Remove them if you do not need them."
          + '<button class="btn ghost mini" data-act="drop-conditions-health" data-path="' + esc(path) + "\">Remove these two</button></p>"
        : "")
      + "<div class=\"group-title\">Self</div>"
      + '<div class="fields">'
      + triField(path + "/self/onFire", "On fire onFire", self.onFire, "Require on fire", "Require not on fire", "Any")
      + triField(path + "/self/inWater", "In water inWater", self.inWater, "Require in water", "Require not in water", "Any")
      + triField(path + "/self/inLava", "In lava inLava", self.inLava, "Require", "Do not require", "Any")
      + triField(path + "/self/frozen", "Frozen", self.frozen, "Require frozen", "Require not frozen", "Any")
      + '</div>'
      + "<div class=\"group-title\">World" + (hasWorld ? " · set" : "") + '</div>'
      + '<div class="fields">'
      + textField(path + "/world/time", "time (multiple allowed)", csvText(world.time !== undefined ? world.time : world.timeOfDay), "night, dusk", null, { type: "csv" })
      + textField(path + "/world/weather", "weather", csvText(world.weather), "rain, thunder", null, { type: "csv" })
      + textField(path + "/world/moonPhase", "moonPhase 0..7", csvText(world.moonPhase), "0 (full moon)", null, { type: "intcsv" })
      + textField(path + "/world/dimension", "dimension", csvText(world.dimension), "minecraft:the_nether", null, { type: "csv", wide: true })
      + textField(path + "/world/difficulty", "difficulty", csvText(world.difficulty), "normal, hard", null, { type: "csv" })
      + numField(path + "/world/minDay", "Minimum days minDay", world.minDay, "", { min: 0, placeholder: "Default 0" })
      + '</div>'
      + "<p class=\"note\">An unknown key inside world is a hard error and drops the whole spell. Dimensions without sky light (the Nether, the End) never match time.</p>";
    var condBadge = phase ? phase.text : (hasWorld ? "world" : "");
    return detailsOpen(path, "Conditions", condBadge, false) + body + '</div></details>';
  }

  function phaseHtml(phase, path) {
    if (!isObj(phase)) {
      return '<div class="phase-empty"><button class="btn ghost" data-act="set-node" data-path="' + esc(path) + "\" data-template=\"phase\">+ Add phase effect onPhase</button></div>";
    }
    var p = phase;
    var shake = isObj(p.shake) ? p.shake : {};
    var burst = isObj(p.burst) ? p.burst : {};
    var summon = isObj(p.summon) ? p.summon : null;
    var body = '<div class="fields">'
      + textField(path + "/title", "Title (%s = name)", p.title, "%s goes berserk", null, { wide: true })
      + textField(path + "/subtitle", "Subtitle", p.subtitle, "Phase 2", null, { wide: true })
      + textField(path + "/sound", "Sound", p.sound, "minecraft:entity.wither.spawn", null, { wide: true })
      + textField(path + "/bossBarName", "Boss bar title bossBarName", p.bossBarName, "Optional")
      + selectField(path + "/bossBarColor", "Boss bar color", p.bossBarColor, enumOptions(D.BOSSBAR_COLORS.map(function (c) { return { id: c, zh: c }; }), "Leave unchanged"))
      + selectField(path + "/weather", "Weather", p.weather, enumOptions(D.PHASE_WEATHERS, "Leave unchanged"))
      + selectField(path + "/time", "Time", p.time, enumOptions(D.PHASE_TIMES, "Leave unchanged"))
      + numField(path + "/knockback", "Knockback", p.knockback, "", { min: 0, max: 16, step: 0.1, placeholder: "Default 0" })
      + numField(path + "/invulnerableTicks", "Invulnerable ticks", p.invulnerableTicks, 40, { min: 0, max: 1200 })
      + numField(path + "/freezeTicks", "Freeze ticks", p.freezeTicks, "", { min: 0, max: 1200, placeholder: "-1 = follow invulnerable ticks" })
      + numField(path + "/phaseTicks", "Phase duration phaseTicks", p.phaseTicks, 40, { min: 10, max: 1200 })
      + triField(path + "/replay", "Allow replay", p.replay, "Allow", "Cast once", "Default (play once)")
      + '</div>'
      + "<div class=\"group-title\">Shake</div>"
      + '<div class="fields">'
      + numField(path + "/shake/duration", "Duration", shake.duration, 15, { min: 1, max: 200 })
      + numField(path + "/shake/radius", "Radius", shake.radius, 16, { min: 1, max: 64, step: 0.5 })
      + '</div>'
      + "<div class=\"group-title\">Burst</div>"
      + '<div class="fields">'
      + numField(path + "/burst/radius", "Radius", burst.radius, 4, { min: 1, max: 16, step: 0.5 })
      + textField(path + "/burst/color", "Color", burst.color !== undefined ? burst.color : burst.colour, "#ff8800 or auto")
      + '</div>'
      + "<div class=\"group-title\">Summon</div>"
      + (summon
        ? '<div class="fields">'
          + textField(path + "/summon/entity", "Entity", summon.entity, "minecraft:zombie", "entity-id-list", { wide: true })
          + numField(path + "/summon/count", "Count", summon.count, 2, { min: 1, max: 16 })
          + numField(path + "/summon/radius", "Radius", summon.radius, 3, { min: 1, max: 16, step: 0.5 })
          + textField(path + "/summon/tags", "tags", csvText(summon.tags), "boss_minion", null, { type: "csvarr", wide: true })
          + '</div>'
          + '<button class="btn ghost" data-act="del" data-path="' + esc(path + "/summon") + "\">Remove summon</button>"
        : '<button class="btn ghost" data-act="set-node" data-path="' + esc(path + "/summon") + "\" data-template=\"summon\">+ Add summon</button>");
    // %s 是运行时替换成生物名字的占位符，折叠标题里直接显示会很难看
    var badge = p.title == null ? "" : String(p.title).replace(/%s/g, "[name]");
    return detailsOpen(path, "Phase effect onPhase", badge, true) + body + '</div></details>';
  }

  function dropEntryHtml(entry, path) {
    var e = isObj(entry) ? entry : {};
    return '<div class="drop">'
      + '<div class="fields">'
      + textField(path + "/item", "Item", e.item, "minecraft:emerald", null, { wide: true })
      + textField(path + "/lootTable", "Loot table lootTable", e.lootTable, "minecraft:entities/zombie", null, { wide: true })
      + numField(path + "/count", "Fixed count", e.count, "", { min: 1, placeholder: "Use min/max below" })
      + numField(path + "/min", "Minimum min", e.min, 1, { min: 1 })
      + numField(path + "/max", "Maximum max", e.max, "", { min: 1, placeholder: "Default = min" })
      + numField(path + "/chance", "Chance", e.chance, 1, { min: 0, max: 1, step: 0.05 })
      + triField(path + "/looting", "Looting bonus", e.looting, "Use Looting", "Ignore Looting", "Not set = ignores Looting")
      + triField(path + "/requirePlayerKill", "Require player kill", e.requirePlayerKill, "Player kills only", "Any death", "Not set = player kills only")
      + '</div>'
      + '<button class="icon" data-act="del" data-path="' + esc(path) + "\" title=\"Remove this drop\">×</button>"
      + "<p class=\"hint\">Set either item or lootTable. If both or neither are set, the drop is discarded.</p>"
      + '</div>';
  }

  function dropRuleHtml(rule, path, inVariant) {
    var r = isObj(rule) ? rule : {};
    var drops = isArr(r.drops) ? r.drops : [];
    var body = (inVariant
      ? "<p class=\"note\">The variant has already matched the mob; rules here do not need select.</p>"
      : selectorHtml(r.select, path + "/select", "Mob select (empty = any mob)"))
      + '<div class="fields">' + numField(path + "/chance", "Rule chance", r.chance, 1, { min: 0, max: 1, step: 0.05 }) + '</div>'
      + '<div class="group-title">drops</div>'
      + (drops.length ? drops.map(function (entry, index) { return dropEntryHtml(entry, path + "/drops/" + index); }).join("") : "")
      + '<button class="btn ghost" data-act="add-drop" data-path="' + esc(path + "/drops") + "\">+ Add a drop</button>";
    var expected = drops.reduce(function (sum, entry) {
      var one = CORE.dropExpectation(entry);
      return sum + (one ? one.expected : 0);
    }, 0);
    var ruleChance = CORE.isNum(r.chance) ? Math.max(0, Math.min(1, r.chance)) : 1;
    return "<div class=\"rule\"><div class=\"rule-head\"><span>Drop rule</span>"
      + "<span class=\"chip\" title=\"Estimated by chance, excluding Looting\">Expected " + (Math.round(expected * ruleChance * 100) / 100) + " items</span>"
      + '<button class="icon" data-act="del" data-path="' + esc(path) + "\" title=\"Remove this rule\">×</button></div>"
      + body + '</div>';
  }

  function selectorHtml(selector, path, title) {
    var s = isObj(selector) ? selector : {};
    return '<div class="selector">'
      + '<div class="group-title">' + esc(title || "Selection select") + '</div>'
      + '<div class="fields">'
      + textField(path + "/name", "Name", s.name, "Exact match")
      + textField(path + "/nameRegex", "Regex nameRegex", s.nameRegex, "^Boss")
      + textField(path + "/tags", "Tags", csvText(s.tags), "boss, phase2", null, { type: "csvarr", wide: true })
      + numField(path + "/healthBelow", "Health ≤ healthBelow", s.healthBelow, "", { min: 0, max: 1, step: 0.05, placeholder: "e.g. 0.5" })
      + numField(path + "/healthAbove", "Health ≥ healthAbove", s.healthAbove, "", { min: 0, max: 1, step: 0.05, placeholder: "e.g. 0.1" })
      + triField(path + "/tamed", "Tamed", s.tamed, "Tamed only", "Untamed only", "Any")
      + '</div>'
      + "<p class=\"hint\">Set at least one of name / nameRegex / tags / healthBelow / healthAbove / tamed; otherwise this variant is discarded.</p>"
      + '</div>';
  }

  /** 0.34 → 34%，0.675 → 67.5%，只用于显示。 */
  function percentText(value) {
    if (typeof value !== "number" || !isFinite(value)) return String(value);
    var percent = Math.round(value * 1000) / 10;
    return percent + "%";
  }

  /**
   * 变体分两类：用 tags / 名字 / 驯服状态区分的是「个体」，用血量区分的是同一个体
   * 的不同「阶段」。同一组（标识条件完全相同）里越靠前越深，所以阶段号从组尾往前数。
   * 一个条件都没有的变体会被解析器整条丢掉，标成「缺条件」而不是假装它是一段。
   */
  var EMPTY_SELECT_KEY = JSON.stringify([null, null, [], null]);

  function selectIdentityKey(selector) {
    return CORE.selectIdentityKey(selector);
  }

  function hasHealthSelector(selector) {
    if (!isObj(selector)) return false;
    var below = typeof selector.healthBelow === "number" && isFinite(selector.healthBelow);
    var above = typeof selector.healthAbove === "number" && isFinite(selector.healthAbove);
    return below || above;
  }

  /**
   * 每条变体在它自己那组里的位置。total 只数「同组里带血量条件的条数」，
   * pos 是它在这几条里从深到浅的序号（0 最深）。没有血量的条目不参与编号。
   */
  function variantGroupInfo(list) {
    var keys = list.map(function (variant) {
      return selectIdentityKey(isObj(variant) ? variant.select : null);
    });
    var health = list.map(function (variant) {
      return hasHealthSelector(isObj(variant) ? variant.select : null);
    });
    var totals = {};
    keys.forEach(function (key, index) {
      if (health[index]) totals[key] = (totals[key] || 0) + 1;
    });
    var seen = {};
    return keys.map(function (key, index) {
      if (!health[index]) {
        return { key: key, total: totals[key] || 0, pos: -1, hasHealth: false };
      }
      seen[key] = (seen[key] || 0) + 1;
      return { key: key, total: totals[key], pos: seen[key] - 1, hasHealth: true };
    });
  }

  function phaseLabel(list, index) {
    var variant = list[index];
    var select = isObj(variant) && isObj(variant.select) ? variant.select : {};
    var info = variantGroupInfo(list)[index];
    if (!info.hasHealth) return info.key === EMPTY_SELECT_KEY ? "Missing condition" : "Identity variant";
    var phase = "Phase " + (info.total - info.pos) + "";
    return info.key === EMPTY_SELECT_KEY ? phase : "Individual · " + phase;
  }

  function variantHtml(variant, path, index, list) {
    var v = isObj(variant) ? variant : {};
    var phaseInfo = phaseContext(v.select);
    var label = phaseLabel(list, index);
    var isIdentity = selectIdentityKey(v.select) !== EMPTY_SELECT_KEY;
    var fold = foldKey("variant", path);
    var folded = isFolded(fold);
    var variantDrops = isArr(v.dropRules) ? v.dropRules : [];
    // 掉落只在死亡时结算。阶段变体（按血量划分）放在这里会让人以为掉到这段血就掉东西，
    // 所以干脆不提供编辑器；旧工程里已有的数据仍然会导出，只给一条提示和删除按钮。
    var variantDropSection = "";
    if (phaseInfo) {
      if (variantDrops.length) {
        variantDropSection = "<div class=\"group-title\">Legacy phase-variant drop rules (editor hidden)</div>"
          + "<div class=\"note warn\">This variant still has " + variantDrops.length + " legacy drop rules. They are rolled only at death (0% health), if this variant is active at that moment — not when health reaches this phase. They stay in the export unless removed.</div>"
          + '<button class="btn ghost" data-act="drop-variant-drops" data-path="' + esc(path) + "\">Remove these " + variantDrops.length + " variant drops</button>";
      }
    } else {
      variantDropSection = "<div class=\"group-title\">This variant's drops</div>"
        + "<p class=\"hint\">Rolled only when the mob dies; the variant has already matched, so select is not needed.</p>"
        + variantDrops.map(function (rule, i) { return dropRuleHtml(rule, path + "/dropRules/" + i, true); }).join("")
        + '<button class="btn ghost" data-act="add-drop-rule" data-path="' + esc(path + "/dropRules") + "\">+ Add a variant drop</button>";
    }
    var body = selectorHtml(v.select, path + "/select")
      + '<div class="fields">'
      + triField(path + "/override", "Override root", v.override, "Override", "Merge (goals are appended)", "Default (override)")
      + triField(path + "/sticky", "Lock phase sticky", v.sticky, "Lock phase", "Can fall back", "Default (no lock)")
      + triField(path + "/bossBar", "Boss bar bossBar", v.bossBar, "Force on", "Force off", "Follow parent")
      + triField(path + "/learner", "Learn scroll spells learner", v.learner, "Allow", "Not allowed", "Default (not allowed)")
      + triField(path + "/adaptive", "Learn player spells adaptive", v.adaptive, "Allow", "Not allowed", "Default (not allowed)")
      + triField(path + "/disableAttackGoals", "Vanilla attacks disableAttackGoals", v.disableAttackGoals, "Disable", "Do not disable", "Follow parent")
      + '</div>'
      + phaseHtml(v.onPhase, path + "/onPhase")
      + "<div class=\"group-title\">This variant's active spells</div>"
      + (phaseInfo
        ? "<p class=\"hint\">The health range comes from select (" + esc(phaseInfo.text) + "); the conditions on each spell below only add distance, environment or world limits, not another health check.</p>"
        : "")
      + castListHtml(v.goals, path + "/goals", undefined, phaseInfo)
      + triggersHtml(v, path, phaseInfo)
      + variantDropSection;
    return '<div class="variant foldable' + (folded ? ' folded' : '') + '" id="var-' + index + '" data-vindex="' + index + '">'
      + '<div class="variant-head">'
      + '<span class="variant-toggle" role="button" tabindex="0" aria-expanded="' + (folded ? "false" : "true") + '"'
      + ' data-act="fold" data-key="' + esc(fold) + "\" title=\"Click to collapse / expand this variant\">"
      + '<i class="chev" aria-hidden="true">▾</i>'
      + '<span class="idx">#' + index + '</span>'
      + '<span class="phase-tag' + (isIdentity ? " identity" : "") + '">' + esc(label) + '</span>'
      + '<span class="vtags">' + esc(selectorSummary(v.select)) + '</span>'
      + '</span>'
      + '<span class="spacer"></span>'
      + (index > 0 ? '<button class="icon" data-act="variant-up" data-path="' + esc(path) + "\" title=\"Move up (earlier, higher priority)\">↑</button>" : '')
      + (index < list.length - 1 ? '<button class="icon" data-act="variant-down" data-path="' + esc(path) + "\" title=\"Move down (lower priority)\">↓</button>" : '')
      + '<button class="icon" data-act="dup" data-path="' + esc(path) + "\" title=\"Duplicate this variant\">⧉</button>"
      + '<button class="icon" data-act="del" data-path="' + esc(path) + "\" title=\"Remove this variant\">×</button>"
      + '</div><div class="variant-body">' + body + '</div></div>';
  }

  function selectorSummary(selector) {
    if (!isObj(selector)) return "No selection conditions yet";
    var parts = [];
    if (selector.name != null) parts.push("name=" + selector.name);
    if (selector.nameRegex != null) parts.push("/" + selector.nameRegex + "/");
    if (selector.healthBelow != null) parts.push("hp ≤ " + percentText(selector.healthBelow));
    if (selector.healthAbove != null) parts.push("hp > " + percentText(selector.healthAbove));
    if (isArr(selector.tags)) parts.push("tags=" + selector.tags.join("+"));
    if (selector.tamed != null) parts.push("tamed=" + selector.tamed);
    return parts.length ? parts.join(" · ") : "Selection is empty";
  }

  function triggersHtml(node, base, phase) {
    var html = TRIGGERS.map(function (trigger) {
      var path = base + "/" + trigger.key;
      var head = '<div class="trig-head"><b>' + esc(trigger.label) + '</b><span class="hint">' + esc(trigger.hint) + '</span></div>';
      if (isObj(node[trigger.key])) {
        return '<div class="trig">' + head + castHtml(node[trigger.key], path, phase) + '</div>';
      }
      return '<div class="trig empty"><div class="trig-head"><b>' + esc(trigger.label) + '</b><span class="hint">' + esc(trigger.hint) + '</span></div>'
        + '<button class="btn ghost" data-act="set-trigger" data-path="' + esc(path) + "\">+ Add</button></div>";
    }).join("");
    return "<div class=\"group-title\">Triggers (single objects; a variant that omits one falls back to the root)</div><div class=\"triggers\">" + html + '</div>';
  }

  function renderEditor() {
    var host = $("#editor");
    var id = state.selected;
    if (!id || !state.project.entities[id]) {
      host.innerHTML = "<div class=\"empty-editor\"><h2>No entity selected</h2>"
        + "<p>Click \"New\" in the top-left corner to create a blank entity, or pick one of the templates.</p></div>";
      return;
    }
    var rules = state.project.entities[id];
    var base = "entities/" + id;
    var hasVariants = isArr(rules.variants) && rules.variants.length > 0;
    var rootBar = typeof rules.bossBar === "boolean" ? rules.bossBar : null;
    host.innerHTML = entityHead(id, base)
      + sectionNav(hasVariants ? "bossbar" : "")
      // 有变体时血条由每条变体自己决定，根层这张卡会误导（它其实只是变体的默认值）
      + (hasVariants ? "" : card("bossbar", "Boss bar bossBar", "Not set = follow the presentation config", '<div class="fields">'
        + triField(base + "/bossBar", "bossBar", rules.bossBar, "Force on", "Force off", "Follow config")
        + '</div>'))
      + card("behavior", "Behavior", "Default false: keep vanilla melee / ranged attack goals", '<div class="fields">'
        + triField(base + "/disableAttackGoals", "Vanilla attacks disableAttackGoals", rules.disableAttackGoals, "Disable", "Keep", "Default (keep)")
        + "</div><p class=\"hint\">true removes only the vanilla melee / ranged attack goals (including zombie and drowned subclasses); target selection and this mod's spells stay. Variants can override it individually.</p>")
      + card("goals", "Active spells", "A goal selector picks one spell by priority and cooldown", castListHtml(rules.goals, base + "/goals"))
      + card("triggers", "Triggers", "onHurt / onTarget / onDeath / onKill are single objects", triggersHtml(rules, base))
      + card("drops", "Drops", "Rolled on death; every rule whose select matches is rolled, not just one", (function () {
        var path = base + "/dropRules";
        var list = isArr(rules.dropRules) ? rules.dropRules : [];
        var phaseCount = isArr(rules.variants) ? rules.variants.filter(function (variant) {
          return isObj(variant) && hasHealthSelector(variant.select);
        }).length : 0;
        return (phaseCount ? "<p class=\"hint\">This mob has " + phaseCount + " health-based phase variants, so drop editing is hidden: drops are rolled only at death, and putting them on a phase makes it look like they drop at that health threshold. If a phase really needs extra death drops, export and edit variants[i].dropRules in the JSON.</p>" : '')
          + (list.length ? list.map(function (rule, index) { return dropRuleHtml(rule, path + "/" + index, false); }).join("") : "")
          + '<button class="btn ghost" data-act="add-drop-rule" data-path="' + esc(path) + "\">+ Add a rule</button>";
      })())
      + card("variants", "Variants", "Top to bottom is match priority; the first match wins", (function () {
        var path = base + "/variants";
        var list = isArr(rules.variants) ? rules.variants : [];
        return (list.length
          ? "<div class=\"variant-tools\"><span class=\"hint\">Click a title to collapse a variant. Within one group (same tags / name / tamed condition), the earlier entry is the deeper phase.</span>"
            + '<button class="btn ghost mini" data-act="variants-expand" data-path="' + esc(path) + "\">Expand all</button>"
            + '<button class="btn ghost mini" data-act="variants-collapse" data-path="' + esc(path) + "\">Collapse all</button></div>"
            + (rootBar == null ? "" : "<p class=\"hint\">The root bossBar is set to &quot;" + (rootBar ? "On" : "Off") + "&quot;; variants left on &quot;Follow parent&quot; fall back to it.</p>")
            + list.map(function (variant, index) { return variantHtml(variant, path + "/" + index, index, list); }).join("")
          : "<p class=\"hint\">No variants yet. Variants match in order and the first match wins; when one mob has several phases, write the deepest phase first.</p>")
          + (list.length > 1 ? "<button class=\"btn ghost\" data-act=\"sort-variants\">Sort each group by health</button>" : "")
          + '<button class="btn ghost" data-act="add-variant" data-path="' + esc(path) + "\">+ Add variant</button>";
      })());
  }

/* ------------------------------------------- v2：撤销重做 / 自动保存 */

  var historyState = { stack: [], pos: -1, limit: 80, applying: false };
  var saveTimer = 0;
  // 自检页会用 window.SMGEN_STORAGE_KEY 换成另一个键，免得跑测试覆盖掉真正在用的工程
  var STORAGE_KEY = root.SMGEN_STORAGE_KEY || "spellmob-generator.v2";

  function projectSnapshot() {
    return JSON.stringify({ project: state.project, selected: state.selected });
  }

  /** 每次渲染后记一笔：快照变了才入栈，所以拖动输入框不会灌满历史。 */
  function historyRecord() {
    if (historyState.applying) return;
    var snapshot = projectSnapshot();
    if (historyState.pos >= 0 && historyState.stack[historyState.pos] === snapshot) return;
    historyState.stack = historyState.stack.slice(0, historyState.pos + 1);
    historyState.stack.push(snapshot);
    if (historyState.stack.length > historyState.limit) historyState.stack.shift();
    historyState.pos = historyState.stack.length - 1;
    renderHistoryButtons();
  }

  function historyApply(target) {
    var entry = historyState.stack[target];
    if (!entry) return;
    var data = JSON.parse(entry);
    historyState.applying = true;
    state.project = data.project;
    state.selected = data.selected;
    state.open = {};
    renderAll();
    historyState.applying = false;
    historyState.pos = target;
    renderHistoryButtons();
  }

  function undo() {
    if (historyState.pos > 0) historyApply(historyState.pos - 1);
  }

  function redo() {
    if (historyState.pos < historyState.stack.length - 1) historyApply(historyState.pos + 1);
  }

  function renderHistoryButtons() {
    var undoBtn = $("#undo-btn");
    var redoBtn = $("#redo-btn");
    if (undoBtn) undoBtn.disabled = historyState.pos <= 0;
    if (redoBtn) redoBtn.disabled = historyState.pos >= historyState.stack.length - 1;
  }

  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
          savedAt: Date.now(),
          project: state.project,
          selected: state.selected
        }));
      } catch (error) {
        // 隐私模式或配额满了：自动保存静默失效，其它功能不受影响
      }
    }, 700);
  }

  function restoreAutosave() {
    var raw = null;
    try { raw = window.localStorage.getItem(STORAGE_KEY); } catch (error) { return false; }
    if (!raw) return false;
    var data = null;
    try { data = JSON.parse(raw); } catch (error) { return false; }
    if (!data || !isObj(data.project) || !isObj(data.project.entities)) return false;
    var ids = Object.keys(data.project.entities);
    if (!ids.length) return false;
    var normalized = CORE.normalizeProject(data.project);
    state.project = normalized.project;
    var fallback = Object.keys(state.project.entities)[0] || null;
    state.selected = data.selected && state.project.entities[data.selected] ? data.selected : fallback;
    toast("Restored unsaved edits (" + new Date(data.savedAt).toLocaleString() + ")");
    return true;
  }

  /* --------------------------------------------------- v2：法术选择器 */

  var pendingSpellPath = null;

  /** 给 <input list> 用的法术 id 候选；比 115 项原生 select 好搜。 */
  function spellDatalist() {
    return '<datalist id="spell-ids">'
      + (D.SPELLS || []).map(function (entry) {
        return '<option value="' + esc(entry.id) + '">' + esc(entry.zh) + '</option>';
      }).join("")
      + '</datalist>';
  }

  function pickerRows(query) {
    var q = String(query || "").trim().toLowerCase();
    var list = D.SPELLS || [];
    var rows = list.filter(function (entry) {
      if (!q) return true;
      return (entry.id + " " + entry.en + " " + entry.zh).toLowerCase().indexOf(q) >= 0;
    });
    return rows.slice(0, 200);
  }

  function renderPicker(query) {
    var host = $("#picker-list");
    if (!host) return;
    var rows = pickerRows(query);
    if (!rows.length) {
      host.innerHTML = "<p class=\"empty\">No matching spells. You can also type an id directly in the input above.</p>";
      return;
    }
    host.innerHTML = rows.map(function (entry) {
      var color = CORE.schoolColor(entry.school);
      var type = entry.castType && D.CAST_TYPES[entry.castType] ? D.CAST_TYPES[entry.castType] : null;
      var typeLabel = type && typeof type === "object" ? type.zh : type;
      return '<button class="pick" data-act="pick-spell" data-spell="' + esc(entry.id) + '">'
        + '<span class="school-dot" style="background:' + esc(color) + '"></span>'
        + '<span class="pick-zh">' + esc(entry.zh) + '</span>'
        
        + '<span class="pick-id">' + esc(entry.id.replace("irons_spellbooks:", "")) + '</span>'
        + (typeLabel ? '<span class="chip">' + esc(typeLabel) + '</span>' : "")
        + '</button>';
    }).join("");
  }

  function spellPickerDialog(path) {
    pendingSpellPath = path;
    openModal("Choose spell · " + (D.SPELLS || []).length + " built-in",
      '<div class="picker-box">'
      + "<input id=\"picker-q\" class=\"picker-input\" placeholder=\"Search name / id; Enter picks the first result\" spellcheck=\"false\" autocomplete=\"off\">"
      + '<div class="picker" id="picker-list"></div>'
      + '</div>'
      + "<p class=\"hint\">The list comes from the irons_spellbooks 1.20.1-3.16.3 language files. It is for display and search only, not registry validation. For spells from other mods, type the id directly in the editor.</p>");
    renderPicker("");
    var input = $("#picker-q");
    if (!input) return;
    input.focus();
    input.addEventListener("input", function () { renderPicker(this.value); });
    input.addEventListener("keydown", function (event) {
      if (event.key !== "Enter") return;
      event.preventDefault();
      var first = document.querySelector("#picker-list .pick");
      if (first) pickSpell(first.getAttribute("data-spell"));
    });
  }

  function pickSpell(id) {
    if (!pendingSpellPath || !id) return;
    setNode(pendingSpellPath, id);
    closeModal();
    renderAll();
    toast("Spell set to " + id);
  }

  /* -------------------------------------------------------- v2：统计 */

  /** 把若干 { id, rules } 汇总成一份统计；整包视图和「当前实体」视图共用。 */
  /** 一条 cast 收进清单：按首次出现的顺序去重，带上学派颜色、施法类型和出现次数。 */
  function spellCollect(list, cast) {
    if (!isObj(cast) || !cast.spell) return;
    var id = String(cast.spell);
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) { list[i].count++; return; }
    }
    var info = spellInfo(id);
    list.push({
      id: id,
      zh: info ? info.zh : "",
      en: info ? info.en : "",
      school: info && info.school ? info.school : "",
      color: info && info.school ? CORE.schoolColor(info.school) : "",
      type: info ? info.castType : "",
      known: !!info,
      count: 1
    });
  }

  /** 一个节点（根层规则或一条变体）自己写了哪些法术，主动 + 触发合并。 */
  function spellBreakdown(node) {
    var list = [];
    eachCast(node, function (cast) { spellCollect(list, cast); });
    return list;
  }

  /** 分开的主动 / 触发两组：goals 与 onHurt / onTarget / onDeath / onKill。 */
  function spellGroups(node) {
    var groups = { goals: [], triggers: [] };
    if (!isObj(node)) return groups;
    if (isArr(node.goals)) {
      node.goals.forEach(function (cast) { spellCollect(groups.goals, cast); });
    }
    CORE.TRIGGERS.forEach(function (trigger) {
      if (isObj(node[trigger.key])) spellCollect(groups.triggers, node[trigger.key]);
    });
    return groups;
  }

  /** 一组法术按学派归并（按施法条数计），给变体行那几个彩色小标签用。 */
  function schoolChipsOf(list) {
    var map = {};
    (list || []).forEach(function (spell) {
      if (!spell.school) return;
      map[spell.school] = (map[spell.school] || 0) + spell.count;
    });
    return Object.keys(map).sort(function (a, b) {
      return map[b] - map[a];
    }).map(function (school) {
      return { school: school, count: map[school], color: CORE.schoolColor(school) };
    });
  }

  function schoolChipsHtml(list) {
    if (!list || !list.length) return "";
    return '<span class="var-schools">' + list.map(function (item) {
      var label = (D.SCHOOL_LABELS || {})[item.school] || item.school;
      return '<span class="chip school-chip"><i style="background:' + esc(item.color) + '"></i>'
        + esc(label) + " · " + item.count + '</span>';
    }).join("") + '</span>';
  }

  /** 统计里的一段法术清单：学派色点 + 名字 + 施法类型 + 重复次数 + 去掉命名空间的 id。 */
  function spellRowsHtml(list, emptyText) {
    if (!list || !list.length) return '<p class="hint var-empty">' + esc(emptyText) + '</p>';
    return '<ul class="var-spells">' + list.map(function (spell) {
      var color = spell.color || "";
      var name = spell.known
        ? (spell.zh !== spell.en ? spell.zh + " · " + spell.en : spell.zh)
        : "Unknown spell " + spell.id;
      var typeRaw = spell.type && D.CAST_TYPES[spell.type] !== undefined ? D.CAST_TYPES[spell.type] : null;
      var typeLabel = typeRaw && typeof typeRaw === "object" ? typeRaw.zh : typeRaw;
      return '<li class="var-spell">'
        + '<span class="school-dot"' + (color ? ' style="background:' + esc(color) + '"' : "") + '></span>'
        + '<span class="spell-zh' + (spell.known ? "" : " bad") + '"'
        + (color ? ' style="color:' + esc(color) + '"' : "") + '>' + esc(name) + '</span>'
        + (typeLabel ? '<span class="chip">' + esc(typeLabel) + '</span>' : "")
        + (spell.count > 1 ? '<span class="spell-count">×' + spell.count + '</span>' : "")
        + '<code class="spell-id">' + esc(String(spell.id).replace(/^[a-z0-9_.-]+:/, "")) + '</code></li>';
    }).join("") + '</ul>';
  }

  /** 主动 / 触发分组渲染：两组都有标题，只有一组时也标出来，免得看不出是被动触发的。 */
  function spellGroupsHtml(groups, emptyText) {
    var goals = (groups && groups.goals) || [];
    var triggers = (groups && groups.triggers) || [];
    if (!goals.length && !triggers.length) {
      return '<p class="hint var-empty">' + esc(emptyText) + '</p>';
    }
    var html = "";
    if (goals.length) {
      html += "<div class=\"var-group\">Active goals · " + goals.length + "</div>" + spellRowsHtml(goals);
    }
    if (triggers.length) {
      html += "<div class=\"var-group\">Triggers · " + triggers.length + "</div>" + spellRowsHtml(triggers);
    }
    return html;
  }

  function collectStats(pairs) {
    var totals = {
      entities: 0, casts: 0, goals: 0, triggers: 0, variants: 0,
      drops: 0, dropRules: 0, spellCount: 0, schools: {}, castTypes: {},
      schoolSpells: {}, unknownSpells: [], expected: 0, entityList: []
    };
    var seen = {};
    pairs.forEach(function (pair) {
      var id = pair.id;
      var rules = pair.rules;
      totals.entities++;
      var one = CORE.stats(rules, { spells: D.SPELLS });
      totals.casts += one.casts;
      totals.goals += one.goals;
      totals.triggers += one.triggers;
      totals.variants += one.variants;
      totals.drops += one.drops;
      totals.dropRules += one.dropRules;
      Object.keys(one.schools).forEach(function (school) {
        totals.schools[school] = (totals.schools[school] || 0) + one.schools[school];
      });
      Object.keys(one.castTypes).forEach(function (type) {
        totals.castTypes[type] = (totals.castTypes[type] || 0) + one.castTypes[type];
      });
      one.unknownSpells.forEach(function (spell) {
        if (totals.unknownSpells.indexOf(spell) < 0) totals.unknownSpells.push(spell);
      });
      /* 这个生物自己的明细：变体逐条展开，供「统计 → 生物与变体」查看与搜索 */
      var entInfo = entityInfo(id);
      var entSpells = [];
      eachRulesNode(rules, function (node) {
        eachCast(node, function (cast) {
          if (isObj(cast) && cast.spell && entSpells.indexOf(cast.spell) < 0) entSpells.push(cast.spell);
        });
      });
      var rootGoals = isArr(rules.goals) ? rules.goals.length : 0;
      var rootTriggers = 0;
      CORE.TRIGGERS.forEach(function (trigger) { if (isObj(rules[trigger.key])) rootTriggers++; });
      var variantCasts = 0;
      var entSchools = Object.keys(one.schools).sort(function (a, b) {
        return one.schools[b] - one.schools[a];
      }).map(function (school) {
        return { school: school, count: one.schools[school], color: CORE.schoolColor(school) };
      });
      var variantList = [];
      if (isArr(rules.variants)) {
        rules.variants.forEach(function (variant, index) {
          if (!isObj(variant)) return;
          var item = {
            index: index, goals: 0, triggers: 0, casts: 0, dropRules: 0, drops: 0,
            hasPhase: isObj(variant.onPhase), sticky: variant.sticky === true,
            override: variant.override !== false, learner: variant.learner === true,
            adaptive: variant.adaptive === true, select: variant.select,
            spells: [], spellList: [], spellGroups: { goals: [], triggers: [] }
          };
          if (isArr(variant.goals)) item.goals = variant.goals.length;
          CORE.TRIGGERS.forEach(function (trigger) { if (isObj(variant[trigger.key])) item.triggers++; });
          item.casts = item.goals + item.triggers;
          if (isArr(variant.dropRules)) {
            item.dropRules = variant.dropRules.length;
            variant.dropRules.forEach(function (rule) {
              if (isObj(rule) && isArr(rule.drops)) item.drops += rule.drops.length;
            });
          }
          item.spellList = spellBreakdown(variant);
          item.spellGroups = spellGroups(variant);
          item.spells = item.spellList.map(function (spell) { return spell.id; });
          variantList.push(item);
          variantCasts += item.casts;
        });
      }
      /* 每个学派下面具体是哪些法术（去重），供「统计」里点开查看 */
      eachRulesNode(rules, function (node) {
        eachCast(node, function (cast) {
          if (!isObj(cast) || !cast.spell) return;
          var info = spellInfo(cast.spell);
          if (!info || !info.school) return;
          var bucket = totals.schoolSpells[info.school];
          if (!bucket) bucket = totals.schoolSpells[info.school] = [];
          for (var i = 0; i < bucket.length; i++) {
            if (bucket[i].id === cast.spell) { bucket[i].count++; return; }
          }
          bucket.push({ id: cast.spell, zh: info.zh, en: info.en, type: info.castType, count: 1 });
        });
      });
      eachRulesNode(rules, function (node) {
        if (!isArr(node.dropRules)) return;
        node.dropRules.forEach(function (rule) {
          if (!isObj(rule) || !isArr(rule.drops)) return;
          rule.drops.forEach(function (entry) {
            var expect = CORE.dropExpectation(entry);
            if (!expect) return;
            var ruleChance = CORE.isNum(rule.chance) ? Math.max(0, Math.min(1, rule.chance)) : 1;
            totals.expected += expect.expected * ruleChance;
          });
        });
      });
      Object.keys(one.schools).forEach(function (school) { seen[school] = true; });
      totals.entityList.push({
        id: id,
        zh: entInfo ? entInfo.zh : "",
        en: entInfo ? entInfo.en : "",
        casts: one.casts, goals: one.goals, triggers: one.triggers,
        rootGoals: rootGoals, rootTriggers: rootTriggers, variantCasts: variantCasts,
        variants: one.variants, drops: one.drops, dropRules: one.dropRules,
        spells: entSpells, schools: entSchools, variantList: variantList,
        rootSpells: spellBreakdown(rules), rootGroups: spellGroups(rules)
      });
    });
    totals.spellCount = (function () {
      var ids = {};
      pairs.forEach(function (pair) {
        eachRulesNode(pair.rules, function (node) {
          eachCast(node, function (cast) { if (isObj(cast) && cast.spell) ids[cast.spell] = true; });
        });
      });
      return Object.keys(ids).length;
    })();
    Object.keys(totals.schoolSpells).forEach(function (school) {
      totals.schoolSpells[school].sort(function (a, b) {
        return b.count - a.count || String(a.en || a.zh).localeCompare(String(b.en || b.zh), "en");
      });
    });
    totals.schoolList = Object.keys(totals.schools).sort(function (a, b) {
      return totals.schools[b] - totals.schools[a];
    }).map(function (school) {
      return { school: school, count: totals.schools[school], color: CORE.schoolColor(school) };
    });
    return totals;
  }

  /** 整包统计。 */
  function packStats() {
    return collectStats(Object.keys(state.project.entities).map(function (id) {
      return { id: id, rules: state.project.entities[id] };
    }));
  }

  /** 单个实体的统计（统计页签默认看这个，跟着左边的选择走）。 */
  function entityStats(id) {
    var rules = state.project.entities[id];
    if (!rules) return null;
    return collectStats([{ id: id, rules: rules }]);
  }

  function statCard(value, label, hint) {
    return '<div class="stat-card"><b>' + esc(value) + '</b><span>' + esc(singularLabel(value, label)) + '</span>'
      + (hint ? '<small>' + esc(hint) + '</small>' : "") + '</div>';
  }

  /** 变体 select 的一行摘要。语义照 Java：fraction < healthBelow、fraction > healthAbove 才算命中。 */
  function selectSummary(select) {
    if (!isObj(select)) return "No select — the parser will discard this variant";
    var parts = [];
    if (select.name != null) parts.push("name=" + select.name);
    if (select.nameRegex != null) parts.push("regex=/" + select.nameRegex + "/");
    if (isArr(select.tags) && select.tags.length) parts.push("tags=" + select.tags.join(","));
    if (CORE.isNum(select.healthBelow)) parts.push("hp < " + select.healthBelow);
    if (CORE.isNum(select.healthAbove)) parts.push("hp > " + select.healthAbove);
    if (select.tamed === true) parts.push("Tamed");
    if (select.tamed === false) parts.push("Untamed");
    return parts.length ? parts.join(" · ") : "select has no condition that can match";
  }

  /**
   * 变体在统计里的一块：标题行（选择条件 + 这一阶段的学派分布，收起来也留着）
   * + 可以单独折叠的法术表（主动 / 触发分组）。整包与「当前实体」视图共用。
   */
  function variantRowHtml(entry, item) {
    var flags = [];
    if (item.sticky) flags.push("Lock phase");
    if (!item.override) flags.push("Does not override the root");
    if (item.hasPhase) flags.push("Phase effect");
    if (item.learner) flags.push("Scroll learning");
    if (item.adaptive) flags.push("Adaptive");
    var tags = item.select && isArr(item.select.tags) ? item.select.tags.join(" ") : "";
    var hay = [
      "Variant #" + item.index, entry.id, entry.zh, entry.en, tags,
      (item.select && item.select.name) || "",
      (item.select && item.select.nameRegex) || "",
      item.spells.join(" ")
    ].join(" ").toLowerCase();
    var meta = item.casts
      ? item.casts + plural(item.casts, " spell", " spells") + " · " + item.spells.length + plural(item.spells.length, " spell type", " spell types")
      : "No spells";
    if (item.dropRules) meta += " · Drops " + item.dropRules + plural(item.dropRules, " rule", " rules") + " / " + item.drops + plural(item.drops, " entry", " entries");
    var open = state.statsOpen["var:" + entry.id + ":" + item.index] !== false;
    return '<li class="var-stat' + (open ? "" : " folded") + '" data-search="' + esc(hay) + '"'
      + ' data-index="' + item.index + '">'
      + '<button type="button" class="var-row" data-act="stats-var-fold"'
      + ' data-entity="' + esc(entry.id) + '" data-index="' + item.index + '"'
      + ' aria-expanded="' + (open ? "true" : "false") + '"'
      + "\" title=\"Click to expand / collapse this variant's spell list\">"
      + '<span class="var-line">'
      + '<i class="chev" aria-hidden="true">▾</i>'
      + '<span class="var-idx">#' + item.index + '</span>'
      + '<span class="var-sel" title="' + esc(selectSummary(item.select)) + '">'
      + esc(selectSummary(item.select)) + '</span>'
      + '<span class="var-meta">' + esc(meta)
      + (flags.length ? ' <span class="chip">' + esc(flags.join(" / ")) + '</span>' : "")
      + '</span></span>'
      + schoolChipsHtml(schoolChipsOf(item.spellList))
      + '</button>'
      + '<div class="var-body">'
      + spellGroupsHtml(item.spellGroups, item.override
        ? "This variant defines no spells of its own and overrides the root: once matched, it casts nothing."
        : "This variant defines no spells of its own and does not override the root: it inherits the root's spells.")
      + '</div>'
      + '</li>';
  }

  /** 「统计」页签的内容：默认只看左边选中的那个生物，也可以切到整包。 */
  function statsHtml() {
    var scope = state.statsScope === "pack" ? "pack" : "entity";
    var current = null;
    var stats = null;
    if (scope === "pack") {
      stats = packStats();
    } else {
      current = state.selected && state.project.entities[state.selected]
        ? state.selected
        : (Object.keys(state.project.entities)[0] || null);
      stats = current ? entityStats(current) : null;
    }
    var scopeBar = '<div class="stats-scope">'
      + '<button type="button" class="scope-btn' + (scope === "entity" ? " on" : "") + '"'
      + ' data-act="stats-scope" data-scope="entity" aria-pressed="' + (scope === "entity" ? "true" : "false") + '"'
      + "\" title=\"Count only the mob selected on the left; follows the selection\">Current entity</button>"
      + '<button type="button" class="scope-btn' + (scope === "pack" ? " on" : "") + '"'
      + ' data-act="stats-scope" data-scope="pack" aria-pressed="' + (scope === "pack" ? "true" : "false") + '"'
      + "\" title=\"Counts for the whole project\">Whole pack</button>"
      + '<span class="hint">' + (scope === "pack" ? "Whole project" : "Only the currently selected mob") + '</span>'
