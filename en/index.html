<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpellMob Data Pack Generator</title>
<style>
/* SpellMob 数据包生成器 —— 全部样式，无外部依赖 */

:root {
  --bg: #12141a;
  --panel: #181b23;
  --panel-2: #1e222c;
  --panel-3: #242936;
  --line: #2c3240;
  --line-soft: #232936;
  --text: #e7eaf0;
  --muted: #98a1b2;
  --dim: #6d7686;
  --accent: #6ea8ff;
  --accent-dim: #2b4a80;
  --ok: #4ade80;
  --warn: #ffb454;
  --err: #ff6b6b;
  --radius: 8px;
  /* 中栏固定、两侧栏按需覆盖：基准列宽 + 当前实际宽度 */
  --base-left: 236px;
  --base-right: 384px;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
}

[hidden] { display: none !important; }

code {
  font-family: var(--mono);
  font-size: 12px;
  color: #c9d3e4;
  background: var(--panel-3);
  padding: 1px 5px;
  border-radius: 4px;
}

button { font: inherit; color: inherit; }

/* ---------------------------------------------------------------- 报错条 */

.fatal {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 90;
  padding: 12px 16px;
  background: #4a1418;
  border-bottom: 1px solid var(--err);
  color: #ffd7d7;
  font-family: var(--mono);
  font-size: 12px;
  white-space: pre-wrap;
}

/* ------------------------------------------------------------------ 顶栏 */

#topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 8px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  min-height: 56px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 0 0 auto;
}

.mark {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: linear-gradient(140deg, #3a6fd8, #7b3fd8);
  color: #fff;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.5px;
}

.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text b { font-size: 13px; }
.brand-text small { color: var(--dim); font-size: 11px; }

.fld {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.fld > span {
  font-size: 10px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.topacts {
  display: flex;
  gap: 6px;
  flex: 0 0 auto;
  margin-left: auto;
}

/* ------------------------------------------------------------------ 控件 */

input, select, textarea {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  padding: 5px 7px;
  font: inherit;
  min-width: 0;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(110, 168, 255, 0.16);
}

input.bad, select.bad, .bad input {
  border-color: var(--err);
  background: #2a1618;
}

input::placeholder { color: #59616f; }

select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position: calc(100% - 13px) 52%, calc(100% - 8px) 52%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 22px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 11px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  font-size: 12px;
}

.btn:hover { background: var(--panel-3); border-color: #3a4254; }
.btn:active { transform: translateY(1px); }

.btn.primary {
  background: #2f5fae;
  border-color: #3f74c8;
  color: #eef4ff;
  font-weight: 600;
}
.btn.primary:hover { background: #376cc4; }

.btn.mini { padding: 3px 8px; font-size: 11px; }
.btn.danger { color: #ffb3b3; border-color: #5a2a2e; }
.btn.danger:hover { background: #3a1b1e; border-color: #7a363b; }

.btn.ghost {
  background: transparent;
  border-style: dashed;
  color: var(--muted);
  width: 100%;
  justify-content: center;
  margin-top: 6px;
}
.btn.ghost:hover { color: var(--text); border-color: var(--accent-dim); background: rgba(110, 168, 255, 0.06); }

.icon {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 5px;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
}
.icon:hover { color: var(--text); background: var(--panel-3); border-color: var(--line); }

.pill {
  display: inline-block;
  min-width: 18px;
  padding: 0 6px;
  border-radius: 9px;
  background: var(--panel-3);
  color: var(--muted);
  font-size: 10px;
  text-align: center;
  line-height: 17px;
  font-weight: 500;
  vertical-align: middle;
}

/* --------------------------------------------------------------- 三栏布局 */

#layout {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: var(--base-left) minmax(0, 1fr) var(--base-right);
  min-height: 0;
  position: relative;
}

#sidebar, #editor, #inspect {
  min-height: 0;
  overflow: auto;
}

/* 两侧栏可以拉得比自己的列更宽，压在中栏上面；中栏列宽不变、内容不重排 */

#sidebar {
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  width: var(--w-left, var(--base-left));
  justify-self: start;
  position: relative;
  z-index: 3;
  box-shadow: 6px 0 18px rgba(0, 0, 0, 0.28);
}

/* 工程字段放在侧栏顶上：顶栏留给按钮，撤销/重做才不被挤掉 */

.side-fields {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line-soft);
}

.side-fields .fld {
  flex-direction: row;
  align-items: center;
  gap: 7px;
}

.side-fields .fld > span {
  flex: 0 0 50px;
  font-size: 10.5px;
  text-transform: none;
  letter-spacing: 0;
}

.side-fields .fld input, .side-fields .fld select {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 11.5px;
  padding: 4px 6px;
}

.side-fields .fld input { font-family: var(--mono); }

/* 中栏压在下层：两侧栏拉宽时把它盖住，中栏里的导航条也不能冒到上面去 */

#editor { padding: 12px 14px 40px; position: relative; z-index: 1; }

/* 中栏顶上的章节导航：跟着滚但钉在顶部，点一下跳到那张卡并在右侧 JSON 加亮 */

.secnav {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: -12px -14px 12px;
  padding: 10px 14px 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--line-soft);
}

.secnav-item {
  padding: 4px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel-2);
  color: var(--muted);
  font-size: 11.5px;
  cursor: pointer;
  white-space: nowrap;
}

.secnav-item:hover { color: var(--text); border-color: var(--accent-dim); background: var(--panel-3); }
.secnav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

#inspect {
  background: var(--panel);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  width: var(--w-right, var(--base-right));
  justify-self: end;
  position: relative;
  z-index: 3;
  box-shadow: -6px 0 18px rgba(0, 0, 0, 0.28);
}

/* 两条竖把手：贴着两侧栏的边，拖它改宽度，双击/回车回默认 */

.splitter {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 9px;
  z-index: 6;
  cursor: col-resize;
  background: transparent;
  touch-action: none;
}

.splitter::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 4px;
  width: 1px;
  background: transparent;
  transition: background 0.12s;
}

.splitter:hover::after, .splitter:focus-visible::after, .splitter.dragging::after {
  background: var(--accent);
}

.splitter:focus-visible { outline: none; }

#split-left { left: calc(var(--w-left, var(--base-left)) - 4px); }
#split-right { right: calc(var(--w-right, var(--base-right)) - 4px); }

body.col-resizing { cursor: col-resize; user-select: none; }
body.col-resizing * { cursor: col-resize !important; }

/* ------------------------------------------------------------- 左侧实体表 */

.side-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line-soft);
  position: sticky;
  top: 0;
  background: var(--panel);
  z-index: 2;
}

.side-head h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.3px;
}

.entity-list {
  list-style: none;
  margin: 0;
  padding: 6px;
  flex: 1 1 auto;
  overflow: auto;
  min-height: 0;
}

.entity {
  padding: 7px 9px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  margin-bottom: 3px;
}

.entity:hover { background: var(--panel-2); }
.entity.on { background: #1d2b45; border-color: var(--accent-dim); }

.eid {
  font-family: var(--mono);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.meta {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--dim);
  font-size: 11px;
  margin-top: 2px;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  flex: 0 0 auto;
}
.dot.err { background: var(--err); }
.dot.warn { background: var(--warn); }
.dot.note { background: #5d6b86; }

.tag {
  display: inline-block;
  padding: 0 5px;
  border-radius: 4px;
  background: var(--panel-3);
  border: 1px solid var(--line);
  color: var(--dim);
  font-size: 10px;
  line-height: 15px;
  vertical-align: middle;
  font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
}
.tag.ok { color: #a6e9c0; border-color: #2f5c43; background: #1a2c22; }
.tag.def { color: #b9c3d4; }
.tag.req { color: #ffd0a3; border-color: #5c4326; background: #2b2218; }

.side-hint {
  margin: 0;
  padding: 8px 12px;
  border-top: 1px solid var(--line-soft);
  color: var(--dim);
  font-size: 11px;
  line-height: 1.6;
}

.side-hint code { font-size: 10px; padding: 0 3px; }

/* --------------------------------------------------------------- 编辑区 */

.ed-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 10px;
  align-items: center;
  padding-bottom: 10px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

.ed-title { display: flex; align-items: center; gap: 8px; min-width: 0; grid-column: 1; }

.eid-input {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  background: transparent;
  border-color: transparent;
  padding: 2px 4px;
  width: 100%;
  max-width: 420px;
}
.eid-input:hover { border-color: var(--line); background: var(--panel-2); }

.filepath {
  grid-column: 1;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  padding-left: 5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ed-acts { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 5px; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 12px;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line-soft);
  background: #1b1f28;
  border-radius: var(--radius) var(--radius) 0 0;
}

.card-head h3 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.3px;
  flex: 0 0 auto;
}

.card-side {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  min-width: 0;
  justify-content: flex-end;
}

.card-side .hint { text-align: right; }
.card-body { padding: 10px 12px 12px; }

.hint {
  margin: 0;
  color: var(--dim);
  font-size: 11px;
  line-height: 1.55;
}

.note {
  margin: 6px 0;
  padding: 6px 9px;
  border-radius: 6px;
  background: #1b2230;
  border-left: 2px solid var(--accent-dim);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.55;
}
.note.warn { background: #2a2213; border-left-color: var(--warn); color: #ffd6a1; }

.group-title {
  margin: 12px 0 6px;
  font-size: 10px;
  font-weight: 700;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.7px;
  border-bottom: 1px dashed var(--line-soft);
  padding-bottom: 4px;
}

.fields {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 7px 9px;
}

.f {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.f > span {
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.f.wide { grid-column: 1 / -1; }
.f input, .f select { width: 100%; font-size: 12px; }

.f.spell-f { flex: 1 1 auto; }
.f.spell-f input { font-family: var(--mono); }

/* ------------------------------------------------------------ 施法条目 */

.cast-list { display: flex; flex-direction: column; gap: 8px; }

.cast {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel-2);
  padding: 8px 10px 10px;
}

.cast-top {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-bottom: 7px;
}

.spell-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: 0 1 auto;
  min-width: 0;
  padding-bottom: 6px;
}

.spell-zh {
  color: var(--ok);
  font-size: 11px;
  white-space: nowrap;
  max-width: 190px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.spell-zh.bad { color: var(--err); }
.spell-zh:empty { display: none; }

.triggers { display: flex; flex-direction: column; gap: 7px; }

.trig {
  border: 1px solid var(--line-soft);
  border-radius: 7px;
  padding: 8px 10px 10px;
  background: var(--panel-2);
}
.trig.empty { border-style: dashed; background: transparent; padding-bottom: 10px; }

.trig-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.trig-head b { font-size: 12px; font-weight: 600; }

/* ------------------------------------------------- 折叠卡片（整栏收起） */

.card-head[data-act="fold"] { cursor: pointer; user-select: none; }
.card-head[data-act="fold"]:hover h3 { color: var(--accent); }
.card-head:focus-visible { outline: 2px solid var(--accent-dim); outline-offset: -2px; }

.chev {
  font-style: normal;
  display: inline-block;
  margin-right: 5px;
  font-size: 10px;
  color: var(--dim);
  transition: transform 0.12s;
}

.folded > .card-head .chev,
.folded > .cast-top .chev { transform: rotate(-90deg); }

.card.folded > .card-head { border-bottom: 0; border-radius: var(--radius); }
.folded > .card-body, .folded > .cast-body { display: none; }

.cast.folded { padding-bottom: 8px; }
.cast.folded .cast-top { margin-bottom: 0; }

.f.spell-f > span[data-act="fold"] { cursor: pointer; user-select: none; }
.f.spell-f > span[data-act="fold"]:hover { color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  .chev { transition: none; }
}

/* ---------------------------------------------------------- 折叠子面板 */

.sub {
  border: 1px solid var(--line-soft);
  border-radius: 7px;
  margin: 8px 0 0;
  background: #1a1e27;
}

.sub > summary {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  cursor: pointer;
  list-style: none;
  font-size: 12px;
  color: var(--muted);
  user-select: none;
}
.sub > summary::-webkit-details-marker { display: none; }
.sub > summary::before {
  content: "▸";
  color: var(--dim);
  font-size: 10px;
  transition: transform 0.12s;
}
.sub[open] > summary::before { content: "▾"; }
.sub > summary:hover { color: var(--text); }
.sub[open] > summary { border-bottom: 1px solid var(--line-soft); }

.sub-body { padding: 8px 10px 10px; }

/* ---------------------------------------------------------------- 变体 */

.variant {
  border: 1px solid #3a3148;
  border-radius: 8px;
  background: #1c1a26;
  padding: 0 10px 10px;
  margin-bottom: 10px;
}

.variant-head {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0 -10px 8px;
  padding: 7px 10px;
  background: #23202f;
  border-bottom: 1px solid #34304a;
  border-radius: 8px 8px 0 0;
}

/* 变体标题就是折叠开关；按钮区在它外面，不会误触 */
.variant-toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  cursor: pointer;
  border-radius: 4px;
  padding: 1px 3px;
  margin: -1px -3px;
}
.variant-toggle:hover { background: #2b2739; }
.variant-toggle:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
.variant.folded { padding-bottom: 0; }
.variant.folded > .variant-head { margin-bottom: 0; border-bottom-color: transparent; border-radius: 8px; }
.variant.folded > .variant-body { display: none; }
.variant.folded > .variant-head .chev { transform: rotate(-90deg); }
.variant-tools {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 2px 0 8px;
}
.variant-tools .hint { flex: 1 1 auto; margin: 0; }
.variant-tools .btn.ghost { width: auto; margin-top: 0; flex: 0 0 auto; }
.phase-tag.identity {
  color: #cfe3ff;
  background: #1e2b3d;
  border-color: #33507a;
}

.idx {
  font-family: var(--mono);
  font-size: 11px;
  color: #c0b0e8;
  background: #2e2a42;
  border-radius: 4px;
  padding: 0 5px;
}

.vtags {
  font-family: var(--mono);
  font-size: 11px;
  color: #b9aee0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.spacer { flex: 1 1 auto; }

/* 变体的阶段名标签（第 N 阶段 / 个体变体 / 缺条件） */
.phase-tag {
  flex: 0 0 auto;
  font-size: 10.5px;
  color: #ffe0b0;
  background: #382c1e;
  border: 1px solid #5a4526;
  border-radius: 999px;
  padding: 0 7px;
  white-space: nowrap;
}

.selector { margin-top: 4px; }
.selector > .hint, .drop > .hint { margin-top: 6px; }

.rule, .drop {
  position: relative;
  border: 1px solid var(--line-soft);
  border-radius: 7px;
  padding: 8px 34px 10px 10px;
  margin-top: 8px;
  background: #1a1e27;
}

.rule-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 6px;
}

.rule > .icon, .drop > .icon {
  position: absolute;
  top: 6px;
  right: 6px;
}

.drop { background: #171b23; }

.phase-empty { margin-top: 6px; }

/* ------------------------------------------------------------ 示范/弹窗 */

.preset {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line-soft);
}
.preset:last-child { border-bottom: 0; }
.preset-text { flex: 1 1 auto; min-width: 0; }
.preset-text b { font-size: 13px; }
.preset-text code { font-size: 11px; }
.preset-text .hint { margin: 2px 0 4px; }

.modal-sep {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 16px 0 8px;
  color: var(--dim);
  font-size: 11px;
}
.modal-sep::before,
.modal-sep::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--line); }

.modal {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  background: rgba(6, 8, 12, 0.72);
  padding: 20px;
}

.modal-box {
  width: min(560px, 100%);
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
}

.modal-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line-soft);
}
.modal-head h3 { margin: 0; font-size: 13px; flex: 1 1 auto; }

.modal-body { padding: 14px; overflow: auto; }
.modal-body p { margin: 0 0 10px; }
.modal-body .f { margin-bottom: 8px; }
.modal-body input { width: 100%; font-family: var(--mono); }

.modal-acts {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 14px;
}

/* ------------------------------------------------------------ 右侧面板 */

.tabs {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  row-gap: 2px;
  padding: 6px 8px 0;
  border-bottom: 1px solid var(--line);
}

.tabs button {
  white-space: nowrap;
  padding: 6px 8px;
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.tabs button:hover { color: var(--text); background: var(--panel-2); }
.tabs button.on {
  color: var(--text);
  background: var(--panel-2);
  border-color: var(--line);
  margin-bottom: -1px;
  font-weight: 600;
}

/* 视觉上藏起来、但仍然可点：<label for> 靠它打开系统文件选择框 */
/* 章节导航点在 JSON 里高亮的那段 */

#json-out .json-hl {
  display: inline;
  border-radius: 3px;
  background: rgba(110, 168, 255, 0.18);
  color: var(--text);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}

.pane {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 10px 12px 20px;
}

.pane-head {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  word-break: break-all;
  padding: 2px 0 8px;
  border-bottom: 1px dashed var(--line-soft);
  margin-bottom: 8px;
}

#json-out {
  margin: 0;
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.55;
  color: #cfd8e6;
  white-space: pre;
  tab-size: 2;
}

.problems, .files {
  list-style: none;
  margin: 0;
  padding: 0;
}

.problem {
  padding: 7px 9px;
  border-radius: 6px;
  margin-bottom: 6px;
  border-left: 2px solid var(--line);
  background: var(--panel-2);
}
.problem.err { border-left-color: var(--err); background: #241719; }
.problem.warn { border-left-color: var(--warn); background: #241f14; }

.problem .where {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--dim);
  word-break: break-all;
}
.problem .msg { font-size: 12px; margin-top: 2px; }
.problem.err .msg { color: #ffc9c9; }
.problem.warn .msg { color: #ffdfb0; }
.problem.note { border-left-color: #44506a; }
.problem.note .msg { color: #c8d0de; }
.problem .hint {
  font-size: 11px;
  line-height: 1.55;
  margin-top: 3px;
  color: var(--muted);
}

/* 能跳到中栏的那条诊断：整行可点，悬停才显示提示 */
.problem.jumpable { cursor: pointer; }
.problem.jumpable:hover { border-left-color: var(--accent); background: #1c2333; }
.problem.jumpable:focus-visible { outline: 2px solid var(--accent-dim); outline-offset: 1px; }
.problem .jump-hint {
  margin-top: 4px;
  text-align: right;
  font-size: 10.5px;
  color: var(--accent);
  opacity: 0;
}
.problem.jumpable:hover .jump-hint,
.problem.jumpable:focus-visible .jump-hint { opacity: 1; }

/* 从诊断跳过来时闪一下那个字段 */
.flash { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.problem-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 2px 0 10px;
  font-size: 11px;
}
.problem-summary .sev {
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
}
.problem-summary .sev.err { color: #ffc9c9; border-color: #5a2a2e; background: #241719; }
.problem-summary .sev.warn { color: #ffdfb0; border-color: #5a4a24; background: #241f14; }
.problem-summary .sev.note { color: #c8d0de; border-color: #44506a; background: var(--panel-2); }
.problem-summary .sev.ok { color: #b6f3cd; border-color: #24503a; background: #16241c; }

/* 检查页的过滤条 + 一键修复 */
.problem-tools {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 0 4px;
}

.sev-filter {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel-2);
}

.sev-filter button {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  padding: 2px 9px;
  border-radius: 999px;
  cursor: pointer;
}

.sev-filter button:hover { color: var(--text); }
.sev-filter button.on { background: var(--accent-dim); color: #eaf1ff; }
.sev-filter button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.problem-tools #fix-all { margin-left: auto; }
.problem .fix { margin-top: 6px; }
.problem .fix.bad { opacity: 0.6; }

.file {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 5px 7px;
  border-radius: 5px;
  cursor: default;
  border: 1px solid transparent;
}
.file[data-act] { cursor: pointer; }
.file:hover { background: var(--panel-2); }
.file.on { background: #1d2b45; border-color: var(--accent-dim); }
.file .path {
  font-family: var(--mono);
  font-size: 11px;
  word-break: break-all;
  flex: 1 1 auto;
}
.file .size { color: var(--dim); font-size: 10px; flex: 0 0 auto; }

/* --------------------------------------------------------------- 字段帮助 */

.help-search {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -2px 0 10px;
  padding: 2px 0 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--line-soft);
}
.help-input {
  flex: 1 1 auto;
  min-width: 0;
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel-2);
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
}
.help-input:focus { outline: none; border-color: var(--accent); }
.help-search .hint { flex: 0 0 auto; font-size: 10.5px; color: var(--dim); }

.help-group { margin-bottom: 16px; }
.help-group h3 {
  margin: 0 0 6px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--accent);
}
.help-group dl { margin: 0; }

.help-item {
  padding: 6px 0;
  border-bottom: 1px solid var(--line-soft);
}
.help-item dt {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 2px;
}
.help-item dt code { color: #a8c4ff; background: transparent; padding: 0; font-size: 11.5px; }
.help-item dd {
  margin: 0;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.6;
}

/* ------------------------------------------------------------------ 空态 */

.empty {
  list-style: none;
  color: var(--dim);
  font-size: 12px;
  padding: 14px 8px;
  text-align: center;
}

.empty-editor {
  max-width: 460px;
  margin: 60px auto;
  text-align: center;
  color: var(--muted);
}
.empty-editor h2 { font-size: 16px; margin: 0 0 8px; color: var(--text); }
.empty-editor p { margin: 0; font-size: 12px; line-height: 1.7; }

/* ------------------------------------------------------------------ 提示 */

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 80;
  transform: translateX(-50%);
  max-width: min(680px, calc(100vw - 40px));
  padding: 10px 16px;
  background: var(--panel-3);
  border: 1px solid var(--accent-dim);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
  color: var(--text);
  font-size: 12.5px;
  animation: toast-in 140ms ease-out;
}

@keyframes toast-in {
  from { opacity: 0; transform: translate(-50%, 6px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

@media (prefers-reduced-motion: reduce) {
  .toast { animation: none; }
}

/* --------------------------------------------------- v2：搜索 / 法术选择 */

.side-search {
  width: calc(100% - 24px);
  margin: 8px 12px 6px;
  padding: 6px 9px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  font-size: 12px;
}

.btn:disabled { opacity: 0.35; cursor: default; transform: none; }

.school-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
}

.chip {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 10px;
  background: var(--panel-3);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 10.5px;
  line-height: 16px;
  white-space: nowrap;
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 10px; }

.picker-box { display: flex; flex-direction: column; gap: 8px; }

.picker-input {
  width: 100%;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  font-size: 13px;
}

.picker {
  max-height: 46vh;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel-2);
}

.pick {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 6px 10px;
  border: 0;
  border-bottom: 1px solid var(--line-soft);
  background: transparent;
  text-align: left;
  cursor: pointer;
  font-size: 12px;
}
.pick:last-child { border-bottom: 0; }
.pick:hover { background: var(--panel-3); }
.pick-zh { color: var(--text); }
.pick-en { color: var(--muted); font-size: 11.5px; }
.pick-id { margin-left: auto; color: var(--dim); font-family: var(--mono); font-size: 11px; }

/* ------------------------------------------------------------ v2：统计 */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
  gap: 8px;
  padding: 2px 0 10px;
}

/* 统计页签在右栏里，比弹窗窄：固定两列，别让“平均掉落件数”这种字挤成三行 */
#stats-body .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#stats-body .stat-card b { font-size: 17px; }

.stat-card {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 9px 11px;
  border-radius: var(--radius);
  background: var(--panel-2);
  border: 1px solid var(--line);
}
.stat-card b { font-size: 18px; font-weight: 600; color: var(--text); }
.stat-card span { font-size: 11.5px; color: var(--muted); }
.stat-card small { font-size: 10.5px; color: var(--dim); }

.sub-title {
  margin: 14px 0 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
}

/* 统计里能整块折叠的小节（学派分布）：标题本身就是按钮 */
.sub { margin: 0; }
.sub-fold {
  display: flex;
  align-items: baseline;
  gap: 6px;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.sub-fold:hover { color: var(--accent); }
.sub-fold .chev { align-self: center; transition: transform .15s; }
.sub-fold[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.sub-fold .hint { margin-left: auto; font-weight: 400; font-size: 10.5px; }
.sub.folded .sub-body { display: none; }
.sub-head-row { display: flex; align-items: baseline; gap: 8px; }
.sub-acts { margin-left: auto; display: flex; gap: 4px; }
.mini-btn {
  padding: 1px 7px;
  font-family: inherit;
  font-size: 10.5px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel-2);
  color: var(--dim);
  cursor: pointer;
}
.mini-btn:hover { color: var(--text); border-color: var(--accent); }
.mini-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.school-block { margin-bottom: 1px; }

/* 学派那一行本身是按钮：点一下展开 / 收起这一派的法术 */
.bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 3px 2px;
  border: 0;
  border-radius: 4px;
  background: none;
  color: inherit;
  font: inherit;
  font-size: 11.5px;
  text-align: left;
  cursor: pointer;
}
.bar-row:hover { background: var(--panel-2); }
.bar-row:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
.bar-row .chev {
  font-style: normal;
  color: var(--dim);
  font-size: 10px;
  transition: transform .12s ease;
}
.bar-row[aria-expanded="false"] .chev { transform: rotate(-90deg); }

.school-spells {
  list-style: none;
  margin: 2px 0 8px;
  padding: 0 0 0 26px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.school-spells li { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
.school-spells .spell-zh { max-width: none; }
.school-spells .chip { font-size: 10px; line-height: 15px; padding: 0 6px; }
.school-spells .spell-count { color: var(--dim); font-size: 10px; font-family: var(--mono); }
.school-spells .spell-id { margin-left: auto; color: var(--dim); font-size: 10px; }
.school-empty { margin: 2px 0 8px 26px; }

.bar-label { flex: 0 0 46px; color: var(--muted); }
.bar { flex: 1 1 auto; height: 6px; border-radius: 3px; background: var(--panel-3); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.bar-num { flex: 0 0 22px; text-align: right; color: var(--dim); font-family: var(--mono); }

/* ---------------------------------------------------- 统计：范围切换 */
.stats-scope {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 10px;
}
.stats-scope .scope-btn {
  padding: 2px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 11.5px;
  cursor: pointer;
}
.stats-scope .scope-btn:hover { border-color: var(--accent); color: var(--text); }
.stats-scope .scope-btn.on {
  border-color: var(--accent);
  background: var(--accent-soft, rgba(110, 168, 255, 0.16));
  color: var(--text);
}
.stats-scope .scope-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.stats-scope .hint { font-size: 10.5px; color: var(--dim); }

/* 当前实体视图不再单独写实体名（左边选中项已经说明了），变体清单直接贴着卡片 */
.stats-varlist { margin-top: 0; }

/* ------------------------------------------------ 统计：生物与变体明细 */
/* 搜索行吸顶：生物一多也不会把搜索框滚没 */
.stats-search {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  padding: 2px 0 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--line-soft);
}
.stats-search .help-input { flex: 1 1 auto; min-width: 0; }
.stats-search .hint { flex: 0 0 auto; font-size: 10.5px; color: var(--dim); white-space: nowrap; }

.ent-list { display: flex; flex-direction: column; gap: 6px; }
.ent-stat {
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  background: var(--panel-2);
  overflow: hidden;
}
.ent-stat[hidden] { display: none; }
.ent-head {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 100%;
  padding: 7px 9px;
}
.ent-head:hover { background: var(--panel-3); }
.ent-title {
  flex: 1 1 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 6px;
  min-width: 0;
}
/* 行首的小箭头负责展开 / 收起 */
.ent-chev {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  margin-left: -2px;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: none;
  color: var(--dim);
  font: inherit;
  line-height: 1;
  cursor: pointer;
}
.ent-chev:hover { background: var(--panel-3); color: var(--text); }
.ent-chev:focus-visible { outline: 2px solid var(--accent-dim); outline-offset: 1px; }
.ent-id {
  flex: 0 1 auto;
  min-width: 0;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--text);
  overflow-wrap: anywhere;
}
.ent-zh { flex: 0 0 auto; font-size: 11px; color: var(--dim); white-space: nowrap; }
.ent-num {
  flex: 0 0 auto;
  margin-left: auto;
  font-size: 10.5px;
  color: var(--dim);
  white-space: nowrap;
  font-family: var(--mono);
}
.ent-body { padding: 0 9px 9px; border-top: 1px solid var(--line-soft); }
.ent-facts { padding-top: 7px; font-size: 11.5px; color: var(--muted); }
.ent-body .chips { padding: 6px 0 0; }
.school-chip { display: inline-flex; align-items: center; gap: 4px; }
.school-chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.ent-stat.folded .ent-body { display: none; }
.ent-stat.folded > .ent-head .chev { transform: rotate(-90deg); }
.ent-stat.folded > .ent-head .ent-num { opacity: 0.85; }

.var-list { list-style: none; margin: 7px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.var-stat {
  padding: 0;
  border-radius: 6px;
  background: var(--panel-3);
  font-size: 11.5px;
}
.var-stat[hidden] { display: none; }
/* 变体标题行是按钮：点一下只折叠这一条变体的法术表（收起后学派小标签还在） */
.var-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  padding: 5px 7px 4px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
}
button.var-row { cursor: pointer; }
button.var-row:hover { background: var(--panel-2); }
button.var-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
.var-row-static { cursor: default; }
.var-line {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 8px;
  width: 100%;
}
.var-row .chev { align-self: center; transition: transform .15s; }
.var-stat.folded .var-row .chev { transform: rotate(-90deg); }
.var-stat.folded > .var-body { display: none; }
/* 这一阶段的学派分布：一排彩色小标签，收起时也留在标题行里 */
.var-schools { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.var-schools .chip { font-size: 10px; line-height: 15px; padding: 0 6px; }
/* 法术表按 主动 / 触发 分组的小标题 */
.var-group { margin: 3px 0 2px 21px; font-size: 10.5px; color: var(--dim); }
@media (prefers-reduced-motion: reduce) {
  .var-row .chev, .sub-fold .chev { transition: none; }
}
.var-idx { font-family: var(--mono); font-size: 11px; color: var(--accent); }
.var-sel { color: var(--text); word-break: break-word; }
.var-meta { margin-left: auto; color: var(--dim); font-size: 10.5px; }
.var-meta .chip { font-size: 10px; line-height: 15px; padding: 0 6px; }
.var-empty { margin: 0 0 6px 7px; font-size: 11px; }

/* 每条变体自己施放的法术：缩进在变体行下面，和学派展开的清单同一个外观 */
.var-spells {
  list-style: none;
  display: flex;
  flex-direction: column;
  margin: 0 0 5px;
  padding: 0 8px 3px 21px;
  gap: 2px;
}
.var-spells li { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.var-spells .spell-zh { max-width: 100%; }
.var-spells .chip { font-size: 10px; line-height: 15px; padding: 0 6px; }
.var-spells .spell-count { color: var(--dim); font-size: 10px; font-family: var(--mono); }
.var-spells .spell-id { margin-left: auto; color: var(--dim); font-size: 10px; }
/* 根层不能选、不能折叠，用一条虚线跟变体区分开 */
.var-root { border: 1px dashed var(--line); background: var(--panel-2); }
.var-root .var-idx { color: var(--muted); }
/* 「打开工程」弹窗：拖放区 + 原生文件选择 */
.pick-file {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 22px 16px;
  margin-bottom: 10px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  background: var(--panel-2);
  text-align: center;
  transition: border-color .15s, background .15s;
}
.pick-file b { font-size: 13px; color: var(--text); }
.pick-file .hint { font-size: 11.5px; color: var(--dim); }
.pick-file.over { border-color: var(--accent); background: var(--panel-3); }

.mini-list { margin: 4px 0 10px; padding-left: 18px; font-size: 12px; color: var(--muted); line-height: 1.75; }
.mini-list code { font-size: 11.5px; }

.filetable { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.filetable th, .filetable td { padding: 5px 8px; border-bottom: 1px solid var(--line-soft); text-align: left; }
.filetable th { color: var(--dim); font-weight: 500; }
.filetable td.num { text-align: right; color: var(--muted); white-space: nowrap; }
.filetable .mono { font-family: var(--mono); font-size: 11px; color: #c9d3e4; }

/* ---------------------------------------------------------- v2：模拟器 */

.sim-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.sim-hp { display: block; margin: 10px 0 12px; }
.sim-hp input[type="range"] { width: 100%; accent-color: var(--accent); }
.sim-now { padding: 10px 12px; border-radius: var(--radius); background: var(--panel-2); border: 1px solid var(--line); }
.sim-verdict { display: flex; flex-direction: column; gap: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--line-soft); }
.sim-verdict b { font-size: 14px; }
.sim-verdict span { font-size: 11.5px; color: var(--muted); }
.sim-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; padding: 8px 0; }
.sim-facts div { display: flex; flex-direction: column; }
.sim-facts span { font-size: 10.5px; color: var(--dim); }
.sim-facts b { font-size: 12px; font-weight: 500; }
.sim-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11.5px; }
.sim-table th, .sim-table td { padding: 3px 8px; border-bottom: 1px solid var(--line-soft); text-align: left; }
.sim-table th { color: var(--dim); font-weight: 500; }
.sim-table tr.on td { background: rgba(110, 168, 255, 0.12); color: var(--text); }

.sim-hp-row { display: flex; align-items: flex-end; gap: 8px; margin: 10px 0 12px; }
.sim-hp-row .sim-hp { flex: 1 1 auto; margin: 0; }
.sim-hp-row #sim-play { flex: 0 0 auto; }

.sim-verdict.flash { animation: simflash 700ms ease-out; }
@keyframes simflash {
  from { background: rgba(110, 168, 255, 0.32); }
  to { background: transparent; }
}
@media (prefers-reduced-motion: reduce) {
  .sim-verdict.flash { animation: none; }
}

/* ------------------------------------------------------- 批量更改 */

.batch-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.batch-row span { flex: 0 0 92px; font-size: 11.5px; color: var(--muted); }
.batch-row input, .batch-row select { flex: 1 1 auto; min-width: 0; }
.modal-note { margin: 0 0 6px; font-size: 11.5px; color: var(--muted); }

/* --------------------------------------------------------------- 滚动条 */

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: #333a49;
  border-radius: 5px;
  border: 2px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover { background: #414a5e; }

/* 英文版：英文标签比中文长，给侧栏标签更宽的固定列，物种标签不换行 */

html[lang="en"] .side-fields .fld > span { flex: 0 0 70px; font-size: 10px; }
html[lang="en"] .ed-title .tag { flex: 0 0 auto; white-space: nowrap; }

/* ------------------------------------------------------------ 窄屏兜底 */

@media (max-width: 1180px) {
  :root { --base-left: 220px; --base-right: 340px; }
}

@media (max-width: 900px) {
  body { overflow: auto; }
  #layout {
    grid-template-columns: minmax(0, 1fr);
    grid-auto-rows: min-content;
  }
  #sidebar { max-height: 180px; border-right: 0; border-bottom: 1px solid var(--line); width: auto; justify-self: stretch; box-shadow: none; }
  #inspect { border-left: 0; border-top: 1px solid var(--line); max-height: 60vh; width: auto; justify-self: stretch; box-shadow: none; }
  .splitter { display: none; }
  #topbar { flex-wrap: wrap; }
  .topacts { flex-wrap: wrap; margin-left: 0; }
}

</style>

<body>

<div id="fatal" class="fatal" hidden></div>
<div id="toast" class="toast" hidden></div>

<header id="topbar">
  <div class="brand">
    <span class="mark">SM</span>
    <div class="brand-text">
      <b>SpellMob Data Pack Generator</b>
      <small id="ver"></small>
    </div>
  </div>

  <div class="topacts">
    <button class="btn mini" id="undo-btn" data-act="undo" title="Undo (Ctrl+Z)" disabled>↶</button>
    <button class="btn mini" id="redo-btn" data-act="redo" title="Redo (Ctrl+Shift+Z)" disabled>↷</button>
    <button class="btn" data-act="batch" title="Batch changes">Batch changes</button>
    <button class="btn" data-act="open-project">Open project</button>
    <button class="btn" data-act="save-project" title="Save as .project.json (Ctrl+S)">Save project</button>
    <button class="btn primary" data-act="export-zip" title="Review files before download (Ctrl+Shift+E)">Export zip</button>
  </div>
</header>

<main id="layout">

  <aside id="sidebar">
    <div class="side-fields">
      <label class="fld"><span>Pack name</span>
        <input id="f-name" data-path="name" data-type="text" placeholder="my_spellmob_pack" spellcheck="false" autocomplete="off">
      </label>
      <label class="fld"><span>Game version</span>
        <select id="f-version" data-path="mcVersion" data-type="text"></select>
      </label>
      <label class="fld"><span>Output</span>
        <select id="f-mode" data-path="outputMode" data-type="text">
          <option value="min">Non-default fields only</option>
          <option value="full">Fill cast defaults</option>
        </select>
      </label>
    </div>
    <div class="side-head">
      <h2>Entities <span id="entity-count" class="pill">0</span></h2>
      <button class="btn mini" data-act="add-entity">New</button>
    </div>
    <input id="entity-search" class="side-search" placeholder="Search entity id or name (/ or Ctrl+Shift+K)" spellcheck="false" autocomplete="off">
    <ul id="entity-list" class="entity-list"></ul>
    <p class="side-hint">One file per entity: <code>data/&lt;ns&gt;/spell_casters/&lt;id&gt;.json</code></p>
  </aside>

  <section id="editor" class="editor"></section>

  <aside id="inspect">
    <nav class="tabs" id="tabs">
      <button data-act="tab" data-tab="json" class="on">JSON</button>
      <button data-act="tab" data-tab="problems">Problems <span id="problem-count" class="pill">0</span></button>
      <button data-act="tab" data-tab="stats">Stats</button>
      <button data-act="tab" data-tab="sim">Simulator</button>
      <button data-act="tab" data-tab="help">Help</button>
      <button data-act="tab" data-tab="files">Files</button>
    </nav>
    <div class="pane" id="pane-json">
      <div class="pane-head" id="json-file"></div>
      <pre id="json-out"></pre>
    </div>
    <div class="pane" id="pane-problems" hidden>
      <div class="problem-tools">
        <div class="sev-filter" role="group" aria-label="Problem filter">
          <button data-act="problem-filter" data-filter="all" class="on">All</button>
          <button data-act="problem-filter" data-filter="serious">Errors + warnings</button>
          <button data-act="problem-filter" data-filter="err">Errors only</button>
        </div>
        <button class="btn mini" id="fix-all" data-act="fix-all" hidden>Fix all</button>
      </div>
      <div class="problem-summary" id="problem-summary"></div>
      <ul id="problem-list" class="problems"></ul>
    </div>
    <div class="pane" id="pane-stats" hidden><div id="stats-body" class="stats"></div></div>
    <div class="pane" id="pane-sim" hidden><div id="sim-body"></div></div>
    <div class="pane" id="pane-help" hidden>
      <div class="help-search">
        <input id="help-q" class="help-input" type="search" placeholder="Search a field or description, e.g. cooldown / world / drops" spellcheck="false" autocomplete="off">
        <span class="hint" id="help-count"></span>
      </div>
      <div id="help-body" class="help"></div>
    </div>
    <div class="pane" id="pane-files" hidden><ul id="file-list" class="files"></ul></div>
  </aside>

  <div class="splitter" id="split-left" role="separator" aria-orientation="vertical" aria-label="Drag to resize the left sidebar (double-click to reset)" tabindex="0"></div>
  <div class="splitter" id="split-right" role="separator" aria-orientation="vertical" aria-label="Drag to resize the right sidebar (double-click to reset)" tabindex="0"></div>

</main>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="btn mini" data-act="modal-close">Close</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

        },
        {

        },
        {
          "k": "knockback",
          "def": "0",
          "text": "0..16; pushes nearby entities away."
        },
        {
          "k": "invulnerableTicks",
          "def": "40",
          "text": "0..1200; invulnerability during the presentation."
        },
        {

          "text": "Negative = same length as invulnerableTicks; otherwise 0..1200."

          "text": "Length of the whole presentation, clamped to 10..1200."

        {

          "text": "Whether the same phase may replay after health drops or regenerates."
        },
        {
          "k": "summon",

        {

          "text": "day(1000) / noon(6000) / night(13000) / midnight(18000)."

    {
      "id": "drops",

      "items": [
        {
          "k": "select",
          "text": "Omitted = any mob. On death every matching rule is rolled, so two rules can share the same select."
        },
        {
          "k": "chance",
          "def": "1.0",
          "text": "The trigger chance for the whole rule."
        },
        {
          "k": "drops",
          "req": "Required",
          "text": "An array. If it resolves to empty, it throws and the whole rule is discarded."
        },
        {
          "k": "item / lootTable",
          "text": "Choose one. Setting both or neither throws. A missing item id only warns and skips that entry."
        },
        {
          "k": "count",
          "text": "When present, min = max = count (must be >= 1)."
        },
        {
          "k": "min / max",
          "def": "1 / same as min",
          "text": "Requires 1 <= min <= max, otherwise it throws."
        },
        {
          "k": "looting",
          "def": "false",
          "text": "When true, extra items are added based on the killer's Looting level."
        },
        {
          "k": "requirePlayerKill",
          "def": "true",
          "text": "By default only player kills count, to stop spawner farms. Set false to drop on any death."
        }
      ]
    },
    {
      "id": "drops2",
      "title": "Advanced drops dropRules",
      "items": [
        {
          "k": "select.name / nameRegex / tags",
          "text": "Same conditions as the variant selector, but here only name and scoreboard tags are matched. name is an exact match; nameRegex is Pattern.matches over the whole name."
        },
        {
          "k": "Health conditions inside select",
          "text": "At death the health fraction is 0, so healthBelow / healthAbove are always true (or always false) there — they add no condition. The current parser logs a warning when loading."
        },
        {
          "k": "A variant's own dropRules",
          "text": "Rolled only when the mob dies and this variant is the one active at settlement; losing health mid-fight drops nothing. It does not participate in select matching. The tool hides drop editing on phase variants to avoid confusion; edit the exported JSON if you really need it."
        },
        {
          "k": "Several rules matching at once",
          "text": "All of them are rolled, not just one. Several rules can share a select to mean \"drop any of these things\"."
        },
        {
          "k": "How chances stack",
          "text": "First the rule's own chance is rolled, then each drop inside the rule rolls its own chance (default 1). The two probabilities multiply."
        },
        {
          "k": "looting",
          "text": "When true, extra random(0..Looting level) items are added on top of max, not by rerolling the range."
        },
        {
          "k": "Stack splitting",
          "text": "If the total exceeds the item's max stack size, it is automatically split into several stacks; you do not need multiple entries."
        },
        {
          "k": "Item id not found",
          "text": "Only warns and skips that entry; it does not invalidate the whole rule (unlike parse-time errors)."
        },
        {
          "k": "lootTable",
          "text": "Uses the vanilla loot table; min / max / count do not participate, and the table decides the amount."
        }
      ]
    },
    {
      "id": "ranges",
      "title": "Value ranges",
      "items": [
        {
          "k": "level",
          "text": "1 to the spell's max level (at most 10). Out-of-range values are clamped, not errors."
        },
        {
          "k": "priority",
          "text": "0..9; lower numbers have higher priority. Clamped."
        },
        {
          "k": "checkInterval",
          "text": "1..200 ticks. Clamped."
        },
        {
          "k": "range",
          "text": "Minimum 1; the effective value is truncated again by the server's maxRange config."
        },
        {
          "k": "chance",
          "text": "0..1. Writing 30 to mean 30% is clamped to 1 (always cast), the most common cause of casts every tick."
        },
        {
          "k": "cooldown",
          "text": "-1 = use ISS's own cooldown; 0 or 1 means it can cast almost every tick, use with care."
        },
        {
          "k": "invulnerableTicks / phaseTicks / freezeTicks",
          "text": "0..1200 / 10..1200 / -1 (same as invulnerableTicks) or 0..1200."
        },
        {
          "k": "shake.duration / shake.radius",
          "text": "1..200 ticks / 1..64 blocks."
        },
        {
          "k": "burst.radius",
          "text": "1..16 blocks."
        },
        {
          "k": "summon.count / summon.radius",
          "text": "1..16 mobs / 1..16 blocks; defaults are 2 mobs and 3 blocks."
        },
        {
          "k": "moonPhase",
          "text": "0..7 integer; 0 = full moon. Out-of-range throws, it is not clamped."
        },
        {
          "k": "Health fractions",
          "text": "healthBelow / healthAbove / minHealthPercent / maxHealthPercent are all 0..1; out-of-range values are clamped."
        }
      ]
    },
    {
      "id": "trouble",
      "title": "Common problems",
      "items": [
        {
          "k": "Wrote it but nothing happens",
          "text": "Usually a misspelled key. Outside world / onPhase an unknown key only logs a warning, so nothing looks wrong in game — check the Problems tab for a warn first."
        },
        {
          "k": "No change after /reload",
          "text": "You must also run /spellmob resync. Mobs already in the world do not switch goals on reload alone."
        },
        {
          "k": "A spell never casts",
          "text": "A misspelled spell id, or a spell disabled in the ISS config, discards the whole entry; the log only keeps one [SpellMob] line."
        },
        {
          "k": "Filters seem to do nothing",
          "text": "entityTypes / entityTags / excludeTags must be inside target.filters. Placed directly on target, they are silently ignored."
        },
        {
          "k": "Boss stays in phase one forever",
          "text": "The variant order is reversed. The parser takes the smallest index among all matches, so the deepest phase (lowest health threshold) must come first."
        },
        {
          "k": "The whole file is ignored",
          "text": "If the root has no trigger / spell list / drop rules and no variants, the parser returns null. Write at least one non-empty field."
        },
        {
          "k": "world.time never matches",
          "text": "Dimensions without sky light, such as the Nether and the End, are treated as no match; the time is not miscalculated."
        },
        {
          "k": "cooldownGroup invalidates everything",
          "text": "cooldownGroup allows only lowercase letters, digits, underscores, dots and hyphens, 1–32 characters. Uppercase letters or spaces throw and discard the whole entry."
        },
        {
          "k": "Mob still melees / shoots",
          "text": "Check that disableAttackGoals is true on the root or the active variant; not set = false. It removes only the four vanilla attack goal families, so target selection is unchanged: the mob still targets and follows you, it just stops punching or shooting on its own."
        },
        {
          "k": "disableAttackGoals on a variant does nothing",
          "text": "A variant's select needs at least one real condition (name / nameRegex / tags / healthBelow / healthAbove / tamed). A variant that only sets disableAttackGoals is treated as missing conditions and discarded."
        }
      ]
    },
    {
      "id": "export",
      "title": "Export and project",
      "items": [
        {
          "k": "Zip layout",
          "text": "The zip root must be pack.mcmeta and data/<namespace>/spell_casters/<entity>.json. Do not wrap them in another folder, or the game will not find them."
        },
        {
          "k": "pack_format",
          "text": "Only changes with the game version: 1.20.1 = 15, 1.21.1 = 48. The spell_casters structure is identical in both."
        },
        {
          "k": "Output \"non-default fields only\"",
          "text": "Writes only fields you filled in; the export matches what you would hand-write and is easy to read."
        },
        {
          "k": "Output \"fill cast defaults\"",
          "text": "Writes level / range / chance / checkInterval and other defaults explicitly on every spell, making entry-by-entry tuning easier."
        },
        {
          "k": "Project file",
          "text": ".project.json stores entities, pack name, game version and output mode; it also reads v1.0.0 projects and SpellMob Studio projects."
        },
        {
          "k": "Autosave",
          "text": "Saved to localStorage under spellmob-generator.v2, about 0.7 seconds after a change. To start clean, create or open a project."
        },
        {
          "k": "Undo",
          "text": "80 steps; every data-changing action records a step. UI-only changes (tabs, folding, panel width) do not consume undo."
        },
        {
          "k": "Does the simulator get it right?",
          "text": "It uses the same effectiveIndex algorithm: the smallest matching index wins, and a sticky lock never reverts, so it matches phase changes in game."
        },
        {
          "k": "Check and export",
          "text": "Validation runs before export. Errors do not block export (so you can compare), but the notice says the pack will fail to load; warn / note never block export."
        }
      ]
    },
    {
      "id": "ui",
      "title": "Interface and shortcuts",
      "items": [
        {
          "k": "Layout",
          "text": "Entities on the left, editor in the middle, and JSON / Problems / Stats / Simulator / Help / Files on the right. The top bar only holds global actions: undo/redo, batch changes, open/save project, export zip."
        },
        {
          "k": "Collapse and expand",
          "text": "Click a card title to collapse the section; click the \"Spell\" title to collapse one spell; click a variant title to collapse one variant. The variant card has Expand all / Collapse all at the top right. Folding only affects display, not JSON."
        },
        {
          "k": "Shortcuts",
          "text": "Ctrl+Z undo; Ctrl+Shift+Z or Ctrl+Y redo; Ctrl+S save project; Ctrl+Shift+E export zip; Ctrl+Shift+K or / focuses entity search (not while typing in an input)."
        },
        {
          "k": "Problems page",
          "text": "Lists error / warn / note. Filter by All / Errors + warnings / Errors only; every item shows a file path and field path, and clicking it jumps to the matching control in the middle pane."
        },
        {
          "k": "Fix all",
          "text": "Safe automatic fixes (phase order, reversed thresholds, etc.) are summarized as \"Fix all (N)\" at the top of the Problems page. It only changes current project data and can be undone with Ctrl+Z; uncertain items are reported but not changed."
        },
        {
          "k": "Stats",
          "text": "The Stats tab switches between Current entity and Whole pack: spell count, spell types, variants, expected drops, school breakdown; the whole-pack view can filter by entity id / display name / tag."
        },
        {
          "k": "Simulator",
          "text": "The Simulator recomputes effectiveIndex from the health slider and shows the active variant, whether it is sticky-locked, the goals active in that phase, and a range table from 100% to 0%. Play moves from full health to 0%, pausing 0.7 seconds at each phase change."
        },
        {
          "k": "Batch changes",
          "text": "Batch changes in the top bar work across all entities: add one active spell to the root, set a shared cooldown / chance, replace spell ids, add sticky to every variant. Data only, undoable."
        },
        {
          "k": "Field reference",
          "text": "The Help tab is a quick reference for parser fields; search by key or description. It documents the real parser rules, not this tool's own conventions."
        },
        {
          "k": "Build and self-test",
          "text": "Run node test/core.test.mjs in the source root for logic tests; open test/selftest.html in a browser for UI self-tests; node build.mjs produces the single-file dist/spellmob-generator.html. Rebuild after editing source."
        }
      ]
    },
    {
      "id": "validation",
      "title": "Validation and diagnostics",
      "items": [
        {
          "k": "Severity levels",
          "text": "error = the game will discard the whole rule / variant / spell; warn = it loads but is almost certainly not what you want; note = a default value or likely pitfall, does not block loading."
        },
        {
          "k": "How to read paths",
          "text": "Paths start at the file name, e.g. data/minecraft/spell_casters/husk.json › variants[0].select.healthBelow. Clicking an item on the Problems page jumps to the matching card."
        },
        {
          "k": "Files that only set disableAttackGoals",
          "text": "A root object that only sets disableAttackGoals is still a valid file (hasDefault recognizes the key); only setting bossBar also counts. But a variant's select still needs a real condition, so a variant that only sets disableAttackGoals is discarded."
        },
        {
          "k": "Unknown keys",
          "text": "Unknown keys on the root, a variant, a spell entry or target are usually a warn and are ignored; world and onPhase are exceptions: an unknown key is an error and discards the enclosing object."
        },
        {
          "k": "Not found in the registry",
          "text": "When a spell / item / entity id is not in the built-in list, this tool only emits a note, not an error — a mod or data pack may register ids that are not in the list. Trust the game log at load time."
        },
        {
          "k": "requirePlayerKill note",
          "text": "Drops default to requirePlayerKill=true to stop spawner farms. To let non-player kills drop, write false explicitly; several notices in the same file are merged into one."
        },
        {
          "k": "What Fix all changes",
          "text": "Only things that are certainly safer: sort phase thresholds from deepest to shallowest, and swap reversed healthBelow / healthAbove. It does not guess spell ids or change balance values."
        },
        {
          "k": "Differences from the game",
          "text": "Validation follows the Java parser (whitelist, ranges, defaults), but it cannot verify whether a spell is enabled in your ISS version or whether an item is registered. The [SpellMob] log after /reload is authoritative."
        }
      ]
    }
