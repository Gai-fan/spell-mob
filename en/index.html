    if (!stats) {
      return scopeBar + "<p class=\"hint\">No entities yet. Create one with \"New\" on the left, or pick a template.</p>";
    }
    var maxSchool = stats.schoolList.length ? stats.schoolList[0].count : 1;
    var schoolBars = stats.schoolList.map(function (entry) {
      var label = (D.SCHOOL_LABELS || {})[entry.school] || entry.school;
      var width = Math.max(4, Math.round(entry.count / maxSchool * 100));
      var open = !!state.statsOpen[entry.school];
      var list = "";
      if (open) {
        var spells = stats.schoolSpells[entry.school] || [];
        list = spells.length
          ? '<ul class="school-spells">' + spells.map(function (item) {
            var typeRaw = item.type && D.CAST_TYPES[item.type] !== undefined ? D.CAST_TYPES[item.type] : null;
            var typeLabel = typeRaw && typeof typeRaw === "object" ? typeRaw.zh : typeRaw;
            return '<li><span class="spell-zh" style="color:' + esc(entry.color) + '">'
              + esc(item.zh !== item.en ? item.zh + " · " + item.en : item.zh) + '</span>'
              + (typeLabel ? '<span class="chip">' + esc(typeLabel) + '</span>' : "")
              + '<span class="spell-count">×' + item.count + '</span>'
              + '<code class="spell-id">' + esc(String(item.id).replace(/^[a-z0-9_.-]+:/, "")) + '</code></li>';
          }).join("") + '</ul>'
          : "<p class=\"hint school-empty\">No spells in this school yet.</p>";
      }
      return '<div class="school-block">'
        + '<button type="button" class="bar-row" data-act="stats-school" data-school="' + esc(entry.school) + '"'
        + ' aria-expanded="' + (open ? "true" : "false") + "\" title=\"Click to expand / collapse this school's spells\">"
        + '<i class="chev" aria-hidden="true">▾</i>'
        + '<span class="school-dot" style="background:' + esc(entry.color) + '"></span>'
        + '<span class="bar-label">' + esc(label) + '</span>'
        + '<span class="bar"><i style="width:' + width + '%;background:' + esc(entry.color) + '"></i></span>'
        + '<span class="bar-num">' + entry.count + '</span></button>'
        + list + '</div>';
    }).join("");
    var typeChips = Object.keys(stats.castTypes).map(function (type) {
      var typeName = D.CAST_TYPES[type] || type;
      var label = typeName && typeof typeName === "object" ? typeName.zh : typeName;
      return '<span class="chip">' + esc(label) + " · " + stats.castTypes[type] + '</span>';
    }).join("");
    var counts = { err: 0, warn: 0, note: 0 };
    state.problems.forEach(function (problem) {
      if (scope === "entity" && problem.entity !== current) return;
      counts[problem.sev] = (counts[problem.sev] || 0) + 1;
    });
    var unknown = stats.unknownSpells.length
      ? '<ul class="mini-list">' + stats.unknownSpells.map(function (spell) {
        return '<li><code>' + esc(spell) + "</code> — not in the built-in list; check the spelling or confirm it belongs to another mod</li>";
      }).join("") + '</ul>'
      : "<p class=\"hint\">No unknown spells.</p>";

    var entityBlocks = stats.entityList.map(function (entry) {
      var closed = state.statsOpen["entity:" + entry.id] === false;
      var schoolChips = entry.schools.map(function (school) {
        var label = (D.SCHOOL_LABELS || {})[school.school] || school.school;
        return '<span class="chip school-chip"><i style="background:' + esc(school.color) + '"></i>'
          + esc(label) + " · " + school.count + '</span>';
      }).join("");
      var rows = entry.variantList.map(function (item) {
        return variantRowHtml(entry, item);
      }).join("");
      var hay = [entry.id, entry.zh, entry.en, "Entities"].join(" ").toLowerCase();
      return '<div class="ent-stat' + (closed ? " folded" : "") + '" data-entity="' + esc(entry.id) + '"'
        + ' data-closed="' + (closed ? "1" : "0") + '" data-search="' + esc(hay) + '">'
        + '<div class="ent-head">'
        + '<button type="button" class="ent-chev" data-act="stats-fold" data-entity="' + esc(entry.id) + '"'
        + ' aria-expanded="' + (closed ? "false" : "true") + '"'
        + " aria-label=\"Expand / collapse details\" title=\"Expand / collapse details\">"
        + '<i class="chev" aria-hidden="true">▾</i></button>'
        + '<div class="ent-title">'
        + '<span class="ent-id">' + esc(entry.id) + '</span>'
        + (entry.zh ? '<span class="ent-zh">' + esc(entry.zh) + '</span>' : "")
        + '<span class="ent-num">' + entry.casts + plural(entry.casts, " spell", " spells") + " · " + entry.variants + plural(entry.variants, " variant", " variants") + "</span>"
        + '</div></div>'
        + '<div class="ent-body">'
        + "<div class=\"ent-facts\">Root active " + entry.rootGoals + " · triggers " + entry.rootTriggers
        + " · in variants " + entry.variantCasts + " · spells "
        + entry.spells.length + plural(entry.spells.length, " type", " types") + " · drops " + entry.drops + " / " + entry.dropRules + plural(entry.dropRules, " rule", " rules") + "</div>"
        + (schoolChips ? '<div class="chips">' + schoolChips + '</div>' : "")
        + (rows
          ? '<ul class="var-list">' + rows + '</ul>'
          : "<p class=\"hint var-empty\">No variants — every phase uses the root rules.</p>")
        + '</div></div>';
    }).join("");
    var packSection = stats.entityList.length
      ? "<h4 class=\"sub-title\">Mobs and variants</h4>"
        + '<div class="stats-search"><input id="stats-q" class="help-input" type="search"'
        + " placeholder=\"Search entity id / name / variant tag, e.g. wither, boss\" spellcheck=\"false\" autocomplete=\"off\">"
        + '<span class="hint" id="stats-count"></span></div>'
        + '<div class="ent-list">' + entityBlocks + '</div>'
        + "<p class=\"hint\" id=\"stats-empty\" hidden>No matching mobs or variants."
        + "Search by entity id (wither_skeleton), display name (wither skeleton) or variant tag (boss).</p>"
      : "<h4 class=\"sub-title\">Mobs and variants</h4><p class=\"hint\">No entities yet.</p>";

    /* 「当前实体」视图：根层一块 + 这个生物的变体清单，没有搜索框 */
    var one = stats.entityList[0] || null;
    var entitySection = scope === "entity"
      ? "<h4 class=\"sub-title\">Root rules</h4>"
      + '<div class="var-stat var-root"><div class="var-row var-row-static">'
      + '<span class="var-line">'
      + "<span class=\"var-idx\">Root</span>"
      + '<span class="var-sel">' + one.rootGoals + " active · " + one.rootTriggers + " triggers</span>"
      + "<span class=\"var-meta\">Used when no variant matches · spells " + one.rootSpells.length + plural(one.rootSpells.length, " type", " types") + "</span>"
      + '</span>'
      + schoolChipsHtml(schoolChipsOf(one.rootSpells))
      + '</div>'
      + spellGroupsHtml(one.rootGroups, "The root has no spells.")
      + '</div>'
      + '<div class="sub-head-row">'
      + "<h4 class=\"sub-title\">Variants</h4>"
      + '<span class="sub-acts">'
      + '<button type="button" class="mini-btn" data-act="stats-all" data-open="1"'
      + " title=\"Expand every variant's spell list\">Expand all</button>"
      + '<button type="button" class="mini-btn" data-act="stats-all" data-open="0"'
      + " title=\"Collapse every variant's spell list\">Collapse all</button>"
      + '</span></div>'
      + (one.variantList.length
        ? '<ul class="var-list stats-varlist">'
          + one.variantList.map(function (item) { return variantRowHtml(one, item); }).join("")
          + '</ul>'
        : "<p class=\"hint\">This mob has no variants — every phase uses the root rules.</p>")
      : packSection;

    var cards = scope === "entity"
      ? statCard(stats.casts, " spells", stats.goals + " active · " + stats.triggers + plural(stats.triggers, " trigger", " triggers"))
        + statCard(stats.spellCount, " spell types")
        + statCard(stats.variants, " variants")
        + statCard(stats.drops, " drops", stats.dropRules + plural(stats.dropRules, " rule", " rules"))
        + statCard(Math.round(stats.expected * 100) / 100, "Average drops", "Estimate including chance, excluding Looting")
        + statCard(one.rootGoals + one.rootTriggers, " root entries", one.rootGoals + " active · " + one.rootTriggers + plural(one.rootTriggers, " trigger", " triggers"))
      : statCard(stats.entities, " entities")
        + statCard(stats.casts, " spells", stats.goals + " active · " + stats.triggers + plural(stats.triggers, " trigger", " triggers"))
        + statCard(stats.spellCount, " spell types")
        + statCard(stats.variants, " variants")
        + statCard(stats.drops, " drops", stats.dropRules + plural(stats.dropRules, " rule", " rules"))
        + statCard(Math.round(stats.expected * 100) / 100, "Average drops", "Estimate including chance, excluding Looting");

    var schoolOpen = state.statsOpen["sec:schools"] !== false;
    return scopeBar
      + '<div class="stats-grid">' + cards + '</div>'
      + entitySection
      + '<section class="sub' + (schoolOpen ? "" : " folded") + '" data-sec="schools">'
      + '<h4 class="sub-title"><button type="button" class="sub-fold" data-act="stats-sec" data-sec="schools"'
      + ' aria-expanded="' + (schoolOpen ? "true" : "false") + "\" title=\"Click to collapse / expand the school breakdown\">"
      + "<i class=\"chev\" aria-hidden=\"true\">▾</i><span>School breakdown</span>"
      + '<span class="hint">' + stats.schoolList.length + " schools · click one to see its spells</span>"
      + '</button></h4>'
      + '<div class="sub-body">' + (schoolBars || "<p class=\"hint\">No spell entries yet.</p>") + '</div>'
      + '</section>'
      + "<h4 class=\"sub-title\">Cast types</h4>"
      + '<div class="chips">' + (typeChips || "<span class=\"hint\">None</span>") + '</div>'
      + "<h4 class=\"sub-title\">Risk</h4>"
      + '<div class="problem-summary">'
      + "<span class=\"sev err\">Errors " + counts.err + '</span>'
      + "<span class=\"sev warn\">Warnings " + counts.warn + '</span>'
      + "<span class=\"sev note\">Notes " + counts.note + '</span></div>'
      + "<h4 class=\"sub-title\">Spells outside the built-in list</h4>"
      + unknown;
  }

  function renderStats() {
    var body = $("#stats-body");
    if (!body) return;
    body.innerHTML = statsHtml();
    var box = $("#stats-q");
    if (box && box.value !== (state.statsQ || "")) box.value = state.statsQ || "";
    applyStatsFilter();
  }

  /**
   * 「统计 → 生物与变体」的搜索：只切 DOM 的 hidden，不重渲染，
   * 所以输入框的焦点和光标都不会丢。搜实体 id / 中文名 / 变体 tag / 变体里的法术 id。
   */
  function applyStatsFilter() {
    var host = $("#stats-body");
    if (!host) return;
    var query = String(state.statsQ || "").trim().toLowerCase();
    var blocks = host.querySelectorAll(".ent-stat");
    var entShown = 0;
    var varShown = 0;
    var varTotal = 0;
    for (var i = 0; i < blocks.length; i++) {
      var block = blocks[i];
      var headHit = !!query && (block.getAttribute("data-search") || "").indexOf(query) >= 0;
      var rows = block.querySelectorAll(".var-stat");
      var rowHit = 0;
      varTotal += rows.length;
      for (var j = 0; j < rows.length; j++) {
        var hit = !query || headHit || (rows[j].getAttribute("data-search") || "").indexOf(query) >= 0;
        rows[j].hidden = !hit;
        if (hit) rowHit++;
      }
      var show = !query || headHit || rowHit > 0;
      block.hidden = !show;
      if (show) entShown++;
      if (query) varShown += rowHit;
      var folded = !query && block.getAttribute("data-closed") === "1";
      block.classList.toggle("folded", folded);
      var chev = block.querySelector(".ent-chev");
      if (chev) chev.setAttribute("aria-expanded", folded ? "false" : "true");
    }
    var counter = $("#stats-count");
    if (counter) {
      counter.textContent = query
        ? "Matched " + entShown + "/" + blocks.length + plural(blocks.length, " entity", " entities") + " · " + varShown + plural(varShown, " variant", " variants")
        : blocks.length + plural(blocks.length, " entity", " entities") + " · " + varTotal + plural(varTotal, " variant", " variants");
    }
    var empty = $("#stats-empty");
    if (empty) empty.hidden = !query || entShown > 0;
  }

  /* -------------------------------------------------------- v2：模拟器 */

  function simUpdate() {
    var out = $("#sim-out");
    var ruleHost = state.project.entities[state.sim.id];
    if (!out || !isObj(ruleHost)) return;
    var snapshot = {
      healthFraction: state.sim.fraction,
      name: state.sim.name || null,
      tags: state.sim.tags ? state.sim.tags.split(",").map(function (part) { return part.trim(); }).filter(Boolean) : [],
      tamed: state.sim.tamed
    };
    var variants = isArr(ruleHost.variants) ? ruleHost.variants : [];
    var matched = -1;
    for (var i = 0; i < variants.length; i++) {
      if (isObj(variants[i]) && CORE.selectorMatches(variants[i].select, snapshot)) { matched = i; break; }
    }
    /* 滑杆只回答“当前血量命中哪一个”，不把以前拖到过的最深阶段带过来 ——
       sticky 的真实推进看下面的区间表（从满血掉到 0%）。 */
    var effective = matched;
    var sweep = CORE.phaseSweep(ruleHost, 100, snapshot);
    var walked = -1;
    for (var s = 0; s < sweep.length; s++) {
      if (Math.abs(sweep[s].healthFraction - state.sim.fraction) < 0.0051) { walked = sweep[s].locked; break; }
    }

    var data = CORE.effectiveRules(ruleHost, effective);
    var bossBar = CORE.bossBarFor(ruleHost, effective);
    var goals = isObj(data) && isArr(data.goals) ? data.goals : [];
    var goalRows = goals.length
      ? goals.map(function (cast) {
        return '<li><code>' + esc(cast.spell || "(no spell)") + '</code> '
          + esc(spellLabel(cast.spell)) + '</li>';
      }).join("")
      : "<li class=\"hint\">This phase has no active spells.</li>";
    // 21 个 5% 采样点相邻结果相同就并成一段：多数生物只剩 1–3 行，
    // 一眼能看出「从哪一档开始换变体」，不用读 21 行重复内容。
    var runs = [];
    CORE.phaseSweep(ruleHost, 20, snapshot).forEach(function (row) {
      var key = row.effective + "|" + row.locked;
      var last = runs[runs.length - 1];
      if (!last || last.key !== key) {
        runs.push({ key: key, from: row.healthFraction, to: row.healthFraction, effective: row.effective, locked: row.locked });
      } else {
        last.to = row.healthFraction;
      }
    });
    var rows = runs.map(function (run) {
      var here = state.sim.fraction <= run.from + 0.000001 && state.sim.fraction >= run.to - 0.000001;
      var name = run.effective < 0 ? "Species default"
        : ("Variant #" + run.effective + (isObj(variants[run.effective]) ? " · " + selectorSummary(variants[run.effective].select) : ""));
      var span = Math.round(run.from * 100) + "% – " + Math.round(run.to * 100) + "%";
      return '<tr class="' + (here ? "on" : "") + '"><td>' + span + '</td><td>' + esc(name) + '</td>'
        + '<td>' + (run.locked >= 0 ? "Locked #" + run.locked : "Not locked") + '</td></tr>';
    }).join("");

    out.innerHTML = '<div class="sim-now">'
      + '<div class="sim-verdict"><b>' + (effective < 0 ? "Species default rules" : "Variant #" + effective) + '</b>'
      + '<span>' + esc(effective < 0 ? "No variant matched" : selectorSummary(variants[effective].select)) + '</span></div>'
      + '<div class="sim-facts">'
      + "<div><span>Boss bar bossBar</span><b>" + (bossBar === null ? "Follow the presentation config" : (bossBar ? "Force show" : "Force hide")) + '</b></div>'
      + "<div><span>Current health match</span><b>" + (matched < 0 ? "Species default" : "#" + matched) + '</b></div>'
      + "<div><span>Locked when health falls here</span><b>" + (walked < 0 ? "Not locked" : "#" + walked) + '</b></div>'
      + "<div><span>Vanilla attacks</span><b>" + (CORE.disableAttackGoalsFor(ruleHost, effective) ? "Disable" : "Keep") + '</b></div>'
      + '</div>'
      + "<div class=\"group-title\">Active spells in this phase</div>"
      + '<ul class="mini-list">' + goalRows + '</ul>'
      + '</div>'
      + "<table class=\"sim-table\"><thead><tr><th>Health range</th><th>Active variant</th><th>Locked from full health</th></tr></thead>"
      + '<tbody>' + rows + '</tbody></table>';
  }

  /* 「播放」用的定时器：不挂在 state 里，免得进自动保存 / 撤销快照 */
  var simTimer = 0;
  var simPlayLast = "";

  function simPlayStop() {
    if (simTimer) { clearTimeout(simTimer); simTimer = 0; }
    simPlayLast = "";
    var button = $("#sim-play");
    if (button) button.textContent = "▶ Play";
  }

  /** 一次掉 1%。阶段换了就多停 700ms 并闪一下，能看清是在哪一格切的。 */
  function simPlayStep() {
    if (!state.sim) { simPlayStop(); return; }
    var next = Math.round((state.sim.fraction - 0.01) * 100) / 100;
    if (next < 0) { simPlayStop(); return; }
    state.sim.fraction = next;
    var hp = $("#sim-hp");
    if (hp) hp.value = String(Math.round(next * 100));
    var label = $("#sim-hp-label");
    if (label) label.textContent = Math.round(next * 100) + "%";
    simUpdate();
    var verdict = document.querySelector("#sim-out .sim-verdict b");
    var current = verdict ? verdict.textContent : "";
    var delay = 45;
    if (simPlayLast && current !== simPlayLast) {
      delay = 700;
      var card = document.querySelector("#sim-out .sim-verdict");
      if (card) {
        card.classList.remove("flash");
        void card.offsetWidth;
        card.classList.add("flash");
      }
    }
    simPlayLast = current;
    if (next <= 0) { simPlayStop(); return; }
    simTimer = setTimeout(simPlayStep, delay);
  }

  function simPlayToggle() {
    if (simTimer) { simPlayStop(); return; }
    if (!state.sim) return;
    if (state.sim.fraction <= 0) state.sim.fraction = 1;
    var button = $("#sim-play");
    if (button) button.textContent = "⏸ Pause";
    simPlayLast = "";
    simPlayStep();
  }

  /** 模拟器的控件部分；页签切回来时复用，不重建（滑杆位置和锁定的阶段都留着）。 */
  function simControlsHtml(ids, current) {
    return '<div class="sim-bar">'
      + "<label class=\"f\"><span>Entity</span><select id=\"sim-entity\">"
      + ids.map(function (id) {

      }).join("") + "</select></label>"
      + "<label class=\"f\"><span>Name</span><input id=\"sim-name\" placeholder=\"Empty = no custom name\" autocomplete=\"off\"></label>"
      + "<label class=\"f\"><span>Tags</span><input id=\"sim-tags\" placeholder=\"boss, phase2\" autocomplete=\"off\"></label>"
      + "<label class=\"f\"><span>Tamed</span><select id=\"sim-tamed\"><option value=\"\">false</option><option value=\"1\">true</option></select></label>"
      + "</div>"
      + '<div class="sim-hp-row">'
      + "<label class=\"f sim-hp\"><span>Health <b id=\"sim-hp-label\">100%</b></span>"
      + '<input type="range" id="sim-hp" min="0" max="100" step="1" value="100"></label>'
      + "<button class=\"btn mini\" id=\"sim-play\" data-act=\"sim-play\" title=\"Drop automatically from 100% to 0%, pausing at each phase change\">▶ Play</button>"
      + '</div>'
      + '<div id="sim-out"></div>'
      + "<p class=\"hint\">The slider only looks at which variant matches the current health; it keeps no history. The table below follows SpellCasterRules.effectiveIndex from full health down to 0%: adjacent 5% steps with the same result are merged, and a new row starts only when the active variant or lock state changes.</p>";
  }

  function bindSim() {
    var hp = $("#sim-hp");
    if (hp) {
      hp.addEventListener("input", function () {
        state.sim.fraction = Number(this.value) / 100;
        var label = $("#sim-hp-label");
        if (label) label.textContent = this.value + "%";
        simUpdate();
      });
    }
    var entity = $("#sim-entity");
    if (entity) {
      entity.addEventListener("change", function () {
        state.sim.id = this.value;
        simUpdate();
      });
    }
    ["#sim-name", "#sim-tags"].forEach(function (sel) {
      var input = $(sel);
      if (!input) return;
      input.addEventListener("input", function () {
        if (sel === "#sim-name") state.sim.name = this.value;
        else state.sim.tags = this.value;
        simUpdate();
      });
    });
    var tamed = $("#sim-tamed");
    if (tamed) {
      tamed.addEventListener("change", function () {
        state.sim.tamed = this.value === "1";
        simUpdate();
      });
    }
  }

  /** 模拟器页签：实体换了、或者页签第一次打开时才重建控件。 */
  function renderSim() {
    var body = $("#sim-body");
    if (!body) return;
    var ids = Object.keys(state.project.entities);
    if (!ids.length) {
      state.sim = null;
      body.innerHTML = "<p class=\"empty\">No entities yet. Create one with \"New\" on the left, or pick a template.</p>";
      return;
    }
    var picked = state.sim && ids.indexOf(state.sim.id) >= 0 ? state.sim.id
      : (state.selected && state.project.entities[state.selected] ? state.selected : ids[0]);
    var select = body.querySelector("#sim-entity");
    if (!state.sim || !select || state.sim.id !== picked || select.options.length !== ids.length) {
      simPlayStop();
      state.sim = { id: picked, fraction: 1, name: "", tags: "", tamed: false };
      body.innerHTML = simControlsHtml(ids, picked);
      bindSim();
    }
    simUpdate();
  }

  /* ---------------------------------------------------- v2：批量更改 */

  function eachRulesNode(rules, fn) {
    if (!isObj(rules)) return;
    fn(rules);
    if (CORE.isArr(rules.variants)) {
      rules.variants.forEach(function (variant) { if (isObj(variant)) fn(variant); });
    }
  }

  function eachCast(node, fn) {
    if (!isObj(node)) return;
    if (CORE.isArr(node.goals)) node.goals.forEach(function (cast) { if (isObj(cast)) fn(cast); });
    CORE.TRIGGERS.forEach(function (trigger) {
      if (isObj(node[trigger.key])) fn(node[trigger.key]);
    });
  }

  function batchDialog() {
    var ids = Object.keys(state.project.entities);
    if (!ids.length) {
      alert("Create an entity before using batch changes.");
      return;
    }
    openModal("Batch changes · " + ids.length + plural(ids.length, " entity", " entities"),
      "<p class=\"modal-note\">Every action only changes data in the current project. You can undo with Ctrl+Z.</p>"
      + "<h4 class=\"sub-title\">Add an active spell to every entity</h4>"

      + "<button class=\"btn\" data-act=\"apply-batch\" data-mode=\"add-goal\">Append to goals</button></div>"
      + "<p class=\"hint\">You can type a spell id from another mod or pick a built-in one. The new entry uses level 1 / cooldown 100 / priority 2; tune it afterwards.</p>"
      + "<h4 class=\"sub-title\">Set one numeric field on every spell entry</h4>"
      + "<div class=\"batch-row\"><span>cooldown</span><input id=\"batch-cooldown\" type=\"number\" placeholder=\"e.g. 100\" min=\"0\">"
      + "<button class=\"btn\" data-act=\"apply-batch\" data-mode=\"set-cooldown\">Apply cooldown</button></div>"
      + "<div class=\"batch-row\"><span>chance</span><input id=\"batch-chance\" type=\"number\" placeholder=\"e.g. 0.5\" min=\"0\" max=\"1\" step=\"0.05\">"
      + "<button class=\"btn\" data-act=\"apply-batch\" data-mode=\"set-chance\">Apply chance</button></div>"
      + "<h4 class=\"sub-title\">Replace a spell id everywhere</h4>"
      + "<div class=\"batch-row\"><input id=\"batch-from\" placeholder=\"Old id, e.g. irons_spellbooks:fireball\">"
      + "<input id=\"batch-to\" placeholder=\"New id, e.g. irons_spellbooks:meteor\">"
      + "<button class=\"btn\" data-act=\"apply-batch\" data-mode=\"replace-spell\">Replace</button></div>"
      + "<h4 class=\"sub-title\">Add sticky to every variant</h4>"
      + "<div class=\"batch-row\"><span>Lock the phase; falling health does not revert it</span>"
      + "<button class=\"btn\" data-act=\"apply-batch\" data-mode=\"sticky-variants\">Add sticky to all</button></div>"
      + spellDatalist());
  }

  function applyBatch(mode) {
    var changed = 0;
    var ids = Object.keys(state.project.entities);
    function valueOf(sel) {
      var input = $(sel);
      return input ? input.value : "";
    }
    var newSpell = "";
    if (mode === "add-goal") {
      newSpell = String(valueOf("#batch-spell") || "").trim();
      if (!newSpell) { toast("Enter a spell id first, then click Append to goals."); return; }
      if (!CORE.isId(newSpell)) {
        toast("\"" + newSpell + "\" is not shaped like namespace:path; the game will report an unknown spell.");
      }
    }
    ids.forEach(function (id) {
      var root = state.project.entities[id];
      // 追加 goals 只加在根层：变体的施法通常是要单独设计的，不该被批量灌进去。
      if (mode === "add-goal") {
        if (!isObj(root)) return;
        if (!isArr(root.goals)) root.goals = [];
        root.goals.push({ spell: newSpell, level: 1, cooldown: 100, priority: 2 });
        changed++;
        return;
      }
      eachRulesNode(root, function (node) {
        if (mode === "sticky-variants") {
          if (isArr(node.variants)) {
            node.variants.forEach(function (variant) {
              if (isObj(variant) && variant.sticky !== true) { variant.sticky = true; changed++; }
            });
          }
          return;
        }
        var raw = mode === "set-cooldown" ? valueOf("#batch-cooldown")
          : mode === "set-chance" ? valueOf("#batch-chance") : "";
        var number = mode === "set-cooldown" || mode === "set-chance" ? Number(raw) : NaN;
        if (mode === "set-cooldown" || mode === "set-chance") {
          if (!isFinite(number)) return;
          eachCast(node, function (cast) { cast[mode === "set-cooldown" ? "cooldown" : "chance"] = number; changed++; });
          return;
        }
        if (mode === "replace-spell") {
          var from = valueOf("#batch-from").trim();
          var to = valueOf("#batch-to").trim();
          if (!from || !to) return;
          eachCast(node, function (cast) {
            if (cast.spell === from) { cast.spell = to; changed++; }
          });
        }
      });
    });
    closeModal();
    renderAll();
    toast(changed ? ("Batch changes finished; " + changed + " edits made (Ctrl+Z to undo)") : "Nothing matched, so nothing changed");
  }

  function sortVariantsNow() {
    var id = state.selected;
    var rules = id ? state.project.entities[id] : null;
    if (!isObj(rules) || !isArr(rules.variants) || rules.variants.length < 2) return;
    rules.variants = CORE.sortVariants(rules.variants);
    renderAll();
    toast("Sorted by health: within each group, the deepest phase comes first");
  }

  /* -------------------------------------------------------------- 校验 */

  var CORE = root.SMGEN.CORE;

  /**
   * 校验全部实体。真正的判定在 core.js（与 Java 解析器逐条对应），
   * 这里只把诊断接到界面用的形状上。
   */
  function validate() {
    var problems = [];
    var project = state.project;

    if (!project.name) {
      problems.push({
        sev: "warn", entity: null, where: "pack.mcmeta",
        msg: "No data pack name set; the export will use my_spellmob_pack.", hint: ""
      });
    }

    var ids = Object.keys(project.entities);
    if (!ids.length) {
      problems.push({
        sev: "warn", entity: null, where: "pack.mcmeta",
        msg: "There are no entities; the exported zip will contain only pack.mcmeta.", hint: "Click \"New\" on the left to create a blank entity or pick a template."
      });
    }

    ids.forEach(function (id) {
      var file = entityFilePath(id);
      CORE.validateRules(rawJson(id), { entityId: id }).forEach(function (diag) {
        problems.push({
          sev: diag.sev,
          entity: id,
          path: diag.path || "",
          where: file + (diag.path ? " › " + diag.path : ""),
          msg: diag.msg,
          hint: diag.hint || "",
          fix: diag.fix || ""
        });
      });
    });

    state.problems = problems;
    return problems;
  }

  /* ------------------------------------------------------------ 交互动作 */

  var TEMPLATES = {
    phase: { title: "%s enters a new phase", phaseTicks: 40, shake: { duration: 15, radius: 16 }, burst: { radius: 4, color: "auto" } },
    summon: { entity: "minecraft:zombie", count: 2, radius: 3 }
  };

  function openModal(title, body) {
    $("#modal-title").textContent = title;
    $("#modal-body").innerHTML = body;
    $("#modal").hidden = false;
  }

  function closeModal() {
    $("#modal").hidden = true;
    $("#modal-body").innerHTML = "";
  }

  function ensureArray(path) {
    var node = getNode(path);
    if (!isArr(node)) {
      setNode(path, []);
      node = getNode(path);
    }
    return node;
  }

  function preparePath(path) {
    var marker = "/target/";
    var index = path.indexOf(marker);
    if (index < 0) return;
    var targetPath = path.slice(0, index + "/target".length);
    var node = getNode(targetPath);
    if (typeof node === "string") {
      setNode(targetPath, { type: node });
    }
  }

  function parseValue(type, raw) {
    var text = String(raw == null ? "" : raw).trim();
    if (type === "num") {
      if (!text) return undefined;
      var number = Number(text);
      return isFinite(number) ? number : undefined;
    }
    if (type === "tristate") {
      if (!text) return undefined;
      return text === "true";
    }
    if (type === "csv" || type === "csvarr" || type === "intcsv") {
      var parts = text.split(",").map(function (part) { return part.trim(); }).filter(function (part) { return part.length; });
      if (!parts.length) return undefined;
      if (type === "intcsv") {
        var numbers = parts.map(Number).filter(function (value) { return isFinite(value); });
        return numbers.length === 1 ? numbers[0] : numbers;
      }
      if (type === "csvarr" || parts.length > 1) return parts;
      return parts[0];
    }
    if (type === "vec3") {
      var coords = text.split(/[\s,]+/).map(Number).filter(function (value) { return isFinite(value); });
      if (coords.length < 3) return undefined;
      return [coords[0], coords[1], coords[2]];
    }
    if (!text) return undefined;
    return text;
  }

  function dropShadowedKeys(path) {
    if (/\/conditions\/(healthBelow|healthAbove)$/.test(path)) {
      delNode(path.replace("/conditions/", "/conditions/self/"));
    }
    if (/\/conditions\/(minTargetDistance|maxTargetDistance)$/.test(path)) {
      delNode(path.replace("/conditions/", "/conditions/target/"));
    }
  }

  function applyField(el) {
    var path = el.getAttribute("data-path");
    var type = el.getAttribute("data-type") || "text";
    var def = el.getAttribute("data-def");
    preparePath(path);
    var value = parseValue(type, el.value);
    if (value === undefined) {
      delNode(path);
    } else if (def != null && def !== "" && String(value) === def) {
      delNode(path);
    } else {
      setNode(path, value);
    }
    dropShadowedKeys(path);
    if (type === "vec3" && isArr(value) === false && String(el.value).trim() !== "") {
      el.classList.add("bad");
    } else {
      el.classList.remove("bad");
    }
  }

  function updateSpellLabel(path) {
    var container = path.replace(/\/spell$/, "");
    var nodes = document.querySelectorAll("[data-zhof]");
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].getAttribute("data-zhof") !== container) continue;
      var value = getNode(path);
      var known = spellInfo(value);
      nodes[i].textContent = spellLabel(value);
      nodes[i].classList.toggle("bad", !!value && !known);
      nodes[i].style.color = known ? CORE.schoolColor(known.school) : "";
    }
    var dots = document.querySelectorAll("[data-dotof]");
    for (var j = 0; j < dots.length; j++) {
      if (dots[j].getAttribute("data-dotof") !== container) continue;
      var info = spellInfo(getNode(path));
      dots[j].style.background = CORE.schoolColor(info ? info.school : "");
    }
  }

  function renameEntity(oldId, newId) {
    var entities = state.project.entities;
    var order = Object.keys(entities);
    var rebuilt = {};
    order.forEach(function (id) {
      if (id === oldId) rebuilt[newId] = entities[id];
      else rebuilt[id] = entities[id];
    });
    state.project.entities = rebuilt;
    if (state.selected === oldId) state.selected = newId;
    state.open = {};
    renderAll();
  }

  function onEntityIdChange(el) {
    var split = splitEntityId(el.value);
    if (!split) {
      el.classList.add("bad");
      return;
    }
    el.classList.remove("bad");
    if (split.full === state.selected) return;
    if (state.project.entities[split.full]) {
      alert("Already have " + split.full + ".");
      el.value = state.selected;
      return;
    }
    renameEntity(state.selected, split.full);
  }

      + "<div class=\"modal-acts\"><button class=\"btn primary\" data-act=\"confirm-add-entity\">Create blank entity</button>"

  function delEntityDialog() {

      "<p>Delete the entire file for <code>" + esc(state.selected) + "</code>?</p>"

  function doDelEntity() {
    var id = state.selected;
    if (!id) return;
    delete state.project.entities[id];
    state.selected = Object.keys(state.project.entities)[0] || null;
    state.open = {};
    closeModal();
    renderAll();
  }

  function dupEntity() {
    var id = state.selected;
    if (!id) return;
    var base = id + "_copy";
    var candidate = base;
    var serial = 2;
    while (state.project.entities[candidate]) {
      candidate = base + serial;
      serial++;
    }
    state.project.entities[candidate] = clone(state.project.entities[id]);
    state.selected = candidate;
    state.open = {};
    renderAll();
  }

  function usePreset(key) {
    var preset = null;
    D.PRESETS.forEach(function (entry) { if (entry.key === key) preset = entry; });
    if (!preset) return;
    if (state.project.entities[preset.entity]) {
      var choice = confirm(preset.entity + " already exists. Overwrite it?");
      if (!choice) return;
    }
    state.project.entities[preset.entity] = clone(preset.body);
    state.selected = preset.entity;
    state.open = {};
    closeModal();
    renderAll();
  }

  /* 打开工程：不给系统文件对话框当唯一入口 —— 它被浏览器拦下来时是完全无声的，
     所以这里先开一个自己的弹窗，里面既有原生 <label for> 触发的选择，也能直接拖文件进来。 */

  function openProjectDialog() {
    openModal("Open project",
      '<div class="pick-file" id="drop-zone">'
      + "<b>Drop a file here</b>"
      + "<span class=\"hint\">or</span>"
      + "<label class=\"btn primary\" for=\"file-input\">Choose file…</label>"
      + '<input id="drop-input" class="sr-only" type="file" accept=".json,application/json">'
      + '</div>'
      + '<ul class="mini-list">'
      + "<li><code>*.project.json</code> — a project saved by this tool; v1.0.0 projects and SpellMob Studio projects also load</li>"
      + "<li><code>zombie.json</code> — a single entity file; the file name is the entity id (the kind found in <code>data/&lt;ns&gt;/spell_casters/</code>)</li>"
      + "<li>A zip cannot be imported directly; unzip it and load one of the JSON files.</li>"
      + '</ul>');
    var zone = $("#drop-zone");
    if (!zone) return;
    zone.addEventListener("dragover", function (event) {
      event.preventDefault();
      zone.classList.add("over");
    });
    zone.addEventListener("dragleave", function () { zone.classList.remove("over"); });
    zone.addEventListener("drop", function (event) {
      event.preventDefault();
      zone.classList.remove("over");
      var file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
      if (file) readProjectFile(file);
    });
    var dropInput = $("#drop-input");
    if (dropInput) {
      dropInput.addEventListener("change", function () {
        var file = this.files && this.files[0];
        if (file) readProjectFile(file);
        this.value = "";
      });
    }
  }

  function dragHasFiles(dataTransfer) {
    var types = dataTransfer.types;
    if (!types) return false;
    for (var i = 0; i < types.length; i++) if (types[i] === "Files") return true;
    return false;
  }

  function readProjectFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      closeModal();
      importText(String(reader.result), file.name);
    };
    reader.onerror = function () { alert("Cannot read this file: " + file.name); };
    reader.readAsText(file, "utf-8");
  }

  function saveProject() {
    var out = {
      app: "spellmob-datapack-generator",
      format: 1,
      name: state.project.name || "my_spellmob_pack",
      mcVersion: state.project.mcVersion,
      outputMode: state.project.outputMode,
      entities: state.project.entities
    };
    var fileName = (state.project.name || "my_spellmob_pack") + ".project.json";
    var text = JSON.stringify(out, null, 2) + "\n";
    download(fileName, new Blob([text], { type: "application/json" }));
    toast("Saved project " + fileName + " (" + Object.keys(state.project.entities).length + plural(Object.keys(state.project.entities).length, " entity", " entities") + ")");
  }

  function exportZip() {
    exportPreview();
  }

  function loadProject(data) {
    state.project = {
      name: typeof data.name === "string" && data.name ? data.name : "my_spellmob_pack",
      mcVersion: D.PACK_FORMATS[data.mcVersion] ? data.mcVersion : "1.20.1",
      outputMode: data.outputMode === "full" ? "full" : "min",
      entities: {}
    };
    var entities = isObj(data.entities) ? data.entities : {};
    Object.keys(entities).forEach(function (id) {
      if (isObj(entities[id])) state.project.entities[id] = entities[id];
    });
    state.selected = Object.keys(state.project.entities)[0] || null;
    state.open = {};
    renderAll();
  }

  function importText(text, filename) {
    var data;
    try {
      data = JSON.parse(text);
    } catch (error) {
      alert("Invalid JSON: " + error.message);
      return;
    }
    if (!isObj(data)) {
      alert("Unrecognized JSON.");
      return;
    }
    if (data.app === "spellmob-datapack-generator" || (isObj(data.entities) && data.format === 1)) {
      loadProject(data);
      return;
    }
    if (isObj(data.pack) && data.pack.pack_format != null) {
      alert("This is pack.mcmeta, not an entity file.");
      return;
    }
    var base = String(filename || "").replace(/\.json$/i, "");
    var split = splitEntityId(base);
    if (!split) {
      alert("The file name is not a valid entity id, so the mob cannot be identified.");
      return;
    }
    if (state.project.entities[split.full] && !confirm("Overwrite the existing " + split.full + "?")) return;
    state.project.entities[split.full] = data;
    state.selected = split.full;
    state.open = {};
    renderAll();
  }

  function onAction(name, el) {
    var path = el.getAttribute("data-path");
    switch (name) {
      case "tab":
        state.tab = el.getAttribute("data-tab");
        renderPanes();
        return;
      case "fold": {
        var key = el.getAttribute("data-key");
        var box = el.closest ? el.closest(".foldable") : null;
        if (!key || !box) return;
        var folded = !box.classList.contains("folded");
        box.classList.toggle("folded", folded);
        state.open[key] = !folded;
        if (el.setAttribute) el.setAttribute("aria-expanded", folded ? "false" : "true");
        return;
      }
      case "select-entity":
        state.selected = el.getAttribute("data-id");
        state.open = {};
        state.jsonHl = null;
        renderAll();
        return;
      case "add-entity": addEntityDialog(); return;
      case "confirm-add-entity": doAddEntity(); return;
      case "del-entity": delEntityDialog(); return;
      case "confirm-del-entity": doDelEntity(); return;
      case "dup-entity": dupEntity(); return;
      case "use-preset": usePreset(el.getAttribute("data-key")); return;
      case "open-project": openProjectDialog(); return;
      case "save-project": saveProject(); return;
      case "export-zip": exportZip(); return;
      case "modal-close": closeModal(); return;
      case "del": delNode(path); renderAll(); return;
      case "drop-variant-drops": {
        delNode(path + "/dropRules");
        renderAll();
        toast("Removed drops from phase variants");
        return;
      }
      case "drop-conditions-health": {
        delNode(path + "/healthBelow");
        delNode(path + "/healthAbove");
        delNode(path + "/self/healthBelow");
        delNode(path + "/self/healthAbove");
        renderAll();
        toast("Removed duplicate health conditions from spells");
        return;
      }
      case "dup": dupNode(path); renderAll(); return;
      case "variant-up": moveNode(path, -1); renderAll(); return;
      case "variant-down": moveNode(path, 1); renderAll(); return;
      case "variants-expand":
      case "variants-collapse": {
        var expandAll = name === "variants-expand";
        var boxes = document.querySelectorAll("#editor .variant[data-vindex]");
        for (var b = 0; b < boxes.length; b++) {
          state.open["variant:" + path + "/" + boxes[b].getAttribute("data-vindex")] = expandAll;
          boxes[b].classList.toggle("folded", !expandAll);
          var toggle = boxes[b].querySelector(".variant-toggle");
          if (toggle) toggle.setAttribute("aria-expanded", expandAll ? "true" : "false");
        }
        return;
      }
      case "add-goal": {
        var goals = ensureArray(path);
        goals.push(defaultCast());
        state.open[foldKey("cast", path + "/" + (goals.length - 1))] = true;
        renderAll();
        return;
      }
      case "add-variant": {
        var variantList = ensureArray(path);
        var freshVariant = { select: { healthBelow: 0.5 } };
        variantList.push(freshVariant);
        var sortedList = CORE.sortVariants(variantList);
        variantList.length = 0;
        Array.prototype.push.apply(variantList, sortedList);
        state.open["card:variants"] = true;
        renderAll();
        var placedAt = sortedList.indexOf(freshVariant);
        toast("New variant inserted at " + (placedAt + 1) + " (# " + placedAt + ")");
        return;
      }
      // 新条目显式写 looting:false：不然有人在别的条目上开了抢夺，容易以为新加的也吃
      case "add-drop-rule": ensureArray(path).push({ drops: [{ item: "minecraft:emerald", looting: false }] }); renderAll(); return;
      case "add-drop": ensureArray(path).push({ item: "minecraft:emerald", looting: false }); renderAll(); return;
      case "set-trigger":
        setNode(path, defaultCast());
        state.open[foldKey("cast", path)] = true;
        renderAll();
        return;
      case "set-node": setNode(path, clone(TEMPLATES[el.getAttribute("data-template")] || {})); renderAll(); return;
      case "undo": undo(); return;
      case "redo": redo(); return;
      case "sim-play": simPlayToggle(); return;
      case "stats": state.tab = "stats"; renderPanes(); return;
      case "sim": state.tab = "sim"; renderPanes(); return;
      case "jump": jumpToSection(el.getAttribute("data-sec")); return;
      case "goto-problem": gotoProblem(Number(el.getAttribute("data-i"))); return;
      case "problem-filter": state.problemFilter = el.getAttribute("data-filter") || "all"; renderProblems(); return;
      case "fix-problem": runFixes([Number(el.getAttribute("data-i"))]); return;
      case "fix-all": {
        var fixRows = [];
        state.problems.forEach(function (problem, index) { if (problem.fix) fixRows.push(index); });
        runFixes(fixRows);
        return;
      }
      case "stats-scope": {
        state.statsScope = el.getAttribute("data-scope") === "pack" ? "pack" : "entity";
        renderStats();
        return;
      }
      case "stats-school": {
        var school = el.getAttribute("data-school");
        if (!school) return;
        state.statsOpen[school] = !state.statsOpen[school];
        renderStats();
        return;
      }
      case "stats-fold": {
        var foldBlock = el.closest ? el.closest(".ent-stat") : null;
        if (!foldBlock) return;
        var foldId = foldBlock.getAttribute("data-entity") || "";
        var folded = !foldBlock.classList.contains("folded");
        foldBlock.classList.toggle("folded", folded);
        foldBlock.setAttribute("data-closed", folded ? "1" : "0");
        var foldChev = foldBlock.querySelector(".ent-chev");
        if (foldChev) foldChev.setAttribute("aria-expanded", folded ? "false" : "true");
        state.statsOpen["entity:" + foldId] = !folded;
        return;
      }
      case "stats-var-fold": {
        var varBlock = el.closest ? el.closest(".var-stat") : null;
        if (!varBlock) return;
        var varFolded = !varBlock.classList.contains("folded");
        varBlock.classList.toggle("folded", varFolded);
        el.setAttribute("aria-expanded", varFolded ? "false" : "true");
        state.statsOpen["var:" + el.getAttribute("data-entity") + ":" + el.getAttribute("data-index")] = !varFolded;
        return;
      }
      case "stats-all": {
        /* 只切现有的 DOM：不重渲染，按钮不会失效、滚动位置也不会跳 */
        var openAll = el.getAttribute("data-open") === "1";
        var allRows = document.querySelectorAll("#stats-body .var-row[data-act='stats-var-fold']");
        Array.prototype.forEach.call(allRows, function (row) {
          var allBox = row.closest ? row.closest(".var-stat") : null;
          if (!allBox) return;
          allBox.classList.toggle("folded", !openAll);
          row.setAttribute("aria-expanded", openAll ? "true" : "false");
          state.statsOpen["var:" + row.getAttribute("data-entity") + ":" + row.getAttribute("data-index")] = openAll;
        });
        return;
      }
      case "stats-sec": {
        var secBox = el.closest ? el.closest(".sub") : null;
        if (!secBox) return;
        var secFolded = !secBox.classList.contains("folded");
        secBox.classList.toggle("folded", secFolded);
        el.setAttribute("aria-expanded", secFolded ? "false" : "true");
        state.statsOpen["sec:" + el.getAttribute("data-sec")] = !secFolded;
        return;
      }
      case "batch": batchDialog(); return;
      case "confirm-export": downloadZip(); return;
      case "spell-picker": spellPickerDialog(path); return;
      case "pick-spell": pickSpell(el.getAttribute("data-spell")); return;
      case "sort-variants": sortVariantsNow(); return;
      case "apply-batch": applyBatch(el.getAttribute("data-mode")); return;
      default: return;
    }
  }

  function dupNode(path) {
    var parent = parentOf(path);
    if (!parent || !isArr(parent.node)) return;
    var index = Number(parent.key);
    if (isNaN(index) || index < 0 || index >= parent.node.length) return;
    parent.node.splice(index + 1, 0, clone(parent.node[index]));
  }

  function moveNode(path, delta) {
    var parent = parentOf(path);
    if (!parent || !isArr(parent.node)) return;
    var index = Number(parent.key);
    var target = index + delta;
    if (isNaN(index) || target < 0 || target >= parent.node.length) return;
    var moved = parent.node.splice(index, 1)[0];
    parent.node.splice(target, 0, moved);
  }

  /* -------------------------------------------------------------- 事件 */

  function onInput(event) {
    var el = event.target;
    if (!el || typeof el.getAttribute !== "function") return;
    var path = el.getAttribute("data-path");
    if (!path || el.tagName === "SELECT") return;
    applyField(el);
    if (/\/spell$/.test(path)) updateSpellLabel(path);
    sync();
  }

  function onChange(event) {
    var el = event.target;
    if (!el || typeof el.getAttribute !== "function") return;
    if (el.getAttribute("data-role") === "entity-id") {
      onEntityIdChange(el);
      return;
    }
    if (!el.getAttribute("data-path")) return;
    if (el.tagName !== "SELECT") return;
    applyField(el);
    renderAll();
  }

  function onToggle(event) {
    var details = event.target;
    if (!details || typeof details.getAttribute !== "function") return;
    var key = details.getAttribute("data-open");
    if (!key) return;
    state.open[key] = details.open;
  }

  /* ------------------------------------------- 左右两栏拖动拉伸 */

  var LAYOUT_KEY = STORAGE_KEY + ".layout";
  var layoutDrag = null;
  var SIDE_MIN_LEFT = 176;
  var SIDE_MIN_RIGHT = 260;

  function defaultWidths() {
    var cs = window.getComputedStyle(document.documentElement);
    return {
      left: parseFloat(cs.getPropertyValue("--base-left")) || 236,
      right: parseFloat(cs.getPropertyValue("--base-right")) || 384
    };
  }

  function panelWidth(side) {
    var el = side === "left" ? $("#sidebar") : $("#inspect");
    return el ? Math.round(el.getBoundingClientRect().width) : 0;
  }

  function limitLeft(px) {
    var max = Math.max(SIDE_MIN_LEFT, window.innerWidth - 200);
    return Math.min(max, Math.max(SIDE_MIN_LEFT, Math.round(px)));
  }

  function limitRight(px) {
    var max = Math.max(SIDE_MIN_RIGHT, window.innerWidth - 8);
    return Math.min(max, Math.max(SIDE_MIN_RIGHT, Math.round(px)));
  }

  function applyWidths(left, right, persist) {
    var style = document.documentElement.style;
    style.setProperty("--w-left", limitLeft(left) + "px");
    style.setProperty("--w-right", limitRight(right) + "px");
    if (persist) persistLayout();
  }

  function persistLayout() {
    try {
      window.localStorage.setItem(LAYOUT_KEY, JSON.stringify({
        left: panelWidth("left"),
        right: panelWidth("right")
      }));
    } catch (error) { /* 隐私模式下写不进去就当没记 */ }
  }

  function restoreLayout() {
    var saved = null;
    try { saved = JSON.parse(window.localStorage.getItem(LAYOUT_KEY) || "null"); } catch (error) { saved = null; }
    if (!saved || typeof saved.left !== "number" || typeof saved.right !== "number") return;
    applyWidths(saved.left, saved.right, false);
  }

  /** 两个把手：拖动跟手、方向键微调、双击/回车回到默认宽度。 */
  function bindSplitters() {
    ["left", "right"].forEach(function (side) {
      var handle = document.getElementById("split-" + side);
      if (!handle) return;

      handle.addEventListener("pointerdown", function (event) {
        if (event.button != null && event.button !== 0) return;
        event.preventDefault();
        layoutDrag = {
          side: side,
          x: event.clientX,
          pointerId: event.pointerId,
          left: panelWidth("left"),
          right: panelWidth("right")
        };
        handle.classList.add("dragging");
        document.body.classList.add("col-resizing");
        if (handle.setPointerCapture && event.pointerId != null) {
          try { handle.setPointerCapture(event.pointerId); } catch (error) { /* 老浏览器没有捕获 */ }
        }
      });

      /* 移动和松手都挂到 window 上：万一 setPointerCapture 不可用，指针跑出 9px 宽的把手也不会丢 */

      window.addEventListener("pointermove", function (event) {
        if (!layoutDrag || layoutDrag.side !== side) return;
        var delta = event.clientX - layoutDrag.x;
        if (side === "left") applyWidths(layoutDrag.left + delta, layoutDrag.right, false);
        else applyWidths(layoutDrag.left, layoutDrag.right - delta, false);
      });

      function stopDrag() {
        if (!layoutDrag || layoutDrag.side !== side) return;
        layoutDrag = null;
        handle.classList.remove("dragging");
        document.body.classList.remove("col-resizing");
        persistLayout();
      }
      window.addEventListener("pointerup", stopDrag);
      window.addEventListener("pointercancel", stopDrag);

      handle.addEventListener("dblclick", function () {
        var base = defaultWidths();
        applyWidths(base.left, base.right, true);
      });

      handle.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          var base = defaultWidths();
          applyWidths(base.left, base.right, true);
          return;
        }
        var step = event.shiftKey ? 64 : 16;
        var delta = 0;
        if (event.key === "ArrowLeft") delta = side === "left" ? -step : step;
        else if (event.key === "ArrowRight") delta = side === "left" ? step : -step;
        else return;
        event.preventDefault();
        if (side === "left") applyWidths(panelWidth("left") + delta, panelWidth("right"), true);
        else applyWidths(panelWidth("left"), panelWidth("right") + delta, true);
      });
    });

    window.addEventListener("resize", function () {
      var base = defaultWidths();
      applyWidths(panelWidth("left") || base.left, panelWidth("right") || base.right, false);
    });
  }

  function bindEvents() {
    document.addEventListener("click", function (event) {
      var el = event.target.closest ? event.target.closest("[data-act]") : null;
      if (!el) return;
      event.preventDefault();
      onAction(el.getAttribute("data-act"), el);
    });
    document.addEventListener("input", onInput);
    document.addEventListener("change", onChange);
    document.addEventListener("toggle", onToggle, true);
    /* 把文件拖到窗口里别的地方时，别让浏览器直接跳去打开它（那样会离开这个页面） */
    window.addEventListener("dragover", function (event) {
      if (event.dataTransfer && dragHasFiles(event.dataTransfer)) event.preventDefault();
    });
    window.addEventListener("drop", function (event) {
      if (!event.dataTransfer || !dragHasFiles(event.dataTransfer)) return;
      event.preventDefault();
      var zone = $("#drop-zone");
      if (zone && zone.contains(event.target)) return;
      toast("To import a file, click Open project in the top bar, then drop the file into that box.");
    });
    var search = $("#entity-search");
    if (search) {
      search.addEventListener("input", function () {
        state.search = this.value;
        renderSidebar();
      });
    }
    var helpBox = $("#help-q");
    if (helpBox) {
      helpBox.value = state.helpQ || "";
      helpBox.addEventListener("input", function () {
        state.helpQ = this.value;
        var body = $("#help-body");
        if (body) body.innerHTML = renderHelp();
      });
    }
    /* #stats-q / #stats-body 都是整块 innerHTML 重建的，所以监听挂在 document 上 */
    document.addEventListener("input", function (event) {
      var target = event.target;
      if (!target || target.id !== "stats-q") return;
      state.statsQ = target.value;
      applyStatsFilter();
    });
    document.addEventListener("keydown", function (event) {
      var tag = (event.target && event.target.tagName) || "";
      var typing = tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA";
      var mod = event.ctrlKey || event.metaKey;
      var key = String(event.key || "").toLowerCase();
      if (key === "escape") {
        var modal = $("#modal");
        if (modal && !modal.hidden) { event.preventDefault(); closeModal(); }
        return;
      }
      if ((key === "enter" || key === " ") && !typing && event.target && event.target.getAttribute
        && KEY_ACTS[event.target.getAttribute("data-act")]) {
        event.preventDefault();
        onAction(event.target.getAttribute("data-act"), event.target);
        return;
      }
      if (!mod) {
        if (key === "/" && !typing) {
          event.preventDefault();
          var box = $("#entity-search");
          if (box) box.focus();
        }
        return;
      }
      if (key === "z" && !event.shiftKey) { event.preventDefault(); undo(); return; }
      if ((key === "z" && event.shiftKey) || key === "y") { event.preventDefault(); redo(); return; }
      if (key === "s") { event.preventDefault(); saveProject(); return; }
      if (key === "e" && event.shiftKey) { event.preventDefault(); exportZip(); return; }
      if (key === "k" && event.shiftKey) {
        event.preventDefault();
        var focus = $("#entity-search");
        if (focus) focus.focus();
        return;
      }
    });
    var fileInput = $("#file-input");
    if (fileInput) {
      fileInput.addEventListener("change", function () {
        var file = this.files && this.files[0];
        if (!file) return;
        readProjectFile(file);
        this.value = "";
      });
    }
    window.addEventListener("error", function (event) {
      showFatal(event.message || "Unknown error");
    });
  }

  function showFatal(message) {
    var box = $("#fatal");
    if (!box) return;
    box.hidden = false;
    box.textContent = "Page script error: " + message;
  }

  /* -------------------------------------------------------------- 渲染入口 */

    validate();
    renderTop();
    renderSidebar();
    renderEditor();
    renderPanes();
    renderJson();
    renderProblems();
    renderFiles();
    historyRecord();
    scheduleSave();

  function sync() {
    validate();
    renderSidebar();
    renderJson();

  function init() {
    $("#ver").textContent = "v" + D.version + " · aligned with SpellMob " + D.modVersion + " parser";
    $("#spell-list").innerHTML = spells().map(function (entry) {
      return '<option value="' + esc(entry.id) + '">' + esc(entry.en || entry.zh) + '</option>';
    }).join("");
    $("#entity-id-list").innerHTML = (D.ENTITIES || []).map(function (entry) {
      return '<option value="' + esc(entry.id) + '">' + esc(entry.en + (entry.group ? " · " + entry.group : "")) + '</option>';
    }).join("");
    $("#help-body").innerHTML = renderHelp();
