<script>
/**
 * SpellMob 数据包生成器 · 纯逻辑层
 *
 * 这里不碰 DOM，浏览器与 Node 共用：
 *   浏览器  index.html 里 data.js 之后、app.js 之前加载
 *   Node    require('./core.js') 前先 require('./data.js')
 *
 * 所有校验都与 src/main/java/spellmob/data/*.java 的实际解析行为逐条对应，
 * 不按 docs/spell_casters.schema.json。每条诊断都标了严重度：
 *   err  解析器抛异常，这条规则/这份文件不会生效
 *   warn 解析器会 log 一条警告，或者会悄悄夹取/替换成别的值
 *   note 不会失败，但作者大概率不是这个意思
 */
(function (root) {
  "use strict";

  var C = {};

  function data() {
    return (root.SMGEN && root.SMGEN.DATA) || {};
  }

  /* ------------------------------------------------------------------ 工具 */

  C.clone = function (value) {
    return JSON.parse(JSON.stringify(value === undefined ? null : value));
  };

  C.isObj = function (value) {
    return !!value && typeof value === "object" && !Array.isArray(value);
  };

  C.isArr = Array.isArray;

  C.isNum = function (value) {
    return typeof value === "number" && isFinite(value);
  };

  C.ID_RE = /^[a-z0-9_.-]+:[a-z0-9_./-]+$/;

  C.isId = function (value) {
    return C.ID_RE.test(String(value == null ? "" : value));
  };

  C.splitEntityId = function (id) {
    var raw = String(id == null ? "" : id).trim();
    if (!raw) return null;
    var ns = "minecraft";
    var path = raw;
    var colon = raw.indexOf(":");
    if (colon >= 0) {
      ns = raw.slice(0, colon);
      path = raw.slice(colon + 1);
    }
    if (!/^[a-z0-9_.-]+$/.test(ns) || !/^[a-z0-9_./-]+$/.test(path)) return null;
    return { ns: ns, path: path, full: ns + ":" + path };
  };

  C.entityFilePath = function (id) {
    var split = C.splitEntityId(id);
    if (!split) return "(invalid entity id)";
    return "data/" + split.ns + "/spell_casters/" + split.path + ".json";
  };

  C.entityIdForPath = function (path) {
    var match = /^data\/([^/]+)\/spell_casters\/(.+)\.json$/.exec(String(path));
    return match ? match[1] + ":" + match[2] : null;
  };

  function asList(value) {
    return C.isArr(value) ? value : [value];
  }

  function enumIds(list) {
    var ids = [];
    (list || []).forEach(function (entry) {
      ids.push(entry.id);
    });
    return ids;
  }

  C.enumHas = function (list, value) {
    for (var i = 0; i < (list || []).length; i++) {
      if (list[i].id === value) return true;
    }
    return false;
  };

  /* -------------------------------------------------------------- 序列化 */

  /** 去掉空值、空数组、空对象，得到真正写进文件的 JSON。 */
  C.clean = function clean(value) {
    if (C.isArr(value)) {
      var array = [];
      for (var i = 0; i < value.length; i++) {
        var item = clean(value[i]);
        if (item !== undefined) array.push(item);
      }
      return array.length ? array : undefined;
    }
    if (C.isObj(value)) {
      var out = {};
      var keys = Object.keys(value);
      for (var k = 0; k < keys.length; k++) {
        var cleaned = clean(value[keys[k]]);
        if (cleaned !== undefined) out[keys[k]] = cleaned;
      }
      return Object.keys(out).length ? out : undefined;
    }
    if (value === null || value === undefined || value === "") return undefined;
    if (typeof value === "number" && !isFinite(value)) return undefined;
    return value;
  };

  C.TRIGGERS = [
    { key: "onHurt", label: "Hurt onHurt" },
    { key: "onTarget", label: "Target acquired onTarget" },
    { key: "onDeath", label: "Death onDeath" },
    { key: "onKill", label: "Kill onKill" }
  ];

  C.expandCast = function (cast) {
    if (!C.isObj(cast)) return;
    var defs = data().CAST_DEFAULTS || {};
    Object.keys(defs).forEach(function (key) {
      if (cast[key] === undefined) cast[key] = defs[key];
    });
    if (cast.target == null) {
      cast.target = { type: "ATTACK_TARGET" };
    } else if (typeof cast.target === "string") {
      cast.target = { type: cast.target };
    } else if (C.isObj(cast.target) && cast.target.type == null) {
      cast.target.type = "ATTACK_TARGET";
    }
  };

  C.expandAll = function (node) {
    if (!C.isObj(node)) return;
    if (C.isArr(node.goals)) node.goals.forEach(C.expandCast);
    C.TRIGGERS.forEach(function (trigger) {
      if (C.isObj(node[trigger.key])) C.expandCast(node[trigger.key]);
    });
    if (C.isArr(node.variants)) {
      node.variants.forEach(function (variant) {
        if (C.isObj(variant)) C.expandAll(variant);
      });
    }
  };

  /** 一个实体的规则 → 写进文件的 JSON（min 只留填过的，full 补齐默认值）。 */
  C.rulesToJson = function (rules, outputMode) {
    var copy = C.clone(rules || {});
    if (outputMode === "full") C.expandAll(copy);
    return C.clean(copy) || {};
  };

  C.packMeta = function (project) {
    var formats = data().PACK_FORMATS || {};
    var format = formats[project.mcVersion] || 15;
    return {
      pack: {
        pack_format: format,
        description: project.name || "SpellMob spells"
      }
    };
  };

  C.buildFiles = function (project) {
    var files = [];
    files.push({ path: "pack.mcmeta", text: JSON.stringify(C.packMeta(project), null, 2) + "\n" });
    Object.keys(project.entities || {}).forEach(function (id) {
      if (!C.splitEntityId(id)) return;
      files.push({
        path: C.entityFilePath(id),
        text: JSON.stringify(C.rulesToJson(project.entities[id], project.outputMode), null, 2) + "\n"
      });
    });
    return files;
  };

  /* ------------------------------------------------------------ 工程文件 */

  C.newProject = function (name) {
    return {
      app: "spellmob-datapack-generator",
      format: 1,
      name: name || "my_spellmob_pack",
      mcVersion: "1.20.1",
      outputMode: "min",
      entities: {}
    };
  };

  C.newRules = function (spellId) {
    return {
      goals: [
        { spell: spellId || "irons_spellbooks:magic_arrow", level: 1, cooldown: 100, priority: 2, castTime: 20 }
      ]
    };
  };

  /**
   * 读工程文件。认两种形状：
   *   本工具 v1/v2：{ app, format, name, mcVersion, outputMode, entities: { id: rules } }
   *   Studio 1.x  ：{ name, namespace, packFormat, description, outputMode, entities: [{ id, rules }] }
   * 只做结构归一，不做校验——校验交给 validateRules。
   */
  C.normalizeProject = function (json) {
    var notices = [];
    if (!C.isObj(json)) return { project: null, notices: [{ sev: "err", msg: "is not a JSON object." }] };
    var entities = {};
    if (C.isArr(json.entities)) {
      json.entities.forEach(function (entity) {
        if (C.isObj(entity) && typeof entity.id === "string") {
          entities[entity.id] = C.isObj(entity.rules) ? entity.rules : {};
        } else {
          notices.push({ sev: "warn", msg: "An entry in entities has no id and was skipped." });
        }
      });
    } else if (C.isObj(json.entities)) {
      Object.keys(json.entities).forEach(function (id) {
        entities[id] = C.isObj(json.entities[id]) ? json.entities[id] : {};
      });
    } else if (C.isObj(json.spellMobRules)) {
      notices.push({ sev: "note", msg: "This looks like a standalone rules file; imported as 1 entity." });
      entities[json.entityId || "minecraft:zombie"] = json.spellMobRules;
    } else {
      // 也可能是直接一份 spell_casters 规则：有 goals / variants 之类的键
      var looksLikeRules = ["goals", "variants", "onHurt", "onTarget", "onDeath", "onKill", "dropRules", "disableAttackGoals"].some(function (key) {
        return json[key] !== undefined;
      });
      if (!looksLikeRules) {
        return { project: null, notices: [{ sev: "err", msg: "Unrecognized file: it has no entities and does not look like a spell_casters rules file." }] };
      }
      notices.push({ sev: "note", msg: "This is a standalone spell_casters rules file; imported as 1 entity (change the entity id yourself)." });
      entities[json.entityId || "minecraft:zombie"] = json;
      delete entities[json.entityId || "minecraft:zombie"].entityId;
    }

    var formats = data().PACK_FORMATS || {};
    var mcVersion = json.mcVersion;
    if (!mcVersion && json.packFormat != null) {
      Object.keys(formats).forEach(function (version) {
        if (formats[version] === json.packFormat) mcVersion = version;
      });
      if (!mcVersion) notices.push({ sev: "warn", msg: "pack_format " + json.packFormat + " is not a known version; treated as 1.20.1." });
    }
    if (!mcVersion || !formats[mcVersion]) mcVersion = "1.20.1";
    if (json.outputMode !== "full" && json.outputMode !== "min" && json.outputMode !== undefined) {
      notices.push({ sev: "warn", msg: "Unknown output mode '" + json.outputMode + "', treated as min." });
    }
    var project = {
      app: "spellmob-datapack-generator",
      format: 1,
      name: String(json.name || "my_spellmob_pack"),
      mcVersion: mcVersion,
      outputMode: json.outputMode === "full" ? "full" : "min",
      entities: entities
    };
    if (json.namespace && json.namespace !== "minecraft") {
      notices.push({ sev: "note", msg: "The namespace '" + json.namespace + "' in the file will not rewrite entity ids: this tool's folder follows the entity id's namespace." });
    }
    return { project: project, notices: notices };
  };

  C.serializeProject = function (project) {
    return {
      app: "spellmob-datapack-generator",
      format: 1,
      name: project.name,
      mcVersion: project.mcVersion,
      outputMode: project.outputMode,
      entities: project.entities
    };
  };

  /* -------------------------------------------------------------- 校验 */

  var ID_RE = C.ID_RE;

  var CAST_KEYS = ["spell", "level", "cooldown", "priority", "range", "target", "castTime",
    "checkInterval", "conditions", "interruptOnDamage", "cooldownGroup", "chance", "repeatOnCast"];
  var TARGET_KEYS = ["type", "positionMode", "sort", "lineOfSight", "relativeOffset", "placement", "filters",
    "entityTypes", "entityTags", "excludeTags", "excludeCasterTeam", "ignoreCreative",
    "minHealthPercent", "maxHealthPercent", "requireNoShield"];
  var FILTER_KEYS = ["entityTypes", "entityTags", "excludeTags", "excludeCasterTeam", "ignoreCreative",
    "minHealthPercent", "maxHealthPercent", "requireNoShield"];
  var PLACEMENT_KEYS = ["avoidFluid", "avoidLava"];
  var CONDITIONS_KEYS = ["healthBelow", "healthAbove", "minTargetDistance", "maxTargetDistance", "self", "target", "world"];
  var CONDITIONS_TARGET_KEYS = ["minTargetDistance", "maxTargetDistance"];
  var WORLD_KEYS = ["time", "timeOfDay", "weather", "moonPhase", "dimension", "difficulty", "minDay"];
  var SELF_KEYS = ["onFire", "inWater", "inLava", "frozen", "healthBelow", "healthAbove"];
  var PHASE_KEYS = ["title", "subtitle", "sound", "bossBarColor", "bossBarName", "weather", "time",
    "knockback", "invulnerableTicks", "freezeTicks", "phaseTicks", "replay", "shake", "burst", "summon"];
  var SHAKE_KEYS = ["duration", "radius"];
  var BURST_KEYS = ["radius", "color", "colour"];
  var SUMMON_KEYS = ["entity", "count", "radius", "tags"];
  var DROP_RULE_KEYS = ["select", "chance", "drops"];
  var DROP_KEYS = ["item", "lootTable", "min", "max", "count", "chance", "looting", "requirePlayerKill"];
  var SELECT_KEYS = ["name", "nameRegex", "tags", "healthBelow", "healthAbove", "tamed"];
  var SELECT_EXTRA = ["sticky", "bossBar", "learner", "adaptive", "disableAttackGoals"];
  var ROOT_KEYS = ["variants", "goals", "onHurt", "onTarget", "onDeath", "onKill", "dropRules", "bossBar", "disableAttackGoals", "$schema"];
  var VARIANT_KEYS = ["select", "override", "sticky", "bossBar", "learner", "adaptive", "disableAttackGoals", "onPhase",
    "goals", "onHurt", "onTarget", "onDeath", "onKill", "dropRules"];

  C.KEYS = {
    ROOT: ROOT_KEYS, CAST: CAST_KEYS, TARGET: TARGET_KEYS, FILTERS: FILTER_KEYS,
    PLACEMENT: PLACEMENT_KEYS, CONDITIONS: CONDITIONS_KEYS, WORLD: WORLD_KEYS, SELF: SELF_KEYS,
    PHASE: PHASE_KEYS, SHAKE: SHAKE_KEYS, BURST: BURST_KEYS, SUMMON: SUMMON_KEYS,
    DROP_RULE: DROP_RULE_KEYS, DROP: DROP_KEYS, SELECT: SELECT_KEYS.concat(SELECT_EXTRA),
    VARIANT: VARIANT_KEYS
  };

  function checkEnumList(value, allowed, path, note, label) {
    asList(value).forEach(function (entry) {
      var text = String(entry).toLowerCase();
      if (allowed.indexOf(text) < 0) {
        note("err", path, label + " must be " + allowed.join(" / ") + ", but is '" + entry + "'; the parser will throw and discard the whole spell.");
      }
    });
  }

  function checkBool(object, key, path, note, label) {
    var value = object[key];
    if (value === undefined) return;
    if (typeof value !== "boolean") {
      note("err", path ? path + "." + key : key, (label || key) + " must be true / false; any other value makes the parser throw.");
    }
  }

  function checkInts(object, key, path, note) {
    var value = object[key];
    if (value === undefined) return;
    if (!C.isNum(value) || Math.floor(value) !== value) {
      note("err", path ? path + "." + key : key, key + " must be an integer; otherwise the parser throws and discards the whole spell.");
      return false;
    }
    return true;
  }

  function checkNumbers(object, keys, path, note) {
    keys.forEach(function (key) {
      var value = object[key];
      if (value === undefined) return;
      if (!C.isNum(value)) {
        note("err", path ? path + "." + key : key, key + " must be a number; otherwise the parser throws and discards the whole spell.");
      }
    });
  }

  /**
   * 未知键：Java 侧 JsonHelper.warnUnknown 只 log 一条警告，且把以 _ 开头的键当注释。
   */
  function unknownKeys(object, allowed, path, note) {
    Object.keys(object || {}).forEach(function (key) {
      if (key.charAt(0) === "_") return;
      if (allowed.indexOf(key) < 0) {
        note("warn", path ? path + "." + key : key,
          "Unknown key '" + key + "'; the parser ignores it (only keys starting with _ are comments).");
      }
    });
  }

  function validateTarget(target, path, note, ctx) {
    if (target == null) return;
    if (typeof target === "string") {
      if (!C.enumHas(data().TARGET_TYPES, target)) {
        note("err", path, "Unknown target type '" + target + "'; the whole spell will be discarded.");
      }
      return;
    }
    if (!C.isObj(target)) {
      note("err", path, "target must be a string or an object; otherwise the whole spell is discarded.");
      return;
    }
    unknownKeys(target, TARGET_KEYS, path, note);
    ["entityTypes", "entityTags", "excludeTags", "excludeCasterTeam"].forEach(function (key) {
      if (target[key] === undefined) return;
      note("warn", path + "." + key,
        "Placed on the target object, this has no effect — the parser only reads target.filters." + key + "; this level is ignored by the parser.",
        "Move this entry into the filters object.");
    });
    if (target.type != null && !C.enumHas(data().TARGET_TYPES, target.type)) {
      note("err", path + ".type", "Unknown type '" + target.type + "'; the whole spell is discarded.");
    }
    if (target.sort != null && !C.enumHas(data().TARGET_SORTS, target.sort)) {
      note("err", path + ".sort", "Unknown sort '" + target.sort + "'; the whole spell is discarded.");
    }
    if (target.positionMode != null && !C.enumHas(data().POSITION_MODES, target.positionMode)) {
      note("err", path + ".positionMode", "Unknown aim mode '" + target.positionMode + "'; the whole spell is discarded.");
    }
    checkBool(target, "lineOfSight", path, note);
    if (target.relativeOffset !== undefined) {
      var offset = target.relativeOffset;
      if (!C.isArr(offset)) {
        note("err", path + ".relativeOffset", "must be an array, e.g. [0, 0, 2].");
      } else if (offset.length < 3) {
        note("err", path + ".relativeOffset", "must contain at least three numbers, but has " + offset.length + "; the parser will throw.");
      } else {
        offset.forEach(function (value, index) {
          if (index >= 3) return;
          if (!C.isNum(value)) {
            note("err", path + ".relativeOffset[" + index + "]", "Offset values must be numbers.");
          }
        });
      }
    }
    if (target.filters !== undefined) {
      if (!C.isObj(target.filters)) {
        note("err", path + ".filters", "filters must be an object; otherwise the whole spell is discarded.");
      } else {
        var filters = target.filters;
        unknownKeys(filters, FILTER_KEYS, path + ".filters", note);
        ["entityTypes", "entityTags"].forEach(function (key) {
          if (filters[key] === undefined) return;
          if (!C.isArr(filters[key])) {
            note("err", path + ".filters." + key, "must be an array (a single string throws); the whole spell is discarded.");
            return;
          }
          filters[key].forEach(function (id, index) {
            if (!C.isId(id)) {
              note("err", path + ".filters." + key + "[" + index + "]",
                "Invalid id: '" + id + "'. The parser runs ResourceLocation.tryParse on every id in filters." + key + " and discards the whole spell if one fails.");
            }
          });
        });
        if (filters.excludeTags !== undefined && !C.isArr(filters.excludeTags)) {
          note("warn", path + ".filters.excludeTags",
            "A single string is also accepted, but an array is clearer (ids are not validated here; tags may start with #).");
        }
        ["excludeCasterTeam", "ignoreCreative", "requireNoShield"].forEach(function (key) {
          checkBool(filters, key, path + ".filters", note);
        });
        ["minHealthPercent", "maxHealthPercent"].forEach(function (key) {
          if (filters[key] === undefined) return;
          if (!C.isNum(filters[key])) {
            note("err", path + ".filters." + key, "must be a number from 0..1; otherwise the whole spell is discarded.");
          } else if (filters[key] < 0 || filters[key] > 1) {
            note("warn", path + ".filters." + key, "is outside 0..1, so the filter can never match.");
          }
        });
        if (C.isNum(filters.minHealthPercent) && C.isNum(filters.maxHealthPercent)
          && filters.minHealthPercent > filters.maxHealthPercent) {
          note("warn", path + ".filters", "minHealthPercent is greater than maxHealthPercent, so no target can ever match.");
        }
        if (filters.ignoreCreative === undefined) {
          note("note", path + ".filters", "ignoreCreative is not set, so it defaults to true (creative players are ignored).");
        }
      }
    }
    if (target.placement !== undefined) {
      if (!C.isObj(target.placement)) {
        note("err", path + ".placement", "placement must be an object; otherwise the whole spell is discarded.");
      } else {
        unknownKeys(target.placement, PLACEMENT_KEYS, path + ".placement", note);
        ["avoidFluid", "avoidLava"].forEach(function (key) {
          checkBool(target.placement, key, path + ".placement", note);
        });
      }
    }
    ["minHealthPercent", "maxHealthPercent"].forEach(function (key) {
      if (target[key] === undefined) return;
      if (!C.isNum(target[key])) note("err", path + "." + key, "must be a number from 0..1.");
      else note("note", path + "." + key, "The target-level " + key + " overrides the same key in filters and takes priority.");
    });
  }

  function validateConditions(conditions, path, note, ctx) {
    if (conditions == null) return;
    if (!C.isObj(conditions)) {
      note("err", path, "conditions must be an object; otherwise the whole spell is discarded.");
      return;
    }
    unknownKeys(conditions, CONDITIONS_KEYS, path, note);
    checkNumbers(conditions, ["healthBelow", "healthAbove", "minTargetDistance", "maxTargetDistance"], path, note);
    if (C.isNum(conditions.healthBelow) && C.isNum(conditions.healthAbove)
      && conditions.healthBelow < conditions.healthAbove) {
      note("warn", path, "healthBelow is less than healthAbove, so these two conditions can never both be true.");
    }
    if (C.isNum(conditions.minTargetDistance) && C.isNum(conditions.maxTargetDistance)
      && conditions.minTargetDistance > conditions.maxTargetDistance) {
      note("warn", path, "minTargetDistance is greater than maxTargetDistance, so the condition can never be true.");
    }
    if (conditions.self !== undefined) {
      if (!C.isObj(conditions.self)) {
        note("err", path + ".self", "self must be an object; otherwise the whole spell is discarded.");
      } else {
        var self = conditions.self;
        Object.keys(self).forEach(function (key) {
          if (SELF_KEYS.indexOf(key) >= 0) return;
          note("note", path + ".self." + key, "The parser does not read this key inside self and silently ignores it (no error).");
        });
        ["onFire", "inWater", "inLava", "frozen"].forEach(function (key) {
          checkBool(self, key, path + ".self", note);
        });
        ["healthBelow", "healthAbove"].forEach(function (key) {
          if (self[key] === undefined) return;
          if (!C.isNum(self[key])) {
            note("err", path + ".self." + key, "must be a number from 0..1; otherwise the whole spell is discarded.");
          } else if (conditions[key] === undefined) {
            note("note", path + ".self." + key, "When top-level " + key + " is absent, the value inside self is used as the health condition.");
          }
        });
      }
    }
    if (conditions.target !== undefined) {
      if (!C.isObj(conditions.target)) {
        note("err", path + ".target", "conditions.target must be an object.");
      } else {
        var ctarget = conditions.target;
        Object.keys(ctarget).forEach(function (key) {
          if (CONDITIONS_TARGET_KEYS.indexOf(key) >= 0) {
            if (!C.isNum(ctarget[key])) {
              note("err", path + ".target." + key, "must be a number; otherwise the whole spell is discarded.");
            }
            return;
          }
          note("note", path + ".target." + key,
            "The parser only reads minTargetDistance / maxTargetDistance inside conditions.target; this key is ignored without an error.");
        });
      }
    }
    if (conditions.world !== undefined) {
      if (!C.isObj(conditions.world)) {
        note("err", path + ".world", "world must be an object; otherwise the whole spell is discarded.");
        return;
      }
      var world = conditions.world;
      Object.keys(world).forEach(function (key) {
        if (WORLD_KEYS.indexOf(key) < 0) {
          note("err", path + ".world." + key, "An unknown key inside world throws immediately and discards the whole spell.");
        }
      });
      if (world.time !== undefined && world.timeOfDay !== undefined) {
        note("note", path + ".world", "Both time and timeOfDay are set; the parser uses time.");
      }
      if (world.time !== undefined) {
        checkEnumList(world.time, ["dawn", "day", "dusk", "night"], path + ".world.time", note, "time");
      }
      if (world.timeOfDay !== undefined) {
        checkEnumList(world.timeOfDay, ["dawn", "day", "dusk", "night"], path + ".world.timeOfDay", note, "timeOfDay");
      }
      if (world.weather !== undefined) {
        checkEnumList(world.weather, ["clear", "sunny", "rain", "raining", "thunder", "thunderstorm"],
          path + ".world.weather", note, "weather");
      }
      if (world.difficulty !== undefined) {
        checkEnumList(world.difficulty, ["peaceful", "easy", "normal", "hard"], path + ".world.difficulty", note, "difficulty");
      }
      if (world.moonPhase !== undefined) {
        asList(world.moonPhase).forEach(function (phase) {
          if (!C.isNum(phase) || Math.floor(phase) !== phase || phase < 0 || phase > 7) {
            note("err", path + ".world.moonPhase", "Moon phase must be an integer from 0..7, but is " + JSON.stringify(phase) + ".");
          }
        });
      }
      if (world.dimension !== undefined) {
        asList(world.dimension).forEach(function (id, index) {
          if (!C.isId(id)) {
            note("err", path + ".world.dimension" + (C.isArr(world.dimension) ? "[" + index + "]" : ""),
              "Invalid dimension id: '" + id + "'. The parser throws invalid dimension id and discards the whole spell.");
          }
        });
      }
      if (world.minDay !== undefined) {
        if (!C.isNum(world.minDay) || Math.floor(world.minDay) !== world.minDay) {
          note("err", path + ".world.minDay", "must be an integer.");
        } else if (world.minDay < 0) {
          note("warn", path + ".world.minDay", "A negative value is meaningless and always true.");
        }
      }
    }
  }

  function validatePhase(phase, path, note, ctx) {
    if (phase == null) return;
    if (!C.isObj(phase)) {
      note("err", path, "onPhase must be an object; otherwise the whole variant is discarded.");
      return;
    }
    Object.keys(phase).forEach(function (key) {
      if (key.charAt(0) === "_") return;
      if (PHASE_KEYS.indexOf(key) < 0) {
        note("err", path + "." + key,
          "An unknown key inside onPhase throws immediately and discards the whole variant (PhaseEffect's whitelist is stricter than normal fields).");
      }
    });
    if (phase.weather != null) {
      checkEnumList(phase.weather, ["clear", "rain", "thunder"], path + ".weather", note, "weather");
    }
    if (phase.time != null) {
      checkEnumList(phase.time, ["day", "noon", "night", "midnight"], path + ".time", note, "time");
    }
    if (phase.bossBarColor != null) {
      var allowedColours = [];
      (data().BOSSBAR_COLORS || []).forEach(function (name) {
        allowedColours.push(String(name).toLowerCase());
      });
      if (allowedColours.indexOf(String(phase.bossBarColor).toLowerCase()) < 0) {
        note("err", path + ".bossBarColor",
          "must be " + allowedColours.join(" / ") + " (case-insensitive); otherwise the whole variant is discarded.");
      }
    }
    ["title", "subtitle", "sound", "bossBarName"].forEach(function (key) {
      if (phase[key] !== undefined && typeof phase[key] !== "string") {
        note("err", path + "." + key,
          "must be a string: the parser uses optString, and a wrong type throws and discards the whole variant.");
      }
    });
    if (typeof phase.sound === "string" && !C.isId(phase.sound)) {
      note("err", path + ".sound", "Invalid sound id: '" + phase.sound + "'; the parser throws invalid sound id.");
    }
    checkInts(phase, "phaseTicks", path, note);
    checkInts(phase, "invulnerableTicks", path, note);
    checkInts(phase, "freezeTicks", path, note);
    checkNumbers(phase, ["knockback"], path, note);
    checkBool(phase, "replay", path, note);
    if (C.isNum(phase.knockback) && (phase.knockback < 0 || phase.knockback > 16)) {
      note("warn", path + ".knockback", "will be clamped to 0..16.");
    }
    if (C.isNum(phase.phaseTicks) && (phase.phaseTicks < 10 || phase.phaseTicks > 1200)) {
      note("warn", path + ".phaseTicks", "will be clamped to 10..1200.");
    }
    if (C.isNum(phase.invulnerableTicks) && (phase.invulnerableTicks < 0 || phase.invulnerableTicks > 1200)) {
      note("warn", path + ".invulnerableTicks", "will be clamped to 0..1200.");
    }
    if (C.isNum(phase.freezeTicks)) {
      if (phase.freezeTicks < 0) {
        note("note", path + ".freezeTicks", "A negative value follows invulnerableTicks (default -1).");
      } else if (phase.freezeTicks > 1200) {
        note("warn", path + ".freezeTicks", "will be clamped to 0..1200.");
      }
    }
    if (phase.shake !== undefined) {
      if (!C.isObj(phase.shake)) {
        note("err", path + ".shake", "shake must be an object; otherwise the whole variant is discarded.");
      } else {
        unknownKeys(phase.shake, SHAKE_KEYS, path + ".shake", note);
        checkInts(phase.shake, "duration", path + ".shake", note);
        checkNumbers(phase.shake, ["radius"], path + ".shake", note);
        if (C.isNum(phase.shake.duration) && (phase.shake.duration < 1 || phase.shake.duration > 200)) {
          note("warn", path + ".shake.duration", "will be clamped to 1..200.");
        }
        if (C.isNum(phase.shake.radius) && (phase.shake.radius < 1 || phase.shake.radius > 64)) {
          note("warn", path + ".shake.radius", "will be clamped to 1..64.");
        }
      }
    }
    if (phase.burst !== undefined) {
      if (!C.isObj(phase.burst)) {
        note("err", path + ".burst", "burst must be an object; otherwise the whole variant is discarded.");
      } else {
        unknownKeys(phase.burst, BURST_KEYS, path + ".burst", note);
        checkNumbers(phase.burst, ["radius"], path + ".burst", note);
        if (C.isNum(phase.burst.radius) && (phase.burst.radius < 1 || phase.burst.radius > 16)) {
          note("warn", path + ".burst.radius", "will be clamped to 1..16.");
        }
        if (phase.burst.color !== undefined && phase.burst.colour !== undefined) {
          note("note", path + ".burst", "Both color and colour are set; color is read first, then colour.");
        }
        ["color", "colour"].forEach(function (key) {
          var value = phase.burst[key];
          if (value === undefined) return;
          if (typeof value !== "string") {
            note("err", path + ".burst." + key, "Colors must be strings (\"auto\" or #RRGGBB); otherwise the whole variant is discarded.");
          } else if (value.toLowerCase() !== "auto" && !/^#[0-9a-f]{6}$/i.test(value)) {
            note("warn", path + ".burst." + key, "is neither auto nor #RRGGBB; the particle color may not display as expected.");
          }
        });
      }
    }
    if (phase.summon !== undefined) {
      if (!C.isObj(phase.summon)) {
        note("err", path + ".summon", "summon must be an object; otherwise the whole variant is discarded.");
      } else {
        unknownKeys(phase.summon, SUMMON_KEYS, path + ".summon", note);
        if (!phase.summon.entity) {
          note("err", path + ".summon.entity", "Missing entity id: it is required, and without it the whole variant is discarded.");
        } else if (typeof phase.summon.entity !== "string") {
          note("err", path + ".summon.entity", "Entity id must be a string.");
        } else if (!C.isId(phase.summon.entity)) {
          note("err", path + ".summon.entity", "Invalid entity id: '" + phase.summon.entity + "'.");
        }
        checkInts(phase.summon, "count", path + ".summon", note);
        checkNumbers(phase.summon, ["radius"], path + ".summon", note);
        if (C.isNum(phase.summon.count) && (phase.summon.count < 1 || phase.summon.count > 16)) {
          note("warn", path + ".summon.count", "will be clamped to 1..16.");
        }
        if (C.isNum(phase.summon.radius) && (phase.summon.radius < 1 || phase.summon.radius > 16)) {
          note("warn", path + ".summon.radius", "will be clamped to 1..16.");
        }
        if (phase.summon.tags !== undefined) {
          if (!C.isArr(phase.summon.tags)) {
            note("err", path + ".summon.tags", "must be an array; otherwise the whole variant is discarded.");
          } else {
            phase.summon.tags.forEach(function (tag, index) {
              if (typeof tag !== "string") {
                note("err", path + ".summon.tags[" + index + "]", "Tags must be strings.");
              }
            });
          }
        }
      }
    }
  }

  function validateSelector(selector, path, note, ctx) {
    if (selector === undefined || selector === null) {
      note("err", path, "Missing the select object; the whole variant is discarded (a variant must be selectable by some condition).");
      return;
    }
    if (!C.isObj(selector)) {
      note("err", path, "select must be an object; otherwise the whole variant is discarded.");
      return;
    }
    Object.keys(selector).forEach(function (key) {
      if (key.charAt(0) === "_") return;
      if (SELECT_KEYS.indexOf(key) < 0 && SELECT_EXTRA.indexOf(key) < 0) {
        note("warn", path + "." + key, "Unknown key '" + key + "'; the parser ignores it.");
      }
    });
    var hasOne = SELECT_KEYS.some(function (key) { return selector[key] !== undefined; });
    if (!hasOne) {
      note("err", path, "Set at least one of name / nameRegex / tags / healthBelow / healthAbove / tamed; otherwise the whole variant is discarded.");
    }
    if (selector.name !== undefined && typeof selector.name !== "string") {
      note("err", path + ".name", "must be a string; otherwise the whole variant is discarded.");
    }
    if (selector.tags !== undefined) {
      if (!C.isArr(selector.tags)) {
        note("err", path + ".tags", "must be an array of strings (a single string throws); the whole variant is discarded.");
      } else {
        selector.tags.forEach(function (tag, index) {
          if (typeof tag !== "string") {
            note("err", path + ".tags[" + index + "]", "Tags must be strings; numbers or objects discard the whole variant.");
          }
        });
      }
    }
    if (selector.tamed !== undefined && typeof selector.tamed !== "boolean") {
      note("err", path + ".tamed", "must be a boolean; otherwise the whole variant is discarded.");
    }
    ["healthBelow", "healthAbove"].forEach(function (key) {
      if (selector[key] === undefined) return;
      if (!C.isNum(selector[key])) {
        note("err", path + "." + key, "must be a number from 0..1; otherwise the whole variant is discarded.");
      } else if (selector[key] < 0 || selector[key] > 1) {
        note("warn", path + "." + key, "will be silently clamped to 0..1; writing " + selector[key] + " is the same as writing " + Math.max(0, Math.min(1, selector[key])) + ".");
      }
    });
    if (C.isNum(selector.healthBelow) && C.isNum(selector.healthAbove)
      && selector.healthBelow <= selector.healthAbove) {
      note("err", path, "healthBelow must be greater than healthAbove; otherwise the parser throws and discards the whole variant.");
    }
    if (selector.nameRegex != null) {
      try {
        new RegExp(String(selector.nameRegex));
      } catch (error) {
        note("err", path + ".nameRegex", "Regex does not compile: " + error.message + "(the whole variant is discarded)");
      }
    }
    ["sticky", "bossBar", "learner", "adaptive", "disableAttackGoals"].forEach(function (key) {
      checkBool(selector, key, path, note);
    });
  }

  function validateDropEntry(entry, path, note, ctx) {
    if (!C.isObj(entry)) {
      note("err", path, "A drop entry must be an object; otherwise this entry is skipped.");
      return;
    }
    unknownKeys(entry, DROP_KEYS, path, note);
    var hasItem = entry.item != null && entry.item !== "";
    var hasTable = entry.lootTable != null && entry.lootTable !== "";
    if (!hasItem && !hasTable) {
      note("err", path, "Exactly one of item or lootTable is required; otherwise this entry is skipped.");
    }
    if (hasItem && hasTable) {
      note("err", path, "item and lootTable are mutually exclusive — setting both throws and skips this entry (it does not just use item).");
    }
    if (hasItem && !C.isId(entry.item)) {
      note("err", path + ".item", "Invalid item id: '" + entry.item + "'; this entry is skipped.");
    }
    if (hasTable && !C.isId(entry.lootTable)) {
      note("err", path + ".lootTable", "Invalid loot table id: '" + entry.lootTable + "'; this entry is skipped.");
    }
    if (entry.chance !== undefined) {
      if (!C.isNum(entry.chance)) {
        note("err", path + ".chance", "must be a number from 0..1; otherwise this entry is skipped.");
      } else if (entry.chance < 0 || entry.chance > 1) {
        note("warn", path + ".chance", "will be clamped to 0..1.");
      }
    }
    ["looting", "requirePlayerKill"].forEach(function (key) {
      checkBool(entry, key, path, note);
    });
    if (entry.requirePlayerKill === undefined) {
      note("note", path + ".requirePlayerKill", "Not set means true: non-player kills drop nothing. Spawner farms will therefore drop nothing.");
    }
    if (entry.count !== undefined) {
      if (!C.isNum(entry.count) || Math.floor(entry.count) !== entry.count || entry.count < 1) {
        note("err", path + ".count", "must be an integer >= 1; otherwise this entry is skipped.");
      }
      if (entry.min != null || entry.max != null) {
        note("warn", path, "When count is set, min / max are ignored.");
      }
      return;
    }
    var min = entry.min != null ? entry.min : 1;
    var max = entry.max != null ? entry.max : min;
    if (!C.isNum(min) || Math.floor(min) !== min) {
      note("err", path + ".min", "must be an integer; otherwise this entry is skipped.");
      return;
    }
    if (!C.isNum(max) || Math.floor(max) !== max) {
      note("err", path + ".max", "must be an integer; otherwise this entry is skipped.");
      return;
    }
    if (min < 1) {
      note("err", path + ".min", "must be >= 1 (0 skips this entry).");
    } else if (max < min) {
      note("err", path + ".max", "max cannot be less than min; otherwise this entry is skipped (it is not clamped).");
    }
  }

  function validateDropRule(rule, path, note, inVariant, ctx) {
    if (!C.isObj(rule)) {
      note("err", path, "A drop rule must be an object; otherwise the whole rule is discarded.");
      return;
    }
    unknownKeys(rule, DROP_RULE_KEYS, path, note);
    if (rule.select !== undefined) {
      validateSelector(rule.select, path + ".select", note, ctx);
      if (C.isObj(rule.select) && (rule.select.healthBelow != null || rule.select.healthAbove != null)) {
        note("warn", path + ".select",
          "Drops are resolved in the death event, where health is 0: healthBelow is always true and healthAbove is always false.",
          "Put phase-specific drops in variants[i].dropRules.");
      }
    }
    if (rule.chance !== undefined) {
      if (!C.isNum(rule.chance)) {
        note("err", path + ".chance", "must be a number; otherwise the whole rule is discarded.");
      } else if (rule.chance < 0 || rule.chance > 1) {
        note("warn", path + ".chance", "will be clamped to 0..1.");
      }
    }
    if (!C.isArr(rule.drops)) {
      note("err", path + ".drops", "must have a drops array; otherwise the whole rule is discarded.");
      return;
    }
    if (rule.drops.length === 0) {
      note("err", path + ".drops", "Empty array: the parser reports drops has no usable entries and discards the whole rule.");
      return;
    }
    rule.drops.forEach(function (entry, index) {
      validateDropEntry(entry, path + ".drops[" + index + "]", note, ctx);
    });
  }

  function validateCast(cast, path, note, ctx) {
    if (!C.isObj(cast)) {
      note("err", path, "A spell entry must be an object; otherwise the whole entry is discarded.");
      return;
    }
    unknownKeys(cast, CAST_KEYS, path, note);
    if (!cast.spell) {
      note("err", path + ".spell", "Missing spell; this entry is discarded.");
    } else if (!C.isId(cast.spell)) {
      note("err", path + ".spell", "Invalid spell id: '" + cast.spell + "'.");
    } else if (!ctx.spellIndex[cast.spell]) {
      note("warn", path + ".spell",
        "is not one of the " + ctx.spellCount + " built-in spells. A typo, or a spell disabled in the ISS config, makes the whole entry fail.");
    }
    checkNumbers(cast, ["level", "cooldown", "priority", "range", "castTime", "checkInterval", "chance"], path, note);
    checkBool(cast, "interruptOnDamage", path, note);
    checkBool(cast, "repeatOnCast", path, note);
    if (cast.cooldownGroup != null) {
      if (typeof cast.cooldownGroup !== "string" || !/^[a-z0-9_.-]{1,32}$/.test(cast.cooldownGroup)) {
        note("err", path + ".cooldownGroup",
          "must be 1–32 characters from a-z 0-9 _ . -; otherwise the whole entry is discarded.",
          "Use lowercase letters and digits, e.g. blaze_breath, phase_2.");
      }
    }
    if (C.isNum(cast.chance) && (cast.chance < 0 || cast.chance > 1)) {
      note("warn", path + ".chance", "will be clamped to 0..1.");
    }
    if (C.isNum(cast.range) && cast.range < 1) {
      note("warn", path + ".range", "The minimum is 1.");
    }
    if (C.isNum(cast.checkInterval) && (cast.checkInterval < 1 || cast.checkInterval > 200)) {
      note("warn", path + ".checkInterval", "will be clamped to 1..200.");
    }
    if (C.isNum(cast.priority) && (cast.priority < 0 || cast.priority > 9)) {
      note("warn", path + ".priority", "will be clamped to 0..9.");
    }
    if (C.isNum(cast.level) && (cast.level < 1 || cast.level > 10)) {
      note("warn", path + ".level", "clamped to 1..the spell's max level (at most 10).");
    }
    if (C.isNum(cast.castTime) && cast.castTime === -1) {
      note("note", path + ".castTime", "-1 uses ISS's own cast time.");
    }
    if (C.isNum(cast.cooldown) && cast.cooldown === -1) {
      note("note", path + ".cooldown", "-1 uses ISS's own cooldown.");
    }
    validateTarget(cast.target, path + ".target", note, ctx);
    validateConditions(cast.conditions, path + ".conditions", note, ctx);
  }

  function isTriggerData(node) {
    return ["goals", "onHurt", "onTarget", "onDeath", "onKill", "dropRules", "disableAttackGoals"].some(function (key) {
      return node[key] !== undefined;
    });
  }

  function validateVariant(variant, path, note, ctx) {
    if (!C.isObj(variant)) {
      note("warn", path, "A variant must be an object; otherwise the parser skips it (the whole file does not fail).");
      return;
    }
    Object.keys(variant).forEach(function (key) {
      if (key.charAt(0) === "_") return;
      if (VARIANT_KEYS.indexOf(key) < 0) {
        note("warn", path + "." + key, "Unknown key '" + key + "'; the parser ignores it.");
      }
    });
    validateSelector(variant.select, path + ".select", note, ctx);
    ["override", "sticky", "learner", "adaptive", "bossBar", "disableAttackGoals"].forEach(function (key) {
      checkBool(variant, key, path, note);
    });
    validatePhase(variant.onPhase, path + ".onPhase", note, ctx);
    if (variant.goals !== undefined && !C.isArr(variant.goals)) {
      note("err", path + ".goals", "goals must be an array; otherwise the whole variant is discarded.");
    } else if (C.isArr(variant.goals)) {
      variant.goals.forEach(function (cast, index) { validateCast(cast, path + ".goals[" + index + "]", note, ctx); });
    }
    C.TRIGGERS.forEach(function (trigger) {
      if (variant[trigger.key] === undefined) return;
      if (!C.isObj(variant[trigger.key])) {
        note("err", path + "." + trigger.key, "A trigger must be an object; otherwise the whole variant is discarded.");
        return;
      }
      validateCast(variant[trigger.key], path + "." + trigger.key, note, ctx);
    });
    if (variant.dropRules !== undefined && !C.isArr(variant.dropRules)) {
      note("err", path + ".dropRules", "dropRules must be an array; otherwise the whole variant is discarded.");
    } else if (C.isArr(variant.dropRules)) {
      variant.dropRules.forEach(function (rule, index) {
        validateDropRule(rule, path + ".dropRules[" + index + "]", note, true, ctx);
      });
    }
    var override = variant.override !== false;
    if (override && !isTriggerData(variant)) {
      note("warn", path,
        "override defaults to true, but this variant defines no rules: once matched, the mob becomes an empty shell that casts nothing.",
        "Either add goals / triggers / dropRules, or set \"override\": false to inherit the species default rules.");
    }
    if (variant.sticky !== undefined && isTriggerData(variant) === false && !override) {
      note("note", path, "sticky + override:false: the phase locks, but the rules stay on the species default.");
    }
  }

  /** 变体的「个体标识」：只由 name / nameRegex / tags / tamed 决定，血量不参与。 */
  C.selectIdentityKey = function (selector) {
    var s = C.isObj(selector) ? selector : {};
    var tags = C.isArr(s.tags) ? s.tags.map(String).slice().sort() : [];
    return JSON.stringify([
      s.name == null ? null : String(s.name),
      s.nameRegex == null ? null : String(s.nameRegex),
      tags,
      s.tamed == null ? null : !!s.tamed
    ]);
  };

  /** 变体顺序检查：同一组（同样的 tags / 名字 / 驯服条件）里下标越小 = 越深，阈值必须单调不减。 */
  C.checkVariantOrder = function (variants, note) {
    if (!C.isArr(variants) || variants.length < 2) return;
    var thresholds = [];
    var lastByGroup = {};
    variants.forEach(function (variant, index) {
      if (!C.isObj(variant) || !C.isObj(variant.select)) return;
      var select = variant.select;
      var group = C.selectIdentityKey(select);
      if (C.isNum(select.healthBelow)) thresholds.push({ value: select.healthBelow, index: index, key: "healthBelow", group: group });
      else if (C.isNum(select.healthAbove)) thresholds.push({ value: select.healthAbove, index: index, key: "healthAbove", group: group });
    });
    for (var i = 0; i < thresholds.length; i++) {
      var cur = thresholds[i];
      var prev = lastByGroup[cur.group];
      lastByGroup[cur.group] = cur;
      if (!prev) continue;
      if (cur.value < prev.value) {
        note("warn", "variants[" + cur.index + "].select." + cur.key,
          "Phase order is reversed: a smaller index means a deeper phase, so health thresholds must increase with the index."
          + "The previous entry is " + prev.value + " and this one is " + cur.value
          + "; when health falls below " + cur.value + ", both match, and the parser takes the smaller index,"
          + "so it always stays on the previous entry — the deeper phase can never be reached.",
          "Put the smaller threshold first (ascending healthBelow), or click Sort by threshold.",
          "sort-variants");
      }
    }
  };

  C.validateRules = function (rules, ctx) {
    var diags = [];
    var context = {
      spellIndex: {},
      spellCount: 0,
      entityId: ctx && ctx.entityId
    };
    ((ctx && ctx.spells) || data().SPELLS || []).forEach(function (entry) {
      context.spellIndex[entry.id] = entry;
    });
    context.spellCount = Object.keys(context.spellIndex).length;

    function note(sev, path, msg, hint, fix) {
      diags.push({ sev: sev, path: path || "", msg: msg, hint: hint || "", fix: fix || "" });
    }

    if (!C.isObj(rules)) {
      note("err", "", "The file content must be a JSON object.");
      return diags;
    }
    if (context.entityId && !C.splitEntityId(context.entityId)) {
      note("err", "", "Invalid entity id; the file name cannot be used.");
    }
    unknownKeys(rules, ROOT_KEYS, "", note);
    if (!isTriggerData(rules) && !C.isArr(rules.variants)) {
      note("warn", "", "The root object has no rules and no variants; this file is ignored (the parser returns null).");
      return diags;
    }
    if (rules.bossBar !== undefined && typeof rules.bossBar !== "boolean") {
      note("err", "bossBar", "The root bossBar must be true / false (or omitted: omitted means follow the presentation config).");
    }
    if (rules.disableAttackGoals !== undefined && typeof rules.disableAttackGoals !== "boolean") {
      note("err", "disableAttackGoals", "The root disableAttackGoals must be true / false; omitted means false (keep vanilla melee / ranged attack goals).");
    }
    if (rules.variants !== undefined) {
      if (!C.isArr(rules.variants)) {
        note("err", "variants", "variants must be an array; otherwise the whole file fails to load.");
      } else {
        rules.variants.forEach(function (variant, index) {
          validateVariant(variant, "variants[" + index + "]", note, context);
        });
        C.checkVariantOrder(rules.variants, note);
        if (rules.variants.length > 1) {
          var last = rules.variants[rules.variants.length - 1];
          if (C.isObj(last) && last.sticky === true) {
            note("warn", "variants", "The last entry also sets sticky, but locking only moves toward smaller indexes, so it has no effect there.",
            "Remove this sticky (omitting it is the same as false).", "clear-dead-sticky");
          }
        }
        var allSticky = rules.variants.every(function (variant) {
          return C.isObj(variant) && variant.sticky === true;
        });
        if (rules.variants.length > 1 && allSticky) {
          note("note", "variants", "Every entry sets sticky: phases only lock forward and never revert.");
        }
      }
    }
    if (rules.goals !== undefined && !C.isArr(rules.goals)) {
      note("err", "goals", "goals must be an array; otherwise the whole file fails to load.");
    } else if (C.isArr(rules.goals)) {
      rules.goals.forEach(function (cast, index) { validateCast(cast, "goals[" + index + "]", note, context); });
    }
    C.TRIGGERS.forEach(function (trigger) {
      if (rules[trigger.key] === undefined) return;
      if (!C.isObj(rules[trigger.key])) {
        note("err", trigger.key, "A trigger must be a single cast object; an array throws and the whole file fails to load.");
        return;
      }
      validateCast(rules[trigger.key], trigger.key, note, context);
    });
    if (rules.dropRules !== undefined) {
      if (!C.isArr(rules.dropRules)) {
        note("err", "dropRules", "dropRules must be an array; otherwise the whole file fails to load.");
      } else {
        rules.dropRules.forEach(function (rule, index) {
          validateDropRule(rule, "dropRules[" + index + "]", note, false, context);
        });
      }
    }
    if (!C.isArr(rules.variants) && !C.isArr(rules.goals) && !isTriggerData(rules)) {
      note("note", "", "Only variants, no species default rules: when no variant matches, this mob casts nothing (this is valid).");
    }
    /* 一个文件里每条掉落都刷一遍 requirePlayerKill 太吵：合成一条，还带一个一键补写的标记。 */
    var killNotes = diags.filter(function (diag) {
      return /\.requirePlayerKill$/.test(diag.path) && diag.msg.indexOf("Not set means true") === 0;
    });
    if (killNotes.length) {
      diags = diags.filter(function (diag) { return killNotes.indexOf(diag) < 0; });
      var where = killNotes[0].path.split(".")[0];
      note("note", where,
        killNotes.length > 1
          ? "This file has " + killNotes.length + " drop entries without requirePlayerKill; all are treated as true: non-player kills drop nothing."
          : "This drop entry has no requirePlayerKill and defaults to true: non-player kills drop nothing.",
        "To make spawner farms drop items, set it to false explicitly; Fix all only writes the default out and does not change behavior.",
        "explicit-player-kill");
    }
    return diags;
  };

  /* ------------------------------------------------------------ 模拟器 */

  /**
   * 变体命中判断，逐条对应 VariantSelector.matches()。
   * snapshot = { healthFraction, name, tags, tamed }
   */
  C.selectorMatches = function (selector, snapshot) {
    if (selector === undefined || selector === null) return true;
    if (!C.isObj(selector)) return false;
    var snap = snapshot || {};
    if (selector.name != null) {
      if (String(snap.name || "") !== String(selector.name)) return false;
    }
    if (selector.nameRegex != null) {
      var pattern;
      try {
        pattern = new RegExp("(?:" + String(selector.nameRegex) + ")");
      } catch (error) {
        return false;
      }
      // Java 用 matcher().matches()：必须整串匹配，不是 find()
      if (!pattern.test(String(snap.name || ""))) return false;
    }
    if (C.isArr(selector.tags)) {
      var own = C.isArr(snap.tags) ? snap.tags : [];
      for (var i = 0; i < selector.tags.length; i++) {
        if (own.indexOf(selector.tags[i]) < 0) return false;
      }
    }
    if (typeof selector.tamed === "boolean") {
      if (Boolean(snap.tamed) !== selector.tamed) return false;
    }
    var fraction = C.isNum(snap.healthFraction) ? snap.healthFraction : 1;
    if (C.isNum(selector.healthBelow) && fraction >= selector.healthBelow) return false;
    if (C.isNum(selector.healthAbove) && fraction <= selector.healthAbove) return false;
    return true;
  };

  /** 变体的血量阈值：healthBelow 优先，其次 healthAbove，都没有就排到最后。 */
  C.variantThreshold = function (variant) {
    if (!C.isObj(variant) || !C.isObj(variant.select)) return Infinity;
    if (C.isNum(variant.select.healthBelow)) return variant.select.healthBelow;
    if (C.isNum(variant.select.healthAbove)) return variant.select.healthAbove;
    return Infinity;
  };

  /**
   * 按「下标越小 = 越深阶段」排好序的副本。只在同一组内部换位置：
   * 不同 tags / 名字的变体属于不同个体，互相之间没有深浅关系，不能被排序打乱。
   */
  C.sortVariants = function (variants) {
    var list = (C.isArr(variants) ? variants : []).slice();
    var groups = {};
    list.forEach(function (variant, index) {
      var key = C.selectIdentityKey(C.isObj(variant) ? variant.select : null);
      if (!groups[key]) groups[key] = [];
      groups[key].push(index);
    });
    Object.keys(groups).forEach(function (key) {
      var slots = groups[key];
      var ordered = slots.map(function (slot, position) {
        return { variant: list[slot], position: position, threshold: C.variantThreshold(list[slot]) };
      });
      ordered.sort(function (a, b) {
        if (a.threshold === b.threshold) return a.position - b.position;
        if (a.threshold === Infinity) return 1;
        if (b.threshold === Infinity) return -1;
        return a.threshold - b.threshold;
      });
      slots.forEach(function (slot, i) { list[slot] = ordered[i].variant; });
    });
    return list;
  };

  /** SpellCasterData.mergeWith：goals 拼接（变体在前），四个触发器只在变体没写时回落。 */
  C.mergeData = function (own, fallback) {
    var out = {};
    var keys = Object.keys(fallback || {});
    for (var i = 0; i < keys.length; i++) out[keys[i]] = fallback[keys[i]];
    keys = Object.keys(own || {});
    for (var j = 0; j < keys.length; j++) {
      if (keys[j] === "goals") continue;
      out[keys[j]] = own[keys[j]];
    }
    var goals = [];
    if (C.isArr(own && own.goals)) goals = goals.concat(own.goals);
